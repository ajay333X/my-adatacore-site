<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workstation — Adatacore</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
<style>
:root{--bg:#05050b;--panel:#11111c;--line:#242438;--text:#f7f7fb;--muted:#9090a7;--accent:#a78bfa;--green:#34d399;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171126 0,#05050b 48%);color:var(--text);font:14px Inter,system-ui,sans-serif}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:28px 18px;border-right:1px solid var(--line);background:rgba(8,8,15,.86)}.brand{font-weight:900;letter-spacing:.12em;margin-bottom:34px}.nav a,.nav button{display:block;width:100%;padding:12px 14px;margin:6px 0;border:0;border-radius:12px;background:transparent;color:var(--muted);text-align:left;text-decoration:none;cursor:pointer}.nav a:hover,.nav button:hover{background:#151523;color:#fff}.main{padding:34px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0 0 5px;font-size:30px}.muted{color:var(--muted)}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));margin:28px 0}.card{background:rgba(17,17,28,.86);border:1px solid var(--line);border-radius:18px;padding:20px}.label{text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:10px;font-weight:800}.value{font-size:28px;font-weight:900;margin-top:8px}.tasks{grid-template-columns:repeat(2,minmax(0,1fr))}.task{display:flex;flex-direction:column;gap:12px}.task h3{margin:0}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;background:#6d5ce7;color:#fff}.btn:disabled{opacity:.35;cursor:not-allowed}.status{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid var(--line);text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.stats,.tasks{grid-template-columns:1fr}.main{padding:22px}}
</style>
</head>
<body><div class="shell">
<aside class="side"><div class="brand">ADATACORE</div><div class="nav"><a href="/dashboard">Workspace</a><a href="/profile">Profile</a><div id="adminLink"></div><button id="logout">Logout</button></div></aside>
<main class="main"><div class="top"><div><h1 id="greeting">Loading workspace…</h1><div id="uid" class="muted"></div></div><div id="name" class="card">User</div></div>
<div class="grid stats"><div class="card"><div class="label">Wallet balance</div><div class="value">$<span id="balance">0.00</span></div></div><div class="card"><div class="label">Approved today</div><div class="value" id="today">$0.00</div></div><div class="card"><div class="label">7-day approved earnings</div><div class="value" id="week">$0.00</div></div></div>
<div class="card" style="margin-bottom:24px"><canvas id="chart" height="80"></canvas></div>
<h2>Current assignments</h2><div id="tasks" class="grid tasks"></div>
<h2 style="margin-top:34px">Submission history</h2><div class="card"><table><thead><tr><th>Project</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody id="history"></tbody></table></div>
</main></div>
<script>
const SB_URL='https://llmhyezgcnbognmmsnzq.supabase.co';const SB_KEY='sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml';const db=supabase.createClient(SB_URL,SB_KEY);let chart;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.replace('/auth');return}const {data:p,error}=await db.from('users').select('*').eq('id',user.id).single();if(error||!p){document.getElementById('greeting').textContent='Profile unavailable';return}document.getElementById('name').textContent=p.fullName||user.email;document.getElementById('uid').textContent='UID: '+(p.uniqueID||'N/A');document.getElementById('balance').textContent=Number(p.balance||0).toFixed(2);const h=new Date().getHours();document.getElementById('greeting').textContent=`${h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening'}, ${(p.fullName||'User').split(' ')[0]}`;if(p.role==='admin')document.getElementById('adminLink').innerHTML='<a href="/admin">Admin panel</a>';await Promise.all([loadTasks(p),loadHistory(p)]);}
async function loadTasks(p){const email=String(p.email||'').replaceAll(',','');const uid=String(p.uniqueID||'').replaceAll(',','');const {data,error}=await db.from('tasks').select('*').or(`assignedTo.eq.${email},assignedTo.eq.${uid}`).order('createdAt',{ascending:false});const box=document.getElementById('tasks');if(error||!data?.length){box.innerHTML='<div class="card empty">No active assignments</div>';return}box.innerHTML=data.map(t=>`<div class="card task"><div class="status">${esc(t.layer||'L1')} · ${esc(t.status||'pending')}</div><h3>${esc(t.title)}</h3><div class="muted">Rate: $${Number(t.price||0).toFixed(2)}</div><button class="btn" ${t.status!=='pending'?'disabled':''} onclick="openTask(${Number(t.id)},'${encodeURIComponent(t.title||'')}','${esc(t.layer||'L1')}')">${t.layer==='L1'?'Open voice task':'Open review task'}</button></div>`).join('')}
function openTask(id,title,layer){if(layer==='L1')location.href=`/voice-engine?project=${title}&task=${id}`;else if(layer==='L2')location.href=`/review?task=${id}`;}
async function loadHistory(p){const {data}=await db.from('submissions').select('*').eq('workerUID',p.uniqueID).order('timestamp',{ascending:false});const rows=data||[];document.getElementById('history').innerHTML=rows.length?rows.slice(0,20).map(s=>`<tr><td>${esc(s.projectTitle)}</td><td>$${Number(s.earnedAmount||0).toFixed(2)}</td><td>${esc(s.status||'Pending')}</td><td>${s.timestamp?new Date(s.timestamp).toLocaleDateString():''}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No submissions yet</td></tr>';const labels=[],vals=[];let today=0,week=0;for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const next=new Date(d);next.setDate(next.getDate()+1);const v=rows.filter(s=>s.status==='Approved'&&s.timestamp&&new Date(s.timestamp)>=d&&new Date(s.timestamp)<next).reduce((a,s)=>a+Number(s.earnedAmount||0),0);labels.push(d.toLocaleDateString(undefined,{weekday:'short'}));vals.push(v);week+=v;if(i===0)today=v}document.getElementById('today').textContent='$'+today.toFixed(2);document.getElementById('week').textContent='$'+week.toFixed(2);const ctx=document.getElementById('chart');chart=new Chart(ctx,{type:'line',data:{labels,datasets:[{data:vals,borderColor:'#a78bfa',backgroundColor:'rgba(167,139,250,.08)',fill:true,tension:.35}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9090a7'},grid:{display:false}},y:{ticks:{color:'#9090a7'},grid:{color:'#222236'}}}}})}
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.replace('/auth')};init();
</script></body></html>
