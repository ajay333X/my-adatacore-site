<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Transcript Review — Adatacore</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/design-system.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script defer src="/admin-done-task-review.js?v=1"></script>
<style>
.review-page{max-width:1320px;margin:0 auto;padding:24px 22px 70px}.review-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.review-head h1{margin:4px 0 6px}.meta-line{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.review-layout{display:grid;grid-template-columns:minmax(320px,.78fr) minmax(0,1.35fr);gap:16px}.player-card{padding:18px;position:sticky;top:18px;align-self:start}.player-title{font-size:15px;font-weight:850;word-break:break-word}.player-source{font-size:11px;color:var(--muted);margin-top:5px}.player-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}.player-controls button{min-width:42px}.time{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-left:auto}.seek{width:100%;margin-top:14px}.review-options{display:flex;gap:14px;align-items:center;margin-top:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.info-box{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.info-box span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.info-box strong{display:block;font-size:12px;margin-top:5px;word-break:break-word}.transcript-card{padding:0;overflow:hidden}.transcript-top{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.transcript-top h2{margin:0;font-size:16px}.segment-list{max-height:calc(100vh - 150px);overflow:auto;scroll-behavior:smooth;padding:10px}.segment{display:grid;grid-template-columns:68px minmax(0,1fr);gap:12px;padding:13px 12px;border:1px solid transparent;border-radius:12px;cursor:pointer;transition:.14s ease;margin-bottom:6px}.segment:hover{background:var(--panel2)}.segment.active{background:rgba(124,92,255,.11);border-color:rgba(124,92,255,.45);box-shadow:0 0 0 1px rgba(124,92,255,.08) inset}.segment-time{font:700 10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.segment-speaker{font-size:10px;font-weight:850;margin-bottom:5px}.segment-text{font-size:15px;line-height:1.62;white-space:pre-wrap;word-break:break-word}.segment.active .segment-text{color:var(--text)}.empty{padding:50px;text-align:center;color:var(--muted)}.now-reading{font-size:11px;color:var(--muted)}@media(max-width:900px){.review-page{padding:16px 12px 55px}.review-head{flex-direction:column}.review-layout{grid-template-columns:1fr}.player-card{position:static}.segment-list{max-height:none}.info-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.info-grid{grid-template-columns:1fr}.segment{grid-template-columns:58px 1fr}.time{width:100%;margin-left:0}}
</style>
</head>
<body>
<main class="review-page">
  <div class="review-head"><div><div class="eyebrow">Admin / Done Tasks / Submitted transcript</div><h1 id="pageTitle">Loading transcript…</h1><div id="pageMeta" class="meta-line"></div></div><a id="backLink" class="btn btn-secondary" href="/admin/done-tasks">← Done Tasks</a></div>
  <div id="notice" class="page-sub" role="status"></div>
  <div class="review-layout">
    <aside class="card player-card">
      <div class="eyebrow">Submitted audio</div><div id="audioName" class="player-title">Loading…</div><div id="audioSource" class="player-source"></div>
      <div class="player-controls"><button id="back5" class="btn btn-secondary">−5s</button><button id="play" class="btn btn-primary">▶ Play</button><button id="forward5" class="btn btn-secondary">+5s</button><select id="speed" class="input" style="width:auto"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><span id="time" class="time">00:00 / 00:00</span></div>
      <input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Audio position">
      <div class="review-options"><label><input id="follow" type="checkbox" checked> Follow transcript automatically</label><span id="nowReading" class="now-reading">Waiting for playback</span></div>
      <div class="info-grid"><div class="info-box"><span>Task ID</span><strong id="taskId">—</strong></div><div class="info-box"><span>Status</span><strong id="status">—</strong></div><div class="info-box"><span>Contributor</span><strong id="contributor">—</strong></div><div class="info-box"><span>Submitted</span><strong id="submittedAt">—</strong></div><div class="info-box"><span>Segments</span><strong id="segmentCount">0</strong></div><div class="info-box"><span>Duration</span><strong id="duration">—</strong></div></div>
      <audio id="audio" preload="metadata"></audio>
    </aside>
    <section class="card transcript-card"><div class="transcript-top"><div><div class="eyebrow">Human submission</div><h2>Submitted transcript</h2></div><span class="pill pill-brand">Read only</span></div><div id="segments" class="segment-list"><div class="empty">Loading submitted segments…</div></div></section>
  </div>
</main>
</body>
</html>
