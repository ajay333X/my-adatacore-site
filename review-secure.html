<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Queue — Adatacore</title><link rel="stylesheet" href="/design-system.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>.review-wrap{max-width:980px;margin:auto;padding:28px}.review-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.review-head h1{font-size:30px;margin:6px 0}.review-list{display:grid;gap:14px}.review-card{padding:20px}.review-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.review-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.review-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.empty-state{padding:54px 20px;text-align:center}@media(max-width:680px){.review-head,.review-top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="review-wrap"><header class="review-head"><div><a class="brand" href="/dashboard"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 18 10.7 5h2.6L19 18h-3.2l-1.1-2.8H9.2L8.1 18H5Zm5.2-5.4h3.6L12 8l-1.8 4.6Z" fill="#A78BFA"/></svg></span>Adatacore</a><div class="eyebrow" style="margin-top:28px">Reviewer workspace</div><h1 class="title">L2 review queue</h1><div id="meta" class="page-sub">Validating reviewer assignment…</div></div><a class="btn btn-secondary" href="/dashboard">← Dashboard</a></header><div class="surface" style="padding:18px 20px;margin-bottom:18px"><div class="data-row"><div><strong>Review responsibility</strong><div class="muted" style="font-size:12px;margin-top:5px">Validate pending submissions for the project assigned to this reviewer task.</div></div><span class="pill pill-brand">L2</span></div></div><main id="list" class="review-list"><div class="card empty-state">Loading review queue…</div></main></div><script>
const U='https://llmhyezgcnbognmmsnzq.supabase.co',K='sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml',db=supabase.createClient(U,K),taskId=Number(new URLSearchParams(location.search).get('task')||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const {data:{user}}=await db.auth.getUser();if(!user)return location.replace('/auth');if(!taskId){meta.textContent='Invalid reviewer task';list.innerHTML='<div class="card empty-state">The reviewer task link is invalid.</div>';return}const {data:t}=await db.from('tasks').select('id,title,layer,status').eq('id',taskId).maybeSingle();if(!t||t.layer!=='L2'||t.status!=='pending'){meta.textContent='Reviewer assignment unavailable';list.innerHTML='<div class="card empty-state">This review assignment is no longer available.</div>';return}meta.textContent=t.title+' · secure reviewer assignment';const {data,error}=await db.rpc('get_review_queue',{p_task_id:taskId});if(error){list.innerHTML='<div class="card empty-state">'+esc(error.message)+'</div>';return}const rows=data||[];list.innerHTML=rows.length?rows.map(s=>`<article class="card review-card"><div class="review-top"><div><div class="eyebrow">Submission #${Number(s.submission_id)}</div><h3 style="margin:7px 0 0;font-size:18px">${esc(s.project_title)}</h3><div class="review-meta"><span class="pill">Worker ${esc(s.worker_uid)}</span><span class="pill pill-brand">$${Number(s.earned_amount||0).toFixed(2)}</span><span class="pill">${s.submitted_at?new Date(s.submitted_at).toLocaleString():''}</span></div></div><span class="pill pill-green">Ready for review</span></div><div class="review-actions"><button class="btn btn-primary" onclick='decide(${s.submission_id},"Reviewed")'>Pass to final audit →</button><button class="btn btn-danger" onclick='decide(${s.submission_id},"Rejected")'>Reject</button></div></article>`).join(''):'<div class="card empty-state"><strong>No pending submissions.</strong><div class="muted" style="margin-top:8px">There is nothing waiting for review in this project.</div></div>'}async function decide(id,d){if(!confirm(d==='Reviewed'?'Send this submission to final admin audit?':'Reject this submission?'))return;const {error}=await db.rpc('review_submission',{p_task_id:taskId,p_submission_id:id,p_decision:d});if(error)alert(error.message);else load()}load();
</script></body></html>
