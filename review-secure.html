<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Queue — Adatacore</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>:root{--bg:#05050b;--p:#11111c;--l:#25253a;--t:#f7f7fb;--m:#9090a7;--a:#a78bfa;--g:#34d399;--r:#fb7185}*{box-sizing:border-box}body{margin:0;background:#05050b;color:var(--t);font:14px Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:14px}.muted{color:var(--m)}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:#6d5ce7;color:#fff}.btn.danger{background:#411723}.empty{text-align:center;padding:30px;color:var(--m)}@media(max-width:650px){.row,.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>L2 Review Queue</h1><div id="meta" class="muted">Validating reviewer assignment…</div></div><a class="btn" href="/dashboard">Dashboard</a></div><div id="list"></div></div><script>const U='https://llmhyezgcnbognmmsnzq.supabase.co',K='sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml',db=supabase.createClient(U,K),taskId=Number(new URLSearchParams(location.search).get('task')||0);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const {data:{user}}=await db.auth.getUser();if(!user)return location.replace('/auth');if(!taskId){meta.textContent='Invalid reviewer task';return}const {data:t}=await db.from('tasks').select('id,title,layer,status').eq('id',taskId).maybeSingle();if(!t||t.layer!=='L2'||t.status!=='pending'){meta.textContent='Reviewer assignment is unavailable';return}meta.textContent=t.title+' · Secure reviewer assignment';const {data,error}=await db.rpc('get_review_queue',{p_task_id:taskId});if(error){list.innerHTML='<div class="card empty">'+esc(error.message)+'</div>';return}const rows=data||[];list.innerHTML=rows.length?rows.map(s=>`<div class=card><div class=row><div><b>${esc(s.project_title)}</b><div class=muted>Worker ${esc(s.worker_uid)} · $${Number(s.earned_amount||0).toFixed(2)} · ${s.submitted_at?new Date(s.submitted_at).toLocaleString():''}</div></div><div><button class=btn onclick='decide(${s.submission_id},"Reviewed")'>Pass to final audit</button> <button class='btn danger' onclick='decide(${s.submission_id},"Rejected")'>Reject</button></div></div></div>`).join(''):'<div class="card empty">No pending submissions for this project.</div>'}async function decide(id,d){if(!confirm(d==='Reviewed'?'Send this submission to final admin audit?':'Reject this submission?'))return;const {error}=await db.rpc('review_submission',{p_task_id:taskId,p_submission_id:id,p_decision:d});if(error)alert(error.message);else load()}load();</script></body></html>
