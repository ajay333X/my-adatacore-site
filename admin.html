<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin Control — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050510; color: white; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(155, 135, 245, 0.1); border-radius: 28px; }
        .admin-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; width: 100%; outline: none; font-size: 14px; }
        .admin-input:focus { border-color: #A78BFA; background: rgba(167, 139, 250, 0.05); }
        .hidden { display: none; }
        .text-gradient { background: linear-gradient(to bottom right, #FFFFFF 30%, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="p-8">

    <div id="access-denied" class="hidden flex flex-col items-center justify-center h-screen text-center">
        <h1 class="text-6xl mb-4">🔐</h1>
        <h2 class="text-2xl font-bold text-red-500">Authorized Personnel Only</h2>
        <p class="text-gray-500 mt-2">Access restricted to as4556676@gmail.com</p>
        <a href="dashboard.html" class="mt-6 text-purple-400 underline">Exit System</a>
    </div>

    <div id="admin-content" class="max-w-6xl mx-auto hidden">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gradient">Project Control Center</h1>
                <p class="text-gray-500 text-sm">Manage your contributors and push new tasks.</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-white/5 px-5 py-2 rounded-xl border border-white/10 text-xs hover:bg-white/10 transition-all">➔ Dashboard</button>
        </header>

        <div class="glass p-8 mb-8 border-green-500/10">
            <h3 class="text-lg font-bold mb-6 text-green-400 flex items-center gap-2">
                <span>🔍</span> Contributor Lookup
            </h3>
            <div class="flex gap-4 mb-6">
                <input type="text" id="searchInput" class="admin-input flex-1" placeholder="Enter Worker Email or Unique ID (e.g. AD-XXXX)">
                <button id="btn-search" class="bg-green-600 hover:bg-green-500 px-8 py-3 rounded-xl font-bold transition-all text-sm">SEARCH</button>
            </div>
            <div id="search-result" class="hidden">
                </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 glass p-8 h-fit sticky top-8">
                <h3 class="text-lg font-bold mb-6 text-purple-400">Deploy New Project</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Worker Unique ID</label>
                        <input type="text" id="targetID" class="admin-input" placeholder="AD-XXXX-XXXX-XXXX">
                    </div>
                    
                    <div>
                        <label class="text-[10px] uppercase font-bold text-yellow-500 mb-1 block">Select Project Type (Tool)</label>
                        <select id="targetPage" class="admin-input border-yellow-500/30 bg-[#050510]">
                            <option value="task_player.html">Ajay Test Demo (Voice Recording)</option>
                            <option value="image_labeling.html">Image Labeling Tool</option>
                            <option value="text_entry.html">Data Entry Tool</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Display Title</label>
                        <input type="text" id="taskTitle" class="admin-input" placeholder="e.g. Recording Task #101">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Rate ($/Hr)</label>
                            <input type="number" id="taskPrice" class="admin-input" placeholder="8.00">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Category</label>
                            <select id="taskType" class="admin-input bg-[#050510]">
                                <option value="Audio">Audio</option>
                                <option value="Image">Image</option>
                                <option value="Text">Text</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Instructions</label>
                        <textarea id="taskDesc" class="admin-input h-20 resize-none" placeholder="What should the worker do?"></textarea>
                    </div>

                    <button id="btn-assign" class="w-full bg-purple-600 hover:bg-purple-500 py-4 rounded-xl font-bold shadow-lg transition-all mt-4">PUSH PROJECT 🚀</button>
                </div>
            </div>

            <div class="lg:col-span-8 glass p-8">
                <h3 class="text-lg font-bold mb-6">Live Global Assignments</h3>
                <div id="admin-task-list" class="space-y-4">
                    <p class="text-gray-600 animate-pulse text-sm">Syncing with Adatacore Cloud...</p>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, orderBy, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPBpzQfnilr2vm7kdRiNqOH89u7uxCjrk",
            authDomain: "adatacore-f.firebaseapp.com",
            projectId: "adatacore-f",
            storageBucket: "adatacore-f.firebasestorage.app",
            messagingSenderId: "806498602099",
            appId: "1:806498602099:web:426b145c9c0a0bd9c7ae06",
            measurementId: "G-740M8K5M0J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "as4556676@gmail.com";

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('admin-content').classList.remove('hidden');
                loadAllTasks();
            } else {
                document.getElementById('access-denied').classList.remove('hidden');
            }
        });

        // --- CONTRIBUTOR LOOKUP LOGIC ---
        document.getElementById('btn-search').onclick = async () => {
            const input = document.getElementById('searchInput').value.trim();
            const resultDiv = document.getElementById('search-result');
            
            if(!input) return Swal.fire('Wait', 'Enter Email or UID to search', 'info');
            
            resultDiv.innerHTML = `<div class="py-10 text-center text-gray-500 animate-pulse">Searching Adatacore Cloud...</div>`;
            resultDiv.classList.remove('hidden');

            try {
                // Query by UID
                let userQuery = query(collection(db, "users"), where("uniqueID", "==", input));
                let userSnap = await getDocs(userQuery);

                // If not found, Query by Email
                if(userSnap.empty) {
                    userQuery = query(collection(db, "users"), where("email", "==", input));
                    userSnap = await getDocs(userQuery);
                }

                if(userSnap.empty) {
                    resultDiv.innerHTML = `<div class="p-6 bg-red-500/10 border border-red-500/20 rounded-2xl text-red-400 text-sm">No contributor found with this ID or Email.</div>`;
                    return;
                }

                const userData = userSnap.docs[0].data();
                const userUID = userData.uniqueID;

                // Find active tasks for this worker
                const taskQuery = query(collection(db, "tasks"), where("assignedTo", "==", userUID));
                const taskSnap = await getDocs(taskQuery);
                
                let tasksHtml = "";
                taskSnap.forEach(tDoc => {
                    const t = tDoc.data();
                    tasksHtml += `<div class="text-[11px] bg-white/5 p-3 rounded-lg border border-white/5 mb-2 flex justify-between items-center">
                        <span><b class="text-purple-400">${t.title}</b> (${t.type})</span>
                        <span class="text-gray-500">$${t.price}/hr</span>
                    </div>`;
                });

                resultDiv.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 bg-white/5 rounded-[32px] border border-white/10 animate-in fade-in slide-in-from-top-2">
                        <div>
                            <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-4">Contributor Profile</h4>
                            <div class="space-y-2">
                                <p class="text-xl font-bold">${userData.fullName}</p>
                                <p class="text-sm text-gray-400">${userData.email}</p>
                                <p class="text-sm font-mono text-purple-400">${userData.uniqueID}</p>
                                <div class="mt-4 p-4 bg-green-500/10 border border-green-500/20 rounded-xl">
                                    <span class="text-[10px] uppercase font-bold text-green-500 block">Current Balance</span>
                                    <span class="text-2xl font-bold text-green-400">$${(userData.balance || 0).toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-4">Current Assignments</h4>
                            <div class="max-h-[200px] overflow-y-auto pr-2">
                                ${tasksHtml || '<p class="text-gray-600 italic text-sm">No active projects assigned.</p>'}
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                resultDiv.innerHTML = `<p class="text-red-500">Error: ${err.message}</p>`;
            }
        };

        // --- DEPLOY TASK LOGIC ---
        document.getElementById('btn-assign').onclick = async () => {
            const targetID = document.getElementById('targetID').value.trim();
            const title = document.getElementById('taskTitle').value;
            const price = parseFloat(document.getElementById('taskPrice').value) || 0;
            const desc = document.getElementById('taskDesc').value;
            const type = document.getElementById('taskType').value;
            const targetPage = document.getElementById('targetPage').value;

            if(!targetID || !title) return Swal.fire('Missing Data', 'Unique ID and Title are required.', 'warning');

            try {
                await addDoc(collection(db, "tasks"), {
                    assignedTo: targetID,
                    title: title,
                    price: price,
                    description: desc,
                    type: type,
                    targetPage: targetPage, 
                    status: "active",
                    createdAt: new Date()
                });
                
                Swal.fire({ icon: 'success', title: 'Deployed!', text: `Project pushed to ${targetID}`, background: '#1A1A2E', color: '#fff' });
                
                document.getElementById('targetID').value = "";
                document.getElementById('taskTitle').value = "";
                document.getElementById('taskDesc').value = "";
            } catch (err) { Swal.fire('Error', err.message, 'error'); }
        };

        // --- REAL-TIME TASK LIST ---
        function loadAllTasks() {
            const q = query(collection(db, "tasks"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('admin-task-list');
                list.innerHTML = "";
                
                if(snap.empty) {
                    list.innerHTML = `<div class="text-center py-10 text-gray-600 italic">No tasks currently assigned.</div>`;
                    return;
                }

                snap.forEach((taskDoc) => {
                    const t = taskDoc.data();
                    list.innerHTML += `
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-6 bg-white/5 rounded-3xl border border-white/5 hover:border-purple-500/30 transition-all">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-[9px] bg-purple-500/20 text-purple-300 font-bold px-2 py-0.5 rounded-full uppercase">${t.type}</span>
                                    <span class="text-[10px] text-gray-500 font-mono tracking-tighter">ID: ${t.assignedTo}</span>
                                </div>
                                <h4 class="font-bold text-white">${t.title}</h4>
                                <p class="text-[10px] text-gray-500 mt-1">Tool: <span class="text-yellow-500">${t.targetPage}</span> • Rate: $${t.price}/hr</p>
                            </div>
                            <button onclick="removeTask('${taskDoc.id}')" class="mt-4 md:mt-0 text-[10px] font-bold text-red-400 hover:bg-red-500/10 px-4 py-2 rounded-xl border border-red-500/10 transition-all">TERMINATE</button>
                        </div>
                    `;
                });
            });
        }

        window.removeTask = async (id) => {
            const result = await Swal.fire({
                title: 'Terminate?',
                text: "User will lose access immediately.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#EF4444',
                confirmButtonText: 'Remove'
            });
            if(result.isConfirmed) await deleteDoc(doc(db, "tasks", id));
        }
    </script>
</body>
</html>
