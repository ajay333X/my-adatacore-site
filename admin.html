<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Adatacore — Master Admin v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050510; color: white; min-height: 100vh; overflow-x: hidden; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 16px; color: #94a3b8; transition: 0.3s; cursor: pointer; font-size: 14px; font-weight: 600; }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-link.active { background: #A78BFA; color: #000; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.1); }
        .admin-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; width: 100%; outline: none; font-size: 13px; }
        .content-section { display: none; }
        .content-section.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex">

    <!-- SIDEBAR -->
    <aside class="w-72 h-screen border-r border-white/5 p-6 flex flex-col gap-8 shrink-0 sticky top-0">
        <div class="flex items-center gap-3 px-2">
            <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center font-bold text-white shadow-lg">A</div>
            <span class="font-bold tracking-tight text-lg text-white uppercase">Adatacore Admin</span>
        </div>
        <nav class="flex flex-col gap-1">
            <div onclick="showSection('project-lab')" class="nav-link active" id="btn-project-lab">🧪 <span>Project Lab</span></div>
            <div onclick="showSection('deploy')" class="nav-link" id="btn-deploy">🚀 <span>Assign Task</span></div>
            <div onclick="showSection('revoke')" class="nav-link" id="btn-revoke">🛡️ <span>Revoke Task</span></div>
        </nav>
        <div class="mt-auto">
            <button onclick="window.location.href='dashboard.html'" class="w-full py-3 rounded-xl bg-white/5 border border-white/10 text-[10px] font-bold tracking-widest hover:bg-white/10 transition-all uppercase text-white">← Dashboard</button>
        </div>
    </aside>

    <main class="flex-1 min-h-screen p-12 text-white overflow-y-auto">
        
        <!-- SECTION 1: PROJECT LAB (Creation & Registry) -->
        <section id="project-lab" class="content-section active">
            <h2 class="text-3xl font-bold uppercase tracking-tighter mb-8">Project Lab</h2>
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-10">
                <div class="glass p-8 rounded-[32px] space-y-6">
                    <h3 class="text-xs font-black text-purple-400 uppercase tracking-widest">Create New Project</h3>
                    <input type="text" id="lab-project-name" class="admin-input" placeholder="Project Name (e.g. Podcast_Live)">
                    <div class="flex items-center gap-4">
                        <label class="text-[10px] uppercase font-bold text-gray-500">Theme Color:</label>
                        <input type="color" id="lab-accent-color" class="w-10 h-10 bg-transparent border-none cursor-pointer" value="#A78BFA">
                    </div>
                    <textarea id="lab-logic-code" class="admin-input h-48 font-mono text-[10px]" placeholder="// Inject JS Logic here..."></textarea>
                    <button onclick="publishProject()" class="w-full bg-white text-black py-4 rounded-2xl font-black text-xs uppercase hover:bg-purple-500 hover:text-white transition-all shadow-xl">PUBLISH PROJECT 🚀</button>
                </div>

                <div class="space-y-6">
                    <h3 class="text-xs font-black text-gray-500 uppercase tracking-widest">Active Registry</h3>
                    <div id="registry-grid" class="grid grid-cols-1 gap-4"></div>
                </div>
            </div>
        </section>

        <!-- SECTION 2: ASSIGN TASK (Deployment) -->
        <section id="deploy" class="content-section">
            <h2 class="text-2xl font-bold mb-8 uppercase tracking-tighter">Assign Task</h2>
            <div class="glass p-10 rounded-[40px] max-w-2xl space-y-5 border-t-4 border-yellow-600">
                <input type="text" id="targetUID" class="admin-input" placeholder="User Email or Unique ID">
                <select id="project-select-assign" class="admin-input bg-[#0a0a15] text-purple-400 uppercase font-bold sync-dropdown"></select>
                <input type="number" id="taskPrice" class="admin-input" placeholder="Payout Amount ($)">
                <button onclick="assignTask()" class="w-full bg-yellow-600 py-4 rounded-2xl font-black text-xs text-black shadow-lg">DEPLOY TASK ➔</button>
            </div>
        </section>

        <!-- SECTION 3: REVOKE TASK (Removal) -->
        <section id="revoke" class="content-section">
            <h2 class="text-2xl font-bold mb-8 uppercase tracking-tighter">Revoke Task Access</h2>
            <div class="glass p-10 rounded-[40px] max-w-2xl space-y-5 border-t-4 border-red-600">
                <p class="text-[10px] text-gray-400 uppercase font-bold mb-2">Remove a project from a specific user's dashboard</p>
                <input type="text" id="revoke-email" class="admin-input" placeholder="User Email or Unique ID">
                <select id="project-select-revoke" class="admin-input bg-[#0a0a15] text-red-400 uppercase font-bold sync-dropdown"></select>
                <button onclick="revokeTask()" class="w-full bg-red-600 py-4 rounded-2xl font-black text-xs text-white uppercase shadow-lg">REVOKE ACCESS ➔</button>
            </div>
        </section>

    </main>

    <script>
        // Supabase Configuration
        const SB_URL = "https://llmhyezgcnbognmmsnzq.supabase.co";
        const SB_KEY = "sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // Section Toggling
        window.showSection = (id) => {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
        };

        // 1. Publish Project
        async function publishProject() {
            const name = document.getElementById('lab-project-name').value.trim();
            const logic = document.getElementById('lab-logic-code').value;
            const accent = document.getElementById('lab-accent-color').value;

            if(!name) return Swal.fire('Error', 'Project Name is required', 'error');

            const { error } = await _supabase.from('project_lab').insert([{
                project_name: name,
                config: { accent, logic, modules: { audio: true, text: true } },
                is_published: true
            }]);

            if(!error) {
                Swal.fire('Success', 'Project Published!', 'success');
                loadData();
            }
        }

        // 2. Load Data & Sync Dropdowns
        async function loadData() {
            const { data: projects } = await _supabase.from('project_lab').select('*').order('created_at', { ascending: false });
            
            // Render Registry Cards
            document.getElementById('registry-grid').innerHTML = projects.map(p => `
                <div class="glass p-5 rounded-2xl border-l-4 flex justify-between items-center" style="border-color:${p.config.accent}">
                    <div>
                        <h4 class="text-sm font-bold uppercase">${p.project_name}</h4>
                        <p class="text-[8px] text-gray-500 uppercase mt-1">ID: ${p.id}</p>
                    </div>
                    <button onclick="globalDestroy(${p.id}, '${p.project_name}')" class="text-[10px] font-black text-red-500 hover:underline uppercase">Destroy</button>
                </div>
            `).join('');

            // Sync Dropdowns
            const options = '<option value="">-- SELECT PROJECT --</option>' + projects.map(p => `<option value="${p.project_name}">${p.project_name}</option>`).join('');
            document.querySelectorAll('.sync-dropdown').forEach(d => d.innerHTML = options);
        }

        // 3. Assign Task
        async function assignTask() {
            const target = document.getElementById('targetUID').value.trim();
            const project = document.getElementById('project-select-assign').value;
            const price = document.getElementById('taskPrice').value;

            if(!target || !project) return Swal.fire('Error', 'Missing details', 'warning');

            const { error } = await _supabase.from('tasks').insert([{ assignedTo: target, title: project, price }]);
            if(!error) Swal.fire('Deployed', 'Task assigned to ' + target, 'success');
        }

        // 4. Revoke Task (Individual Removal)
        async function revokeTask() {
            const target = document.getElementById('revoke-email').value.trim();
            const project = document.getElementById('project-select-revoke').value;

            const { error, count } = await _supabase.from('tasks').delete({ count: 'exact' }).eq('assignedTo', target).eq('title', project);
            if(!error && count > 0) Swal.fire('Revoked', 'Project removed from user dashboard', 'success');
            else Swal.fire('Not Found', 'Could not find this task for the user', 'info');
        }

        // 5. Global Destroy (Delete from all users)
        async function globalDestroy(id, name) {
            const { value: confirm } = await Swal.fire({
                title: 'Destroy Project?',
                text: `This will remove '${name}' from ALL user dashboards and the registry!`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444'
            });

            if(confirm) {
                await _supabase.from('tasks').delete().eq('title', name); // Wipe from users
                await _supabase.from('project_lab').delete().eq('id', id); // Wipe from lab
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
