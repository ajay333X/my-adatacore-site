<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Master Control — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050510; color: white; min-height: 100vh; overflow-x: hidden; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 16px; color: #94a3b8; transition: 0.3s; cursor: pointer; font-size: 14px; font-weight: 600; }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-link.active { background: #A78BFA; color: #000; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.1); }
        .admin-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; width: 100%; outline: none; font-size: 13px; }
        .content-section { display: none; }
        .content-section.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        td { background: rgba(255,255,255,0.02); padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
    </style>
</head>
<body class="flex">

    <!-- SIDEBAR -->
    <aside class="w-72 h-screen border-r border-white/5 p-6 flex flex-col gap-8 shrink-0 sticky top-0">
        <div class="flex items-center gap-3 px-2">
            <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center font-bold text-white shadow-lg">A</div>
            <span class="font-bold tracking-tight text-lg text-white uppercase">Adatacore Admin</span>
        </div>
        <nav class="flex flex-col gap-1">
            <div onclick="showSection('analytics')" class="nav-link active" id="btn-analytics">📊 <span>Platform Stats</span></div>
            <div onclick="showSection('project-lab')" class="nav-link" id="btn-project-lab">🧪 <span>Project Lab</span></div>
            <div onclick="showSection('vault')" class="nav-link" id="btn-vault">📦 <span>Review Center</span></div>
            <div onclick="showSection('search')" class="nav-link" id="btn-search">🛡️ <span>User Lookup</span></div>
            <div onclick="showSection('deploy')" class="nav-link" id="btn-deploy">🚀 <span>Assign Task</span></div>
            <div onclick="showSection('broadcast')" class="nav-link" id="btn-broadcast">📢 <span>Broadcast</span></div>
        </nav>
        <div class="mt-auto">
            <button onclick="window.location.href='dashboard.html'" class="w-full py-3 rounded-xl bg-white/5 border border-white/10 text-[10px] font-bold tracking-widest hover:bg-white/10 transition-all uppercase text-white">← Dashboard</button>
        </div>
    </aside>

    <main class="flex-1 min-h-screen p-12 text-white overflow-y-auto">
        
        <!-- PROJECT LAB SECTION -->
        <section id="project-lab" class="content-section">
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h2 class="text-2xl font-bold uppercase tracking-tighter">Project Lab</h2>
                    <p class="text-[10px] text-gray-500 uppercase mt-1">Design and publish dynamic projects</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <!-- Project Builder -->
                <div class="glass p-8 rounded-[32px] space-y-6">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-2">Project Name</label>
                        <input type="text" id="lab-project-name" class="admin-input" placeholder="e.g., Hindi Audio Collection">
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-2">Primary Category</label>
                        <div class="flex gap-2">
                            <button onclick="setProjectType('audio')" class="flex-1 py-3 bg-white/5 border border-white/10 rounded-xl text-[10px] font-bold type-btn" id="type-audio">AUDIO</button>
                            <button onclick="setProjectType('text')" class="flex-1 py-3 bg-white/5 border border-white/10 rounded-xl text-[10px] font-bold type-btn" id="type-text">TEXT</button>
                            <button onclick="setProjectType('video')" class="flex-1 py-3 bg-white/5 border border-white/10 rounded-xl text-[10px] font-bold type-btn" id="type-video">VIDEO</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-2">Layout Components (JSON/Config)</label>
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <label class="flex items-center gap-2 text-xs bg-white/5 p-3 rounded-xl cursor-pointer">
                                <input type="checkbox" id="comp-audio-rec" checked> Audio Recorder
                            </label>
                            <label class="flex items-center gap-2 text-xs bg-white/5 p-3 rounded-xl cursor-pointer">
                                <input type="checkbox" id="comp-text-box"> Text Input
                            </label>
                            <label class="flex items-center gap-2 text-xs bg-white/5 p-3 rounded-xl cursor-pointer">
                                <input type="checkbox" id="comp-video-player"> Video Player
                            </label>
                            <label class="flex items-center gap-2 text-xs bg-white/5 p-3 rounded-xl cursor-pointer">
                                <input type="checkbox" id="comp-image-preview"> Image Box
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-2">Custom Code Injection (Optional HTML)</label>
                        <textarea id="lab-custom-code" class="admin-input h-32 font-mono text-[11px]" placeholder="<div style='color:red'>Custom UI...</div>"></textarea>
                    </div>

                    <button onclick="saveProjectToLab()" class="w-full bg-purple-600 py-4 rounded-xl font-bold text-sm uppercase transition-all hover:bg-purple-500 shadow-xl shadow-purple-500/20">SAVE & PUBLISH PROJECT 🚀</button>
                </div>

                <!-- Existing Lab Projects -->
                <div class="space-y-4">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest border-b border-white/5 pb-3">Available Templates</h3>
                    <div id="lab-project-list" class="space-y-3">
                        <!-- Dynamic List -->
                    </div>
                </div>
            </div>
        </section>

        <!-- (Keep your existing sections here: Analytics, Vault, Search, etc.) -->
        <section id="analytics" class="content-section active"><h2>Analytics Loading...</h2></section>
        <section id="vault" class="content-section"><h2>Vault Loading...</h2></section>
        <section id="search" class="content-section"><h2>Search Loading...</h2></section>
        <section id="deploy" class="content-section">
            <h2 class="text-2xl font-bold mb-8 uppercase tracking-tighter">Assign Task</h2>
            <div class="glass p-8 rounded-[32px] max-w-2xl space-y-4">
                <input type="text" id="targetUID" class="admin-input" placeholder="Worker UID">
                <select id="deploy-project-select" class="admin-input bg-[#0a0a15]">
                    <option value="">-- Select Lab Project --</option>
                </select>
                <input type="number" id="taskPrice" class="admin-input" placeholder="Reward Amount ($)">
                <button onclick="assignLabProject()" class="w-full bg-yellow-600 py-4 rounded-xl font-bold text-black uppercase">Assign Project ➔</button>
            </div>
        </section>
        <section id="broadcast" class="content-section"><h2>Broadcast Loading...</h2></section>

    </main>

    <script>
        const SB_URL = "https://llmhyezgcnbognmmsnzq.supabase.co";
        const SB_KEY = "sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);
        
        let selectedType = 'audio';

        window.showSection = (id) => {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(document.getElementById('btn-' + id)) document.getElementById('btn-' + id).classList.add('active');
        };

        async function init() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) { window.location.href = "auth.html"; return; }
            loadLabProjects();
        }

        // --- PROJECT LAB LOGIC ---
        window.setProjectType = (type) => {
            selectedType = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('bg-purple-600', 'text-black'));
            document.getElementById('type-' + type).classList.add('bg-purple-600', 'text-black');
        };

        async function saveProjectToLab() {
            const name = document.getElementById('lab-project-name').value.trim();
            if(!name) return Swal.fire('Error', 'Project Name is required', 'error');

            const config = {
                audio_recorder: document.getElementById('comp-audio-rec').checked,
                text_input: document.getElementById('comp-text-box').checked,
                video_player: document.getElementById('comp-video-player').checked,
                image_preview: document.getElementById('comp-image-preview').checked
            };

            const customCode = document.getElementById('lab-custom-code').value;

            Swal.fire({ title: 'Publishing...', didOpen: () => Swal.showLoading() });

            const { error } = await _supabase.from('project_lab').insert([{
                project_name: name,
                project_type: selectedType,
                config: config,
                style_config: { custom_html: customCode },
                is_published: true
            }]);

            if(!error) {
                Swal.fire('Success', 'Project Lab Template Created!', 'success');
                loadLabProjects();
                document.getElementById('lab-project-name').value = "";
            } else {
                Swal.fire('Error', error.message, 'error');
            }
        }

        async function loadLabProjects() {
            const { data } = await _supabase.from('project_lab').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('lab-project-list');
            const select = document.getElementById('deploy-project-select');

            list.innerHTML = data?.map(p => `
                <div class="p-4 glass flex justify-between items-center rounded-2xl border-l-4 border-purple-600">
                    <div>
                        <p class="font-bold text-sm uppercase">${p.project_name}</p>
                        <p class="text-[9px] text-gray-500 uppercase">${p.project_type} • Created: ${new Date(p.created_at).toLocaleDateString()}</p>
                    </div>
                    <button onclick="deleteLabProject(${p.id})" class="text-red-500 text-[10px] font-bold">DELETE</button>
                </div>
            `).join('') || "";

            // Populate assignment dropdown
            select.innerHTML = '<option value="">-- Select Lab Project --</option>' + 
                data?.map(p => `<option value="${p.project_name}">${p.project_name}</option>`).join('');
        }

        window.deleteLabProject = async (id) => {
            const { error } = await _supabase.from('project_lab').delete().eq('id', id);
            loadLabProjects();
        };

        // --- TASK ASSIGNMENT LOGIC ---
        async function assignLabProject() {
            const uid = document.getElementById('targetUID').value.trim();
            const pName = document.getElementById('deploy-project-select').value;
            const price = parseFloat(document.getElementById('taskPrice').value) || 0;

            if(!uid || !pName) return Swal.fire('Error', 'UID and Project are required', 'error');

            const { error } = await _supabase.from('tasks').insert([{
                assignedTo: uid,
                title: pName,
                price: price
            }]);

            if(!error) {
                Swal.fire('Assigned', `Project ${pName} assigned to ${uid}`, 'success');
            } else {
                Swal.fire('Error', error.message, 'error');
            }
        }

        init();
    </script>
</body>
</html>
