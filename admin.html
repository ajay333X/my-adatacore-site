<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin Control — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050510; color: white; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(155, 135, 245, 0.1); border-radius: 28px; }
        .admin-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; width: 100%; outline: none; font-size: 14px; }
        .admin-input:focus { border-color: #A78BFA; background: rgba(167, 139, 250, 0.05); }
        .hidden { display: none; }
        .text-gradient { background: linear-gradient(to bottom right, #FFFFFF 30%, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        table { width: 100%; border-spacing: 0 8px; border-collapse: separate; }
        th { color: #94a3b8; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; padding: 0 16px; text-align: left; }
        td { background: rgba(255,255,255,0.02); padding: 16px; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
        td:first-child { border-left: 1px solid rgba(255,255,255,0.05); border-radius: 16px 0 0 16px; }
        td:last-child { border-right: 1px solid rgba(255,255,255,0.05); border-radius: 0 16px 16px 0; }
        audio { height: 32px; width: 160px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); opacity: 0.6; }
    </style>
</head>
<body class="p-8">

    <div id="access-denied" class="hidden flex flex-col items-center justify-center h-screen text-center">
        <h1 class="text-6xl mb-4">🔐</h1>
        <h2 class="text-2xl font-bold text-red-500">Authorized Personnel Only</h2>
        <a href="dashboard.html" class="mt-6 text-purple-400 underline">Exit System</a>
    </div>

    <div id="admin-content" class="max-w-6xl mx-auto hidden">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gradient">Master Control Panel</h1>
                <p class="text-gray-500 text-sm">System Authority Management</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-white/5 px-5 py-2 rounded-xl border border-white/10 text-xs hover:bg-white/10 transition-all">➔ Dashboard</button>
        </header>

        <div class="glass p-8 mb-8 border-red-500/10">
            <h3 class="text-lg font-bold mb-6 text-red-400 flex items-center gap-2">
                <span>🔑</span> Super Authority
            </h3>
            <div class="flex gap-4">
                <input type="email" id="adminEmailInput" class="admin-input flex-1" placeholder="Enter Email to Grant Admin Access">
                <button id="btn-make-admin" class="bg-red-600 hover:bg-red-500 px-8 py-3 rounded-xl font-bold transition-all text-sm uppercase">GRANT ACCESS</button>
            </div>
        </div>

        <div class="glass p-8 mb-8 border-blue-500/10">
            <h3 class="text-lg font-bold mb-6 text-blue-400 flex items-center gap-2">
                <span>📦</span> Project Data Vault
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <div>
                    <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Select Project</label>
                    <select id="auditProjectSelect" class="admin-input bg-[#050510]">
                        <option value="">-- View All --</option>
                        <option value="Ajay demo">Ajay demo</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="btn-fetch-vault" class="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-xl font-bold transition-all text-sm w-full uppercase">FETCH SUBMISSIONS</button>
                </div>
            </div>
            <div id="vault-results" class="hidden overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th>Contributor</th>
                            <th>Duration</th>
                            <th>Payout</th>
                            <th>Audio Review</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="vault-table-body"></tbody>
                </table>
            </div>
        </div>

        <div class="glass p-8 mb-8 border-purple-500/10">
            <h3 class="text-lg font-bold mb-6 text-purple-400 flex items-center gap-2">
                <span>🛡️</span> Manage Contributors
            </h3>
            <div class="flex gap-4 mb-6">
                <input type="text" id="searchInput" class="admin-input flex-1" placeholder="Search Email or UID...">
                <button id="btn-search" class="bg-purple-600 hover:bg-purple-500 px-8 py-3 rounded-xl font-bold transition-all text-sm">SEARCH</button>
            </div>
            <div id="search-result" class="hidden"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 glass p-8 h-fit sticky top-8">
                <h3 class="text-lg font-bold mb-6 text-yellow-400">Deploy Project</h3>
                <div class="space-y-4">
                    <input type="text" id="targetID" class="admin-input" placeholder="Worker UID">
                    <input type="text" id="taskTitle" class="admin-input" placeholder="Project Title">
                    <input type="number" id="taskPrice" class="admin-input" placeholder="Rate ($/Hr)">
                    <textarea id="taskDesc" class="admin-input h-20 resize-none" placeholder="Instructions..."></textarea>
                    <button id="btn-assign" class="w-full bg-yellow-600 hover:bg-yellow-500 py-4 rounded-xl font-bold text-black transition-all">PUSH PROJECT 🚀</button>
                </div>
            </div>
            <div class="lg:col-span-8 glass p-8">
                <h3 class="text-lg font-bold mb-6">Live Global Assignments</h3>
                <div id="admin-task-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, orderBy, where, getDocs, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPBpzQfnilr2vm7kdRiNqOH89u7uxCjrk",
            authDomain: "adatacore-f.firebaseapp.com",
            projectId: "adatacore-f",
            storageBucket: "adatacore-f.firebasestorage.app",
            messagingSenderId: "806498602099",
            appId: "1:806498602099:web:426b145c9c0a0bd9c7ae06",
            measurementId: "G-740M8K5M0J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Fixed Check
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                const isAdmin = user.email === "as4556676@gmail.com" || (userSnap.exists() && userSnap.data().role === 'admin');
                
                if (isAdmin) {
                    document.getElementById('admin-content').classList.remove('hidden');
                    loadAllTasks();
                } else {
                    document.getElementById('access-denied').classList.remove('hidden');
                }
            } else {
                document.getElementById('access-denied').classList.remove('hidden');
            }
        });

        // Grant Admin
        document.getElementById('btn-make-admin').onclick = async () => {
            const email = document.getElementById('adminEmailInput').value.trim();
            if(!email) return Swal.fire('Error', 'Enter email', 'warning');
            
            const q = query(collection(db, "users"), where("email", "==", email));
            const snap = await getDocs(q);
            if(snap.empty) return Swal.fire('Error', 'User not registered yet', 'error');

            await updateDoc(doc(db, "users", snap.docs[0].id), { role: 'admin' });
            Swal.fire('Success', email + ' is now Admin!', 'success');
        };

        // Project Vault
        document.getElementById('btn-fetch-vault').onclick = async () => {
            const projectName = document.getElementById('auditProjectSelect').value;
            const tableBody = document.getElementById('vault-table-body');
            document.getElementById('vault-results').classList.remove('hidden');
            tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 animate-pulse">Fetching...</td></tr>`;

            try {
                const q = query(collection(db, "submissions"));
                const snap = await getDocs(q);
                tableBody.innerHTML = "";
                snap.forEach(d => {
                    const data = d.data();
                    if(!projectName || data.projectTitle === projectName) {
                        tableBody.innerHTML += `<tr>
                            <td class="text-xs">${data.workerEmail}</td>
                            <td class="text-xs font-mono text-purple-400">${data.durationSeconds}s</td>
                            <td class="text-green-400 font-bold">$${data.earnedAmount}</td>
                            <td><audio src="${data.audioData}" controls></audio></td>
                            <td class="text-[10px] text-gray-500">${data.timestamp?.toDate().toLocaleString()}</td>
                        </tr>`;
                    }
                });
            } catch (err) { Swal.fire('Error', err.message, 'error'); }
        };

        // Search & Block
        document.getElementById('btn-search').onclick = async () => {
            const input = document.getElementById('searchInput').value.trim();
            const resultDiv = document.getElementById('search-result');
            let userQuery = query(collection(db, "users"), where("uniqueID", "==", input));
            let userSnap = await getDocs(userQuery);
            if(userSnap.empty) { userQuery = query(collection(db, "users"), where("email", "==", input)); userSnap = await getDocs(userQuery); }

            if(userSnap.empty) { resultDiv.innerHTML = "No worker found"; return; }
            const u = userSnap.docs[0].data();
            const id = userSnap.docs[0].id;
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `<div class="p-6 glass mt-4 flex justify-between items-center">
                <div><p class="font-bold text-sm">${u.fullName}</p><p class="text-[10px] text-gray-500">ID: ${u.uniqueID}</p></div>
                <button onclick="window.toggleBlock('${id}', '${u.accountStatus}')" class="bg-red-600 px-4 py-2 rounded-xl text-[10px] font-bold uppercase">Toggle Block</button>
            </div>`;
        };

        window.toggleBlock = async (id, status) => {
            const next = status === 'blocked' ? 'active' : 'blocked';
            await updateDoc(doc(db, "users", id), { accountStatus: next });
            Swal.fire('Updated', 'User is now ' + next, 'success');
        };

        // Deploy
        document.getElementById('btn-assign').onclick = async () => {
            const targetID = document.getElementById('targetID').value.trim();
            await addDoc(collection(db, "tasks"), {
                assignedTo: targetID,
                title: document.getElementById('taskTitle').value,
                price: parseFloat(document.getElementById('taskPrice').value),
                description: document.getElementById('taskDesc').value,
                targetPage: 'task_player.html',
                createdAt: new Date()
            });
            Swal.fire('Done!', 'Project Pushed', 'success');
        };

        function loadAllTasks() {
            onSnapshot(query(collection(db, "tasks"), orderBy("createdAt", "desc")), (snap) => {
                const list = document.getElementById('admin-task-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    list.innerHTML += `<div class="p-4 glass flex justify-between items-center text-sm">
                        <p class="font-medium">${d.data().title}</p>
                        <button onclick="window.delTask('${d.id}')" class="text-red-400 text-xs font-bold uppercase">Delete</button>
                    </div>`;
                });
            });
        }
        window.delTask = async (id) => { if(confirm('Delete Task?')) await deleteDoc(doc(db, "tasks", id)); };
    </script>
</body>
</html>
