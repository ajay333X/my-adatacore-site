<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin Control — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050510; color: white; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(155, 135, 245, 0.1); border-radius: 28px; }
        .admin-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; width: 100%; outline: none; font-size: 14px; }
        .admin-input:focus { border-color: #A78BFA; background: rgba(167, 139, 250, 0.05); }
        .hidden { display: none; }
        .text-gradient { background: linear-gradient(to bottom right, #FFFFFF 30%, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-active { color: #10B981; background: rgba(16, 185, 129, 0.1); padding: 2px 8px; border-radius: 99px; }
        .status-blocked { color: #EF4444; background: rgba(239, 68, 68, 0.1); padding: 2px 8px; border-radius: 99px; }
        table { width: 100%; border-spacing: 0 8px; border-collapse: separate; }
        th { color: #94a3b8; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; padding: 0 16px; text-align: left; }
        td { background: rgba(255,255,255,0.02); padding: 16px; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
        td:first-child { border-left: 1px solid rgba(255,255,255,0.05); border-radius: 16px 0 0 16px; }
        td:last-child { border-right: 1px solid rgba(255,255,255,0.05); border-radius: 0 16px 16px 0; }
        tr:hover td { background: rgba(255,255,255,0.05); border-color: rgba(167, 139, 250, 0.3); }
        audio { height: 32px; width: 160px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); opacity: 0.6; }
        audio:hover { opacity: 1; }
    </style>
</head>
<body class="p-8">

    <div id="access-denied" class="hidden flex flex-col items-center justify-center h-screen text-center">
        <h1 class="text-6xl mb-4">🔐</h1>
        <h2 class="text-2xl font-bold text-red-500">Authorized Personnel Only</h2>
        <a href="dashboard.html" class="mt-6 text-purple-400 underline">Exit System</a>
    </div>

    <div id="admin-content" class="max-w-6xl mx-auto hidden">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gradient">Master Control Panel</h1>
                <p class="text-gray-500 text-sm">Full authority over contributors, tasks, and system access.</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-white/5 px-5 py-2 rounded-xl border border-white/10 text-xs hover:bg-white/10 transition-all">➔ Dashboard</button>
        </header>

        <div class="glass p-8 mb-8 border-blue-500/10">
            <h3 class="text-lg font-bold mb-6 text-blue-400 flex items-center gap-2">
                <span>📦</span> Project Data Vault
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <div>
                    <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Select Project to Audit</label>
                    <select id="auditProjectSelect" class="admin-input bg-[#050510]">
                        <option value="">-- View All Submissions --</option>
                        <option value="Ajay demo">Ajay demo</option>
                        <option value="Ajay Test Demo">Ajay Test Demo</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="btn-fetch-vault" class="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-xl font-bold transition-all text-sm w-full uppercase tracking-widest">FETCH SUBMISSIONS</button>
                </div>
            </div>

            <div id="vault-results" class="hidden overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th>Contributor</th>
                            <th>Duration</th>
                            <th>Payout</th>
                            <th>Audio Review</th>
                            <th>Submission Date</th>
                        </tr>
                    </thead>
                    <tbody id="vault-table-body"></tbody>
                </table>
            </div>
        </div>

        <div class="glass p-8 mb-8 border-purple-500/10">
            <h3 class="text-lg font-bold mb-6 text-purple-400 flex items-center gap-2">
                <span>🛡️</span> Manage Contributors
            </h3>
            <div class="flex gap-4 mb-6">
                <input type="text" id="searchInput" class="admin-input flex-1" placeholder="Search Email or UID...">
                <button id="btn-search" class="bg-purple-600 hover:bg-purple-500 px-8 py-3 rounded-xl font-bold transition-all text-sm">SEARCH</button>
            </div>
            <div id="search-result" class="hidden"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 glass p-8 h-fit sticky top-8">
                <h3 class="text-lg font-bold mb-6 text-yellow-400">Deploy New Project</h3>
                <div class="space-y-4">
                    <input type="text" id="targetID" class="admin-input" placeholder="Worker UID">
                    <select id="targetPage" class="admin-input bg-[#050510]">
                        <option value="task_player.html">Ajay demo</option>
                        <option value="image_labeling.html">Image Labeling</option>
                    </select>
                    <input type="text" id="taskTitle" class="admin-input" placeholder="Project Title">
                    <input type="number" id="taskPrice" class="admin-input" placeholder="Rate ($/Hr)">
                    <textarea id="taskDesc" class="admin-input h-20 resize-none" placeholder="Instructions..."></textarea>
                    <button id="btn-assign" class="w-full bg-yellow-600 hover:bg-yellow-500 py-4 rounded-xl font-bold text-black transition-all">PUSH PROJECT 🚀</button>
                </div>
            </div>

            <div class="lg:col-span-8 glass p-8">
                <h3 class="text-lg font-bold mb-6">Live Global Assignments</h3>
                <div id="admin-task-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, orderBy, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPBpzQfnilr2vm7kdRiNqOH89u7uxCjrk",
            authDomain: "adatacore-f.firebaseapp.com",
            projectId: "adatacore-f",
            storageBucket: "adatacore-f.firebasestorage.app",
            messagingSenderId: "806498602099",
            appId: "1:806498602099:web:426b145c9c0a0bd9c7ae06",
            measurementId: "G-740M8K5M0J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "as4556676@gmail.com";

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('admin-content').classList.remove('hidden');
                loadAllTasks();
            } else {
                document.getElementById('access-denied').classList.remove('hidden');
            }
        });

        // --- PROJECT VAULT LOGIC (ULTIMATE FIX) ---
        document.getElementById('btn-fetch-vault').onclick = async () => {
            const projectName = document.getElementById('auditProjectSelect').value;
            const vaultResults = document.getElementById('vault-results');
            const tableBody = document.getElementById('vault-table-body');

            vaultResults.classList.remove('hidden');
            tableBody.innerHTML = `<tr><td colspan="5" class="py-10 text-center animate-pulse text-gray-500 text-xs">Scanning Cloud...</td></tr>`;

            try {
                // 'where' और 'orderBy' हटा दिया ताकि इंडेक्स एरर न आए
                const q = query(collection(db, "submissions"));
                const snap = await getDocs(q);

                if (snap.empty) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-10 text-center text-red-400 font-bold">Database Empty. No submissions found.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = "";
                let foundCount = 0;

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    
                    // अगर नाम खाली है तो सब दिखाओ, वरना मैच करो
                    if (!projectName || data.projectTitle === projectName) {
                        foundCount++;
                        const date = data.timestamp ? data.timestamp.toDate().toLocaleString('en-IN') : "N/A";
                        
                        tableBody.innerHTML += `
                            <tr class="animate-in fade-in slide-in-from-top-1 duration-300">
                                <td>
                                    <div class="flex flex-col">
                                        <span class="text-white font-bold text-xs">${data.workerEmail || 'Contributor'}</span>
                                        <span class="text-[9px] text-gray-500 font-mono">Title: ${data.projectTitle || 'N/A'}</span>
                                    </div>
                                </td>
                                <td class="font-mono text-purple-400 text-xs">${data.durationSeconds || 0}s</td>
                                <td class="text-green-400 font-bold text-xs">$${data.earnedAmount || '0.00'}</td>
                                <td>
                                    <audio src="${data.audioData}" controls></audio>
                                </td>
                                <td class="text-[10px] text-gray-400">${date}</td>
                            </tr>
                        `;
                    }
                });

                if(foundCount === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-10 text-center text-yellow-400">No match for "${projectName}". Select "-- View All --" to debug.</td></tr>`;
                }

            } catch (err) {
                console.error(err);
                Swal.fire('Fetch Error', err.message, 'error');
            }
        };

        // --- CONTRIBUTOR SEARCH & MANAGE ---
        document.getElementById('btn-search').onclick = async () => {
            const input = document.getElementById('searchInput').value.trim();
            const resultDiv = document.getElementById('search-result');
            if(!input) return;

            resultDiv.innerHTML = `<p class="text-center py-4 animate-pulse">Scanning...</p>`;
            resultDiv.classList.remove('hidden');

            let userQuery = query(collection(db, "users"), where("uniqueID", "==", input));
            let userSnap = await getDocs(userQuery);
            if(userSnap.empty) {
                userQuery = query(collection(db, "users"), where("email", "==", input));
                userSnap = await getDocs(userQuery);
            }

            if(userSnap.empty) {
                resultDiv.innerHTML = `<p class="text-red-400 text-sm">No worker found.</p>`;
                return;
            }

            const userDoc = userSnap.docs[0];
            const u = userDoc.data();
            const isBlocked = u.accountStatus === 'blocked';

            resultDiv.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 bg-white/5 rounded-[32px] border border-white/10 animate-in fade-in slide-in-from-top-2">
                    <div>
                        <p class="text-2xl font-bold mb-1">${u.fullName} 
                            <span class="text-[10px] ${isBlocked ? 'status-blocked' : 'status-active'}">${isBlocked ? 'DEACTIVATED' : 'ACTIVE'}</span>
                        </p>
                        <p class="text-gray-400 text-sm mb-4">${u.email} • <span class="text-purple-400 font-mono">${u.uniqueID}</span></p>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="toggleStatus('${userDoc.id}', '${u.accountStatus}')" class="px-4 py-2 ${isBlocked ? 'bg-green-600' : 'bg-red-600'} rounded-xl text-[10px] font-bold">
                                ${isBlocked ? 'ACTIVATE' : 'DEACTIVATE'}
                            </button>
                            <button onclick="adjustBalance('${userDoc.id}', ${u.balance})" class="px-4 py-2 bg-blue-600 rounded-xl text-[10px] font-bold">ADJUST BALANCE</button>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div class="p-4 bg-black/40 rounded-2xl">
                            <label class="text-[10px] text-gray-500 font-bold uppercase">Work Statistics</label>
                            <div class="flex justify-between mt-2 text-sm">
                                <span>Balance: <b class="text-green-400">$${(u.balance || 0).toFixed(2)}</b></span>
                                <span>Tasks: <b class="text-purple-400">${u.tasksCompleted || 0}</b></span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        window.toggleStatus = async (docId, currentStatus) => {
            const newStatus = currentStatus === 'blocked' ? 'active' : 'blocked';
            await updateDoc(doc(db, "users", docId), { accountStatus: newStatus });
            Swal.fire('Updated', `Account is now ${newStatus}`, 'success');
            document.getElementById('btn-search').click();
        };

        window.adjustBalance = async (docId, currentBalance) => {
            const { value: amount } = await Swal.fire({
                title: 'Adjust Balance',
                input: 'number',
                inputLabel: `Current: $${currentBalance.toFixed(2)}`,
                inputPlaceholder: 'Enter amount (+ or -)'
            });
            if (amount) {
                await updateDoc(doc(db, "users", docId), { balance: parseFloat(currentBalance) + parseFloat(amount) });
                Swal.fire('Updated', 'Balance adjusted', 'success');
                document.getElementById('btn-search').click();
            }
        };

        document.getElementById('btn-assign').onclick = async () => {
            const targetID = document.getElementById('targetID').value.trim();
            const title = document.getElementById('taskTitle').value;
            const price = parseFloat(document.getElementById('taskPrice').value) || 0;
            const desc = document.getElementById('taskDesc').value;
            const targetPage = document.getElementById('targetPage').value;
            try {
                await addDoc(collection(db, "tasks"), {
                    assignedTo: targetID, title, price, description: desc, targetPage, createdAt: new Date()
                });
                Swal.fire('Success', 'Project Pushed', 'success');
            } catch (err) { Swal.fire('Error', err.message, 'error'); }
        };

        function loadAllTasks() {
            onSnapshot(query(collection(db, "tasks"), orderBy("createdAt", "desc")), (snap) => {
                const list = document.getElementById('admin-task-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const t = d.data();
                    list.innerHTML += `<div class="p-6 bg-white/5 rounded-3xl border border-white/5 flex justify-between items-center hover:border-purple-500/20 transition-all">
                        <div><p class="text-[10px] text-purple-400 font-bold">${t.assignedTo}</p><h4 class="font-bold text-sm">${t.title}</h4></div>
                        <button onclick="removeTask('${d.id}')" class="text-[10px] text-red-400 border border-red-500/20 px-4 py-2 rounded-xl hover:bg-red-500/10">TERMINATE</button>
                    </div>`;
                });
            });
        }
        window.removeTask = async (id) => { if(confirm('Remove Task?')) await deleteDoc(doc(db, "tasks", id)); };
    </script>
</body>
</html>
