<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Master Control — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050510; color: white; min-height: 100vh; overflow-x: hidden; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 16px; color: #94a3b8; transition: 0.3s; cursor: pointer; font-size: 14px; font-weight: 600; }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-link.active { background: #A78BFA; color: #000; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.1); }
        .admin-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; width: 100%; outline: none; font-size: 13px; }
        .content-section { display: none; }
        .content-section.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex">

    <!-- SIDEBAR -->
    <aside class="w-72 h-screen border-r border-white/5 p-6 flex flex-col gap-8 shrink-0 sticky top-0">
        <div class="flex items-center gap-3 px-2">
            <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center font-bold text-white shadow-lg">A</div>
            <span class="font-bold tracking-tight text-lg text-white uppercase">Adatacore Admin</span>
        </div>
        <nav class="flex flex-col gap-1">
            <div onclick="showSection('project-lab')" class="nav-link active" id="btn-project-lab">🧪 <span>Project Lab</span></div>
            <div onclick="showSection('deploy')" class="nav-link" id="btn-deploy">🚀 <span>Assign Task</span></div>
            <div onclick="showSection('revoke')" class="nav-link" id="btn-revoke">🛡️ <span>Revoke Task</span></div>
        </nav>
        <div class="mt-auto">
            <button onclick="window.location.href='dashboard.html'" class="w-full py-3 rounded-xl bg-white/5 border border-white/10 text-[10px] font-bold tracking-widest hover:bg-white/10 transition-all uppercase text-white">← Dashboard</button>
        </div>
    </aside>

    <main class="flex-1 min-h-screen p-12 text-white overflow-y-auto">
        
        <!-- 1. PROJECT LAB -->
        <section id="project-lab" class="content-section active">
            <h2 class="text-3xl font-bold uppercase tracking-tighter mb-8">Project Lab</h2>
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-10">
                <div class="space-y-6">
                    <h3 class="text-xs font-black text-purple-400 uppercase tracking-widest">01. Identity</h3>
                    <div class="glass p-6 rounded-[32px] space-y-4">
                        <input type="text" id="lab-project-name" class="admin-input" placeholder="Project Name">
                        <input type="color" id="lab-accent-color" class="w-full h-10 bg-transparent border-none cursor-pointer" value="#A78BFA">
                    </div>
                </div>
                <div class="space-y-6">
                    <h3 class="text-xs font-black text-purple-400 uppercase tracking-widest">02. Logic</h3>
                    <div class="glass p-6 rounded-[32px] space-y-4">
                        <textarea id="lab-logic-code" class="admin-input h-32 font-mono text-[10px]" placeholder="// JS Logic Injection"></textarea>
                        <button onclick="publishProject()" class="w-full bg-white text-black py-4 rounded-2xl font-black text-xs uppercase hover:bg-purple-500 hover:text-white transition-all">PUBLISH 🚀</button>
                    </div>
                </div>
            </div>
            <div class="mt-12">
                <h3 class="text-xs font-black text-gray-500 uppercase mb-6">Live Registry</h3>
                <div id="registry-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </div>
        </section>

        <!-- 2. ASSIGN TASK -->
        <section id="deploy" class="content-section">
            <h2 class="text-2xl font-bold mb-8 uppercase tracking-tighter">Assign Task</h2>
            <div class="glass p-10 rounded-[40px] max-w-2xl space-y-5 border-t-4 border-yellow-600">
                <input type="text" id="targetUID" class="admin-input" placeholder="Worker Email/UID">
                <select id="project-select-assign" class="admin-input bg-[#0a0a15] text-purple-400 uppercase font-bold project-dropdown-sync"></select>
                <input type="number" id="taskPrice" class="admin-input" placeholder="Price ($)">
                <button onclick="assignTask()" class="w-full bg-yellow-600 py-4 rounded-2xl font-black text-xs text-black">DEPLOY TASK ➔</button>
            </div>
        </section>

        <!-- 3. REVOKE TASK (FIXED WITH DROP-DOWN) -->
        <section id="revoke" class="content-section">
            <h2 class="text-2xl font-bold mb-8 uppercase tracking-tighter text-white">Revoke Task</h2>
            <div class="glass p-10 rounded-[40px] max-w-2xl space-y-5 border-t-4 border-red-600">
                <p class="text-[10px] text-gray-500 uppercase font-bold mb-2">Remove assigned project from worker</p>
                <input type="text" id="revoke-email" class="admin-input" placeholder="Worker Email/UID">
                <select id="project-select-revoke" class="admin-input bg-[#0a0a15] text-red-400 uppercase font-bold project-dropdown-sync"></select>
                <button onclick="revokeTask()" class="w-full bg-red-600 py-4 rounded-2xl font-black text-xs text-white uppercase shadow-lg">Revoke Access ➔</button>
            </div>
        </section>

    </main>

    <script>
        const SB_URL = "https://llmhyezgcnbognmmsnzq.supabase.co";
        const SB_KEY = "sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        window.showSection = (id) => {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
        };

        async function publishProject() {
            const name = document.getElementById('lab-project-name').value;
            const config = {
                accent: document.getElementById('lab-accent-color').value,
                logic: document.getElementById('lab-logic-code').value,
                modules: { audio: true, text: true } 
            };
            const { error } = await _supabase.from('project_lab').insert([{ project_name: name, config, is_published: true }]);
            if (!error) { Swal.fire('Live!', name + ' published', 'success'); loadData(); }
        }

        async function loadData() {
            const { data } = await _supabase.from('project_lab').select('*').order('created_at', { ascending: false });
            
            // Registry Grid
            document.getElementById('registry-grid').innerHTML = data.map(p => `
                <div class="glass p-6 rounded-[28px] border-l-4" style="border-color:${p.config.accent}">
                    <h4 class="text-xs font-bold uppercase">${p.project_name}</h4>
                    <button onclick="deleteInstance(${p.id})" class="text-[9px] text-red-500 mt-4 font-black uppercase">Destroy</button>
                </div>
            `).join('');

            // Sync all drop-downs
            const options = '<option value="">-- SELECT PROJECT --</option>' + data.map(p => `<option value="${p.project_name}">${p.project_name}</option>`).join('');
            document.querySelectorAll('.project-dropdown-sync').forEach(dropdown => {
                dropdown.innerHTML = options;
            });
        }

        async function assignTask() {
            const uid = document.getElementById('targetUID').value;
            const project = document.getElementById('project-select-assign').value;
            if(!uid || !project) return Swal.fire('Error', 'Fill all details', 'error');

            const { error } = await _supabase.from('tasks').insert([{
                assignedTo: uid,
                title: project,
                price: document.getElementById('taskPrice').value
            }]);
            if (!error) Swal.fire('Sent!', 'Task assigned', 'success');
        }

        async function revokeTask() {
            const email = document.getElementById('revoke-email').value;
            const project = document.getElementById('project-select-revoke').value;

            if(!email || !project) return Swal.fire('Error', 'Select User and Project', 'error');

            const { value: confirm } = await Swal.fire({
                title: 'Revoke Access?',
                text: `Removing '${project}' from '${email}'`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                background: '#0a0a15',
                color: '#fff'
            });

            if(confirm) {
                const { error } = await _supabase.from('tasks').delete().eq('assignedTo', email).eq('title', project);
                if (!error) Swal.fire('Revoked!', 'Project removed from user', 'success');
                else Swal.fire('Error', error.message, 'error');
            }
        }

        async function deleteInstance(id) {
            const { error } = await _supabase.from('project_lab').delete().eq('id', id);
            if (!error) loadData();
        }

        loadData();
    </script>
</body>
</html>
