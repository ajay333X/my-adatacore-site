<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Assignment Center — Adatacore</title>
<style>html,body{margin:0;min-height:100%;background:#f6f7fa;color:#666;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;font-size:12px}</style>
</head>
<body><div class="boot">Loading Assignment Center…</div>
<script>
(async()=>{
  try{
    const response=await fetch('/assignment-center',{cache:'no-store'});
    if(!response.ok)throw new Error('Assignment Center returned '+response.status);
    let html=await response.text();
    const old='<scr'+'ipt src="/assignment-center.js?v=1"></scr'+'ipt>';
    const next='<scr'+'ipt src="/assignment-center-role-loader.js?v=20260902-1"></scr'+'ipt>';
    if(!html.includes(old))throw new Error('Assignment Center script signature changed.');
    html=html.replace(old,next);
    document.open();document.write(html);document.close();
  }catch(error){document.body.innerHTML='<div class="boot">Unable to load Assignment Center. '+String(error.message||error)+'</div>'}
})();
</script>
</body>
</html>
