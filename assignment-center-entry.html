<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Assignment Center · Adatacore</title>
<style>html,body{margin:0;min-height:100%;background:#241e31;color:#d9cbe6;font:12px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:25px}.boot strong{font-size:13px;letter-spacing:.015em}.boot small{color:#a99bbb;margin-top:8px;display:block}.loading{width:27px;height:27px;border:3px solid #4a3b60;border-top-color:#b394d6;border-radius:50%;animation:turn .8s linear infinite;margin:0 auto 16px}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loading{animation:none}}</style></head>
<body><div class="boot"><div><div class="loading" aria-hidden="true"></div><strong>Loading Assignment Center</strong><small>Connecting to Adatacore project permissions…</small></div></div>
<script>
(async()=>{
 try{
  const response=await fetch('/assignment-center',{cache:'no-store'});
  if(!response.ok)throw new Error('Workspace returned '+response.status);
  const html=await response.text();
  if(!html.includes('/assignment-center-v2.js?v=1'))throw new Error('Updated Assignment Center is not available yet');
  document.open();document.write(html);document.close();
 }catch(error){
  document.querySelector('.boot').textContent='Could not open Assignment Center: '+String(error.message||error);
 }
})();
</script></body></html>
