<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adatacore Status</title><meta name="description" content="Current Adatacore platform status and recent incidents."><link rel="stylesheet" href="/design-system.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><style>body{min-height:100vh;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.status-main{max-width:900px;margin:auto;padding:44px 20px 80px}.status-top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:34px}.status-hero{padding:24px}.status-hero h1{font-size:34px;margin:8px 0}.component-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.component{padding:14px}.component span{display:block;font-size:9px;color:var(--muted)}.component strong{display:block;margin-top:5px;font-size:12px}.incident-list{display:grid;gap:9px;margin-top:12px}.incident{padding:15px}.incident-head{display:flex;justify-content:space-between;gap:10px}.status-dot{width:10px;height:10px;border-radius:999px;background:#22c55e;display:inline-block;margin-right:7px}.status-dot.degraded{background:#f59e0b}.status-dot.critical{background:#ef4444}@media(max-width:650px){.component-grid{grid-template-columns:1fr 1fr}.status-top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="status-main"><div class="status-top"><a class="brand" href="/"><span class="brand-mark"></span><span>Adatacore</span></a><button id="refreshStatus" class="btn btn-secondary">Refresh status</button></div><section class="card status-hero"><div class="eyebrow">Platform availability</div><h1 id="statusTitle">Checking Adatacore…</h1><p id="statusSub" class="page-sub">Loading the latest service state.</p><div class="component-grid"><div class="card component"><span>Workspace</span><strong>Monitored</strong></div><div class="card component"><span>Authentication</span><strong>Monitored</strong></div><div class="card component"><span>Transcription AI</span><strong>Monitored</strong></div><div class="card component"><span>Client review</span><strong>Monitored</strong></div></div></section><section style="margin-top:24px"><div class="section-title"><div><div class="eyebrow">Recent history</div><h2>Incidents & maintenance</h2></div></div><div id="incidents" class="incident-list"><div class="card incident">Loading incidents…</div></div></section></main><script>window.addEventListener('DOMContentLoaded',()=>{const U='https://llmhyezgcnbognmmsnzq.supabase.co',K='sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml',db=supabase.createClient(U,K),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const {data,error}=await db.rpc('get_platform_status');const title=document.getElementById('statusTitle'),sub=document.getElementById('statusSub'),list=document.getElementById('incidents');if(error){title.textContent='Status temporarily unavailable';sub.textContent='We could not retrieve the current status record.';list.innerHTML='<div class="card incident">Please check again shortly.</div>';return}const s=data?.status||'operational';title.innerHTML=`<span class="status-dot ${s==='degraded'?'degraded':s==='operational'?'':'critical'}"></span>${s==='operational'?'All monitored systems operational':s==='maintenance'?'Scheduled maintenance / minor impact':'Service degradation detected'}`;sub.textContent=`Last checked ${new Date(data.updatedAt||Date.now()).toLocaleString()}.`;const rows=data?.incidents||[];list.innerHTML=rows.length?rows.map(x=>`<article class="card incident"><div class="incident-head"><div><strong>${esc(x.title)}</strong><div class="record-meta">${esc(x.component)} · ${new Date(x.startedAt).toLocaleString()}</div></div><span class="pill ${x.status==='resolved'?'pill-green':x.severity==='critical'?'pill-red':'pill-amber'}">${esc(x.status)}</span></div>${x.body?`<p class="page-sub" style="margin-top:9px">${esc(x.body)}</p>`:''}</article>`).join(''):'<div class="card incident"><strong>No recent incidents</strong><p class="page-sub">There are no platform incidents recorded in the last 30 days.</p></div>'}document.getElementById('refreshStatus').onclick=load;load()})</script></body></html>
