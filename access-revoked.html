<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Revoked — Adatacore</title>
<link rel="icon" href="/favicon.png?v=20260831-3" type="image/png">
<link rel="stylesheet" href="/design-system.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px}.access-wrap{width:min(520px,100%);text-align:center}.access-card{padding:38px}.access-icon{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;margin:0 auto 20px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);font-size:26px}.access-card h1{font-size:28px;margin:0 0 12px}.access-card p{color:var(--muted);line-height:1.7;margin:0 auto 24px;max-width:410px}.brand{justify-content:center;margin-bottom:22px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="access-wrap">
<a class="brand" href="/"><span class="brand-mark"></span>Adatacore</a>
<section class="card access-card">
<div class="access-icon">×</div>
<div class="eyebrow">Account access</div>
<h1>Platform access revoked</h1>
<p>Your Adatacore workspace access has been disabled by an administrator. If you believe this was a mistake, contact your project administrator.</p>
<div class="actions"><a class="btn btn-secondary" href="/">Back to Adatacore</a><a class="btn btn-primary" href="/auth">Return to sign in</a></div>
</section>
</main>
</body>
</html>
