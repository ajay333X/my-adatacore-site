<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Authentication — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --accent: #A78BFA; --bg-dark: #0D0D1F; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .grid-pattern { background-image: radial-gradient(rgba(167, 139, 250, 0.08) 1px, transparent 1px); background-size: 40px 40px; position: fixed; inset: 0; z-index: -1; }
        .glass { background: rgba(26, 26, 46, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.2); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border-radius: 32px; }
        .premium-input { background: rgba(255, 255, 255, 0.04) !important; border: 1px solid rgba(167, 139, 250, 0.1) !important; border-radius: 12px; padding: 12px 16px; color: white; width: 100%; outline: none; transition: all 0.3s ease; }
        .premium-input:focus { border-color: #A78BFA !important; box-shadow: 0 0 20px rgba(167, 139, 250, 0.15); }
        .btn-shine { position: relative; overflow: hidden; background: linear-gradient(135deg, #7C3AED, #A78BFA); font-weight: bold; color: white; padding: 16px; border-radius: 16px; width: 100%; transition: transform 0.2s; cursor: pointer; border: none; }
        .btn-shine:active { transform: scale(0.96); }
        .tab-btn { padding: 8px 16px; font-size: 14px; font-weight: 600; color: #94A3B8; background: none; border: none; cursor: pointer; position: relative; }
        .tab-btn.active { color: white; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 16px; right: 16px; height: 2px; background: #A78BFA; box-shadow: 0 0 10px #A78BFA; }
        .hidden { display: none; }
        .social-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; width: 100%; }
        .social-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent); }
    </style>
</head>
<body class="grid-pattern">
    <div class="glass w-full max-w-[440px] p-10 relative z-10">
        <div class="flex flex-col items-center mb-8">
            <a href="index.html" class="flex items-center gap-2.5 font-bold text-white text-xl mb-6">
                <svg viewBox="0 0 64 64" class="w-8 h-8"><rect x="4" y="4" width="56" height="56" rx="14" fill="#1A1A2E"></rect><path d="M32 18L42 46H38L36 40H28L26 46H22L32 18Z" fill="#A78BFA"></path></svg>
                Adatacore
            </a>
            <div class="flex gap-4 border-b border-white/5 w-full justify-center">
                <button onclick="switchTab('signin')" id="tab-signin" class="tab-btn active">Sign In</button>
                <button onclick="switchTab('signup')" id="tab-signup" class="tab-btn">Sign Up</button>
            </div>
        </div>

        <div id="signin-form" class="space-y-4">
            <div id="email-signin-group" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email Address" class="premium-input">
                <input type="password" id="login-password" placeholder="Password" class="premium-input">
            </div>
            
            <div id="phone-signin-group" class="hidden space-y-4">
                <input type="tel" id="login-phone" placeholder="+91 1234567890" class="premium-input">
                <div id="recaptcha-container"></div>
            </div>

            <button id="btn-signin" class="btn-shine">Sign In</button>
            
            <button onclick="togglePhoneAuth()" id="phone-toggle-btn" class="text-xs text-gray-500 w-full hover:text-purple-400 transition-colors">Login with Phone Number instead?</button>
        </div>

        <div id="signup-form" class="space-y-4 hidden">
            <input type="text" id="signup-name" placeholder="Full Name" class="premium-input">
            <input type="email" id="signup-email" placeholder="Email Address" class="premium-input">
            <input type="password" id="signup-password" placeholder="Password" class="premium-input">
            <button id="btn-signup" class="btn-shine">Create Account</button>
        </div>

        <div class="relative py-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/5"></div></div>
            <div class="relative flex justify-center text-[10px] uppercase tracking-widest text-gray-600 px-2">Or continue with</div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button id="btn-google" class="social-btn">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4"> <span class="text-xs font-semibold">Google</span>
            </button>
            <button class="social-btn">
                <img src="https://www.svgrepo.com/show/448234/linkedin.svg" class="w-4 h-4"> <span class="text-xs font-semibold">LinkedIn</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJqNsBMv6Z6mbPe8TeMW00lLRbFI1OGz4",
            authDomain: "adatacoresite.firebaseapp.com",
            projectId: "adatacoresite",
            storageBucket: "adatacoresite.firebasestorage.app",
            messagingSenderId: "108144458736",
            appId: "1:108144458736:web:1fd765735fe8eaebdcfb35",
            measurementId: "G-PTS16DVVYE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => { if (user) window.location.href = "dashboard.html"; });

        // Email Sign In
        document.getElementById('btn-signin').onclick = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            if(!email || !pass) { alert("Please fill details"); return; }
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch (err) { alert(err.message); }
        };

        // Google Sign In (Logic Added)
        document.getElementById('btn-google').onclick = async () => {
            try { await signInWithPopup(auth, googleProvider); } 
            catch (err) { alert(err.message); }
        };

        // Signup Logic
        document.getElementById('btn-signup').onclick = async () => {
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-password').value;
            try { await createUserWithEmailAndPassword(auth, email, pass); } 
            catch (err) { alert(err.message); }
        };

        // UI Helpers
        window.switchTab = function(type) {
            document.getElementById('signin-form').classList.toggle('hidden', type === 'signup');
            document.getElementById('signup-form').classList.toggle('hidden', type === 'signin');
            document.getElementById('tab-signin').classList.toggle('active', type === 'signin');
            document.getElementById('tab-signup').classList.toggle('active', type === 'signup');
        }

        window.togglePhoneAuth = function() {
            const emailGrp = document.getElementById('email-signin-group');
            const phoneGrp = document.getElementById('phone-signin-group');
            const btn = document.getElementById('phone-toggle-btn');
            
            if(phoneGrp.classList.contains('hidden')) {
                phoneGrp.classList.remove('hidden');
                emailGrp.classList.add('hidden');
                btn.innerText = "Login with Email instead?";
            } else {
                phoneGrp.classList.add('hidden');
                emailGrp.classList.remove('hidden');
                btn.innerText = "Login with Phone Number instead?";
            }
        }
    </script>
</body>
</html>
