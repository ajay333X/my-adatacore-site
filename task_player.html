<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Workstation Player — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #050510; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.1); border-radius: 40px; }
        .record-btn { width: 90px; height: 90px; border-radius: 50%; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .recording { background: #ff4757 !important; transform: scale(1.1); box-shadow: 0 0 40px rgba(255, 71, 87, 0.4); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glass w-full max-w-2xl p-12 text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-purple-500 to-transparent"></div>
        
        <h2 class="text-3xl font-bold mb-2">Ajay Test Demo</h2>
        <p id="pay-rate-display" class="text-purple-400 text-xs font-bold uppercase tracking-widest mb-10">Rate: $8.00 / Hour</p>

        <div class="mb-12">
            <div id="timer" class="text-7xl font-mono mb-4 tracking-tighter">00:00</div>
            <p id="status" class="text-[10px] uppercase tracking-[0.3em] text-gray-500">System Ready</p>
        </div>

        <div class="flex flex-col items-center gap-8">
            <button id="recordBtn" class="record-btn bg-purple-600 flex items-center justify-center shadow-2xl">
                <div id="btn-icon" class="w-4 h-4 bg-white rounded-sm"></div>
            </button>
            
            <div id="playbackSection" class="hidden w-full space-y-6 animate-in fade-in zoom-in duration-300">
                <audio id="audioPlayer" controls class="w-full h-10 opacity-80"></audio>
                <div class="flex gap-4">
                    <button id="discardBtn" class="flex-1 py-4 bg-white/5 rounded-2xl text-xs font-bold border border-white/10 hover:bg-white/10 transition-all">DISCARD</button>
                    <button id="submitBtn" class="flex-1 py-4 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-2xl text-xs font-bold shadow-xl">SUBMIT WORK</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, updateDoc, increment, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPBpzQfnilr2vm7kdRiNqOH89u7uxCjrk",
            authDomain: "adatacore-f.firebaseapp.com",
            projectId: "adatacore-f",
            storageBucket: "adatacore-f.firebasestorage.app",
            messagingSenderId: "806498602099",
            appId: "1:806498602099:web:426b145c9c0a0bd9c7ae06",
            measurementId: "G-740M8K5M0J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let mediaRecorder, audioChunks = [], timerInterval, duration = 0, audioBlob;
        const recordBtn = document.getElementById('recordBtn');
        const audioPlayer = document.getElementById('audioPlayer');

        onAuthStateChanged(auth, (user) => { if (!user) window.location.href = "auth.html"; });

        recordBtn.onclick = async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                clearInterval(timerInterval);
                recordBtn.classList.remove('recording');
                document.getElementById('status').innerText = "Review Recording";
            } else {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = []; duration = 0;
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    audioPlayer.src = URL.createObjectURL(audioBlob);
                    document.getElementById('playbackSection').classList.remove('hidden');
                };
                mediaRecorder.start();
                recordBtn.classList.add('recording');
                document.getElementById('status').innerText = "Recording Live";
                timerInterval = setInterval(() => {
                    duration++;
                    const m = Math.floor(duration/60).toString().padStart(2,'0');
                    const s = (duration%60).toString().padStart(2,'0');
                    document.getElementById('timer').innerText = `${m}:${s}`;
                }, 1000);
            }
        };

        document.getElementById('submitBtn').onclick = async () => {
            const user = auth.currentUser;
            const payRate = 8.00;
            const earnings = (duration / 3600) * payRate;
            
            Swal.fire({ title: 'Saving...', text: 'Finalizing your work...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            // ऑडियो फाइल को Base64 टेक्स्ट में बदलना
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
                const base64Audio = reader.result;

                try {
                    // सीधे Firestore में टेक्स्ट की तरह सेव करना
                    await addDoc(collection(db, "submissions"), {
                        workerUID: user.uid,
                        workerEmail: user.email,
                        projectTitle: "Ajay Test Demo",
                        audioData: base64Audio, // यहाँ ऑडियो डेटा टेक्स्ट के रूप में है
                        durationSeconds: duration,
                        earnedAmount: parseFloat(earnings.toFixed(4)),
                        timestamp: new Date()
                    });

                    // यूज़र का बैलेंस अपडेट करना
                    await updateDoc(doc(db, "users", user.uid), {
                        balance: increment(earnings)
                    });

                    Swal.fire({ icon: 'success', title: 'Work Submitted!', text: `You earned $${earnings.toFixed(4)}`, background: '#050510', color: '#fff' })
                    .then(() => window.location.href = "dashboard.html");

                } catch (err) { 
                    console.error(err);
                    Swal.fire('Error', 'Submission failed: ' + err.message, 'error'); 
                }
            };
        };

        document.getElementById('discardBtn').onclick = () => location.reload();
    </script>
</body>
</html>
