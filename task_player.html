<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Production Lab — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { background: #02020a; color: white; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        #sidebar { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); width: 320px; }
        .focus-active #sidebar { margin-left: -320px; opacity: 0; }
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.1); }
        .record-btn { width: 90px; height: 90px; border-radius: 50%; transition: 0.4s; position: relative; }
        .recording { background: #ef4444 !important; transform: scale(1.1); box-shadow: 0 0 50px rgba(239, 68, 68, 0.3); }
        .pulse { position: absolute; width: 100%; height: 100%; background: #ef4444; border-radius: 50%; z-index: -1; opacity: 0.5; animation: pulse-out 1.5s infinite; }
        @keyframes pulse-out { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.8); opacity: 0; } }
        .toggle-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 99px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body class="flex" id="body-wrapper">

    <aside id="sidebar" class="h-screen glass-panel p-8 flex flex-col border-r border-white/5 z-30">
        <div class="mb-10">
            <a href="dashboard.html" class="text-[10px] text-gray-500 hover:text-white transition-all mb-4 block">← BACK TO DASHBOARD</a>
            <span class="text-[10px] font-bold text-purple-400 uppercase tracking-widest">Project 101</span>
            <h1 class="text-2xl font-bold mt-1">Ajay Test Demo</h1>
        </div>
        <div class="space-y-6 flex-1 text-gray-400 text-sm leading-relaxed">
            <p class="flex gap-3"><span class="text-purple-500 font-bold">01</span> शांत कमरे में रिकॉर्ड करें।</p>
            <p class="flex gap-3"><span class="text-purple-500 font-bold">02</span> शुरू में 2 सेकंड चुप रहें।</p>
            <p class="flex gap-3"><span class="text-purple-500 font-bold">03</span> साफ़ आवाज़ में बोलें।</p>
        </div>
        <div class="mt-auto pt-6 border-t border-white/5 flex justify-between items-center text-sm">
            <span class="text-gray-500 font-medium text-xs">Project Rate</span>
            <span class="text-green-400 font-bold">$8.00 / Hr</span>
        </div>
    </aside>

    <main id="main-area" class="flex-1 flex flex-col items-center justify-center p-20 relative">
        <div class="absolute top-10 right-10 z-50">
            <button onclick="toggleFocus()" class="toggle-btn text-white uppercase font-bold"><span id="focus-text">✨ Focus Mode</span></button>
        </div>

        <div id="timer" class="text-[120px] font-mono tracking-tighter mb-4 text-white/90 leading-none">00:00</div>
        <p id="status" class="text-[11px] uppercase tracking-[0.6em] text-purple-400 font-bold mb-16">Ready to Capture</p>

        <button id="recordBtn" class="record-btn bg-purple-600 flex items-center justify-center shadow-2xl">
            <div id="pulse-ring"></div>
            <div id="btn-icon" class="w-6 h-6 bg-white rounded-sm"></div>
        </button>

        <div id="playbackUI" class="hidden w-full max-w-xl space-y-10 mt-12">
            <div class="flex gap-6">
                <button id="discardBtn" class="flex-1 py-5 bg-white/5 border border-white/10 rounded-[24px] text-xs font-bold text-white uppercase transition-all hover:bg-white/10">DISCARD</button>
                <button id="submitBtn" class="flex-1 py-5 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-[24px] text-xs font-bold text-white uppercase shadow-2xl hover:scale-105 transition-all">SUBMIT WORK</button>
            </div>
        </div>
    </main>

    <script>
        const SB_URL = "https://llmhyezgcnbognmmsnzq.supabase.co";
        const SB_KEY = "sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let mediaRecorder, audioChunks = [], timerInterval, duration = 0, audioBlob;

        window.toggleFocus = () => {
            const body = document.getElementById('body-wrapper');
            body.classList.toggle('focus-active');
            document.getElementById('focus-text').innerText = body.classList.contains('focus-active') ? '👁️ Standard Mode' : '✨ Focus Mode';
        };

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.onclick = async () => {
            if (mediaRecorder?.state === "recording") {
                mediaRecorder.stop();
                clearInterval(timerInterval);
                recordBtn.classList.remove('recording');
                document.getElementById('pulse-ring').classList.remove('pulse');
                document.getElementById('status').innerText = "Recording Complete";
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = []; duration = 0;
                    
                    mediaRecorder.onstart = () => {
                        recordBtn.classList.add('recording');
                        document.getElementById('pulse-ring').classList.add('pulse');
                        document.getElementById('status').innerText = "Live Recording...";
                        timerInterval = setInterval(() => {
                            duration++;
                            const m = Math.floor(duration/60).toString().padStart(2,'0');
                            const s = (duration%60).toString().padStart(2,'0');
                            document.getElementById('timer').innerText = `${m}:${s}`;
                        }, 1000);
                    };
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        document.getElementById('playbackUI').classList.remove('hidden');
                    };
                    mediaRecorder.start();
                } catch (err) {
                    Swal.fire('Error', 'Microphone access denied.', 'error');
                }
            }
        };

        // SUBMISSION LOGIC (RE-FIXED)
        document.getElementById('submitBtn').onclick = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(!user || !audioBlob) return;
            
            Swal.fire({ 
                title: 'Submitting...', 
                text: 'Uploading to Adatacore...', 
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading() 
            });

            try {
                // 1. यूजर की वर्तमान जानकारी प्राप्त करें
                const { data: profile, error: profileError } = await _supabase
                    .from('users')
                    .select('uniqueID, balance')
                    .eq('id', user.id)
                    .single();

                if (profileError) throw profileError;

                const earnings = (duration / 3600) * 8.00;

                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = async () => {
                    const base64Audio = reader.result;

                    // 2. Submissions टेबल में डेटा डालें
                    const { error: subError } = await _supabase.from('submissions').insert([{
                        workerUID: profile.uniqueID || "Unknown",
                        projectTitle: "Ajay Test Demo",
                        audioData: base64Audio,
                        earnedAmount: parseFloat(earnings.toFixed(4)),
                        status: "Pending"
                    }]);

                    if(subError) throw subError;

                    // 3. यूजर का बैलेंस अपडेट करें
                    const newBalance = (profile.balance || 0) + earnings;
                    const { error: updateError } = await _supabase
                        .from('users')
                        .update({ balance: newBalance })
                        .eq('id', user.id);

                    if(updateError) throw updateError;

                    Swal.fire({ icon: 'success', title: 'Success!', text: 'Work submitted and balance updated.' })
                    .then(() => window.location.href = "dashboard.html");
                };
            } catch (e) { 
                console.error("Submission error:", e);
                Swal.fire('Error', e.message || "Failed to submit work", 'error'); 
            }
        };

        document.getElementById('discardBtn').onclick = () => location.reload();
    </script>
</body>
</html>
