name: Patch participant copy helper
on:
  push:
    paths:
      - ".github/workflows/patch-admin-participant-copy.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject participant copy helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-secure.html')
          s = p.read_text()
          tag = '<script defer src="/admin-participant-copy.js?v=20260904-1"></script>'
          if tag not in s:
              s = s.replace('</body>', f'{tag}\n</body>')
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-secure.html
          git commit -m "Load participant identifier copy helper" || exit 0
          git push
