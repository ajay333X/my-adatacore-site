name: Platform smoke checks

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './vendor/*' -not -path './node_modules/*' -print0)
      - name: Verify critical platform files
        shell: bash
        run: |
          set -euo pipefail
          test -f admin-entry.html
          test -f admin-theme.css
          test -f admin-theme.js
          test -f workspace.html
          test -f workspace-entry.html
          test -f project-lab-entry.html
          test -f project-lab-advanced-controls.js
          test -f project-lab-operations-suite.js
          test -f client-portal.html
          test -f client-portal.js
          test -f client-delivery-center.js
          test -f status.html
          test -f workspace-qualifications-guidelines.js
          test -f workspace-operations-context.js
          test -f admin-nav-fix.js
          test -f admin-operations-health.js
          test -f admin-operations-suite.js
          test -f admin-staff-roles.js
          test -f admin-finance-ledger.js
          test -f admin-support-center.js
          test -f admin-platform-navigation.js
          test -f admin-client-decision-review.js
          test -f client-error-monitor.js
          test -f client-batch-review.js
          test -f workspace-experience.js
          test -f workspace-support-skills.js
          test -f workspace-balance-ledger.js
          test -f workspace-platform-highlights.js
          test -f transcription-editor.js
          test -f transcription-lab.html
          test -f transcription-lab-ui.css
          test -f transcription-lab-dashboard.js
          test -f transcription-queue-priority.js
          test -f transcription-admin-flow.js
          test -f docs/supabase-auth-email-templates.md
          grep -q 'project-lab-advanced-controls.js?v=1' project-lab-entry.html
          grep -q 'project-lab-operations-suite.js?v=1' project-lab-entry.html
          grep -q 'client-portal.js?v=1' client-portal.html
          grep -q 'client-delivery-center.js?v=1' client-portal.html
          grep -q 'admin-theme.css?v=1' admin-entry.html
          grep -q 'admin-theme.js?v=1' admin-entry.html
          grep -q 'adatacore-admin-theme' admin-theme.js
          grep -q 'data-admin-theme="light"' admin-theme.css
          grep -q 'admin-theme-transition' admin-theme.css
          grep -q 'admin-operations-health.js?v=1' admin-entry.html
          grep -q 'admin-operations-suite.js?v=1' admin-entry.html
          grep -q 'admin-nav-fix.js?v=4' admin-entry.html
          grep -q 'admin-staff-roles.js?v=3' admin-entry.html
          grep -q 'admin-support-center.js?v=2' admin-entry.html
          grep -q 'admin-finance-ledger.js?v=2' admin-entry.html
          grep -q 'admin-platform-navigation.js?v=1' admin-entry.html
          grep -q 'profileSkillsCard' workspace-support-skills.js
          grep -q 'Action required before new work' workspace-qualifications-guidelines.js
          grep -q 'Profile & Skills' workspace-platform-highlights.js
          grep -q 'Please check your Spam or Junk folder as well' design-system.css
          grep -q 'Please check your Spam or Junk folder as well' workspace-operations-context.js
          grep -q 'Spam or Junk folder' verification-required.html
          grep -q 'transcription-lab-ui.css?v=1' transcription-lab.html
          grep -q 'transcription-lab-dashboard.js?v=1' transcription-lab.html
          grep -q 'data-tx-tab="overview"' transcription-lab.html
          grep -q 'data-tx-tab="queue"' transcription-lab.html
          grep -q 'data-tx-tab="intake"' transcription-lab.html
          grep -q 'id="dashboardReviewCount"' transcription-lab.html
          grep -q 'id="dashboardNextQueue"' transcription-lab.html
          grep -q 'id="dashboardProgressFill"' transcription-lab.html
          grep -q 'id="queueDeleteSelected"' transcription-lab.html
          grep -q 'id="queueArchiveSelected"' transcription-lab.html
          grep -q 'id="txArchivedManager"' transcription-lab.html
          grep -q 'data-queue-drag' transcription-queue-priority.js
          grep -q "tx_queue_reorder" transcription-queue-priority.js
          grep -q "tx_delete_queue_items" transcription-queue-priority.js
          grep -q "tx_archive_queue_items" transcription-queue-priority.js
          grep -q "tx_restore_archived" transcription-admin-flow.js
          grep -q 'Groq Whisper access verified' transcription-lab-dashboard.js
          grep -q 'tx-metric-grid' transcription-lab-ui.css
          grep -q 'tx-queue-card' transcription-lab-ui.css
          for shell in workspace.html workspace-entry.html; do
            grep -q 'workspace-experience.js?v=3' "$shell"
            grep -q 'workspace-support-skills.js?v=3' "$shell"
            grep -q 'workspace-balance-ledger.js?v=2' "$shell"
            grep -q 'workspace-platform-highlights.js?v=3' "$shell"
            grep -q 'workspace-qualifications-guidelines.js?v=2' "$shell"
            grep -q 'workspace-operations-context.js?v=1' "$shell"
            grep -q 'client-error-monitor.js?v=1' "$shell"
          done
          grep -q 'client-batch-review.js?v=5' client-batch-review.html
          grep -q 'admin-client-decision-review.js?v=1' admin-done-task-review.html

  production-routes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-safety
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production alias
        run: sleep 25
      - name: Check critical production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.adatacore.com'
          paths=(
            '/'
            '/auth'
            '/workspace'
            '/client-portal'
            '/status'
            '/admin'
            '/admin/assignments'
            '/admin/project-lab?project=81'
            '/admin/transcription?project=81'
            '/admin/done-tasks'
            '/client-batch-review.html'
            '/client-transcript-review.html'
          )
          for path in "${paths[@]}"; do
            echo "Checking ${base}${path}"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 "${base}${path}" >/dev/null
          done
      - name: Verify live shells contain new modules
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.adatacore.com'
          curl --fail --silent --show-error --location "${base}/workspace" | grep -q 'workspace-experience.js?v=3'
          curl --fail --silent --show-error --location "${base}/workspace" | grep -q 'workspace-platform-highlights.js?v=3'
          curl --fail --silent --show-error --location "${base}/workspace" | grep -q 'workspace-support-skills.js?v=3'
          curl --fail --silent --show-error --location "${base}/workspace" | grep -q 'workspace-qualifications-guidelines.js?v=2'
          curl --fail --silent --show-error --location "${base}/workspace" | grep -q 'workspace-operations-context.js?v=1'
          curl --fail --silent --show-error --location "${base}/admin" | grep -q 'admin-theme.css?v=1'
          curl --fail --silent --show-error --location "${base}/admin" | grep -q 'admin-theme.js?v=1'
          curl --fail --silent --show-error --location "${base}/admin" | grep -q 'admin-operations-suite.js?v=1'
          curl --fail --silent --show-error --location "${base}/admin" | grep -q 'admin-platform-navigation.js?v=1'
          curl --fail --silent --show-error --location "${base}/admin" | grep -q 'admin-nav-fix.js?v=4'
          curl --fail --silent --show-error --location "${base}/admin/project-lab?project=81" | grep -q 'project-lab-advanced-controls.js?v=1'
          curl --fail --silent --show-error --location "${base}/admin/project-lab?project=81" | grep -q 'project-lab-operations-suite.js?v=1'
          curl --fail --silent --show-error --location "${base}/client-portal" | grep -q 'client-portal.js?v=1'
          curl --fail --silent --show-error --location "${base}/client-portal" | grep -q 'client-delivery-center.js?v=1'
          curl --fail --silent --show-error --location "${base}/status" | grep -q 'Adatacore Status'
          tx="$(curl --fail --silent --show-error --location "${base}/admin/transcription?project=81")"
          grep -q 'transcription-lab-ui.css?v=1' <<<"$tx"
          grep -q 'transcription-lab-dashboard.js?v=1' <<<"$tx"
          grep -q 'data-tx-tab="overview"' <<<"$tx"
          grep -q 'data-tx-tab="queue"' <<<"$tx"
          grep -q 'data-tx-tab="intake"' <<<"$tx"
          grep -q 'id="dashboardReviewCount"' <<<"$tx"
          grep -q 'id="dashboardNextQueue"' <<<"$tx"
          grep -q 'id="queueDeleteSelected"' <<<"$tx"
          grep -q 'id="queueArchiveSelected"' <<<"$tx"
          grep -q 'id="txArchivedManager"' <<<"$tx"
      - name: Check critical deployed assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.adatacore.com'
          for asset in '/admin-theme.css?v=1' '/admin-theme.js?v=1' '/admin-nav-fix.js?v=4' '/admin-platform-navigation.js?v=1' '/admin-operations-health.js?v=1' '/admin-operations-suite.js?v=1' '/project-lab-advanced-controls.js?v=1' '/project-lab-operations-suite.js?v=1' '/workspace-experience.js?v=3' '/workspace-platform-highlights.js?v=3' '/workspace-support-skills.js?v=3' '/workspace-qualifications-guidelines.js?v=2' '/workspace-operations-context.js?v=1' '/client-portal.js?v=1' '/client-delivery-center.js?v=1' '/client-error-monitor.js?v=1' '/client-batch-review.js?v=5' '/transcription-lab-ui.css?v=1' '/transcription-lab-dashboard.js?v=1' '/transcription-queue-priority.js?v=3' '/transcription-admin-flow.js?v=2'; do
            echo "Checking ${base}${asset}"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 "${base}${asset}" >/dev/null
          done
