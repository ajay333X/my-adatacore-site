name: Platform smoke checks

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './vendor/*' -not -path './node_modules/*' -print0)

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json is valid JSON')"
          grep -Fq '"/admin/people"' vercel.json
          grep -Fq '"/admin/applications"' vercel.json
          grep -Fq '"/admin/trust-safety"' vercel.json
          grep -Fq '"/admin/transcription"' vercel.json

      - name: Verify critical platform files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html homepage-v2.css homepage-v2.js script.js design-system.css
            trust.html help.html public-info.css status.html
            auth.html dashboard.html apply.html application-onboarding.js application-onboarding.css
            workspace.html workspace-entry.html workspace-application-banner.js
            admin-entry.html admin-theme.css admin-theme.js admin-global-search.js
            admin-people360.html admin-people360.js admin-trust-safety-link.js
            admin-applications.html admin-applications.js admin-applications-link.js
            admin-applications-analytics.js admin-applications-analytics.css
            assignment-center-entry.html assignment-center.js
            project-lab-entry.html project-lab-advanced-controls.js project-lab-operations-suite.js
            transcription-lab.html transcription-lab.js transcription-lab-ui.css
            transcription-lab-dashboard.js transcription-long-audio.js transcription-queue-priority.js transcription-admin-flow.js
            client-portal.html client-portal.js client-delivery-center.js
            docs/supabase-auth-email-templates.md
          )
          failed=0
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Critical platform file is missing"
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify durable application contracts
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local pattern="$1" file="$2"
            if ! grep -Fq "$pattern" "$file"; then
              echo "::error file=$file::Missing required platform contract: $pattern"
              return 1
            fi
          }
          check 'homepage-v2.css' index.html
          check 'homepage-v2.js' index.html
          check 'AI data workflows built for' index.html
          check 'openProjectInquiry' homepage-v2.js
          check 'company_inquiries' homepage-v2.js
          check 'get_my_application_onboarding' dashboard.html
          check "location.replace('/apply')" dashboard.html
          check 'application_choose_tracks' application-onboarding.js
          check 'submit_voice_application' application-onboarding.js
          check 'submit_transcription_application' application-onboarding.js
          check 'admin_application_queue_v2' admin-applications.js
          check 'admin_set_application_decision' admin-applications.js
          check 'admin-applications-analytics.js' admin-applications.html
          check 'admin_application_analytics' admin-applications-analytics.js
          check 'Application Intelligence' admin-applications-analytics.js
          check 'admin_people_360' admin-people360.js
          check 'data-people-360-link' admin-trust-safety-link.js
          check 'Trust Center' trust.html
          check 'Help Center' help.html
          check 'MAX_SOURCE_BYTES=262144000' transcription-long-audio.js
          check 'tx_delete_queue_items' transcription-queue-priority.js
          check 'tx_archive_queue_items' transcription-queue-priority.js
          check 'tx_restore_archived' transcription-admin-flow.js

  production-routes:
    # Always test production after a main push, even if a static assertion fails.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-safety
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production alias
        run: sleep 35

      - name: Check critical production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.adatacore.com'
          paths=(
            '/'
            '/trust'
            '/help'
            '/status'
            '/auth'
            '/apply'
            '/workspace'
            '/client-portal'
            '/admin'
            '/admin/people'
            '/admin/applications'
            '/admin/assignments'
            '/admin/trust-safety'
            '/admin/project-lab?project=81'
            '/admin/transcription?project=81'
            '/admin/done-tasks'
            '/client-batch-review.html'
            '/client-transcript-review.html'
          )
          for path in "${paths[@]}"; do
            echo "Checking ${base}${path}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 \
              "${base}${path}" >/dev/null
          done

      - name: Verify live shells contain critical modules
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.adatacore.com'
          home="$(curl --fail --silent --show-error --location "${base}/")"
          workspace="$(curl --fail --silent --show-error --location "${base}/workspace")"
          admin="$(curl --fail --silent --show-error --location "${base}/admin")"
          apply="$(curl --fail --silent --show-error --location "${base}/apply")"
          applications="$(curl --fail --silent --show-error --location "${base}/admin/applications")"
          people="$(curl --fail --silent --show-error --location "${base}/admin/people")"
          trust="$(curl --fail --silent --show-error --location "${base}/trust")"
          help="$(curl --fail --silent --show-error --location "${base}/help")"
          tx="$(curl --fail --silent --show-error --location "${base}/admin/transcription?project=81")"

          grep -Fq 'homepage-v2.css' <<<"$home"
          grep -Fq 'homepage-v2.js' <<<"$home"
          grep -Fq 'AI data workflows built for' <<<"$home"
          grep -Fq 'workspace-experience.js' <<<"$workspace"
          grep -Fq 'workspace-application-banner.js' <<<"$workspace"
          grep -Fq 'admin-theme.css' <<<"$admin"
          grep -Fq 'admin-applications-link.js' <<<"$admin"
          grep -Fq 'application-onboarding.js' <<<"$apply"
          grep -Fq 'Application Review' <<<"$applications"
          grep -Fq 'admin-applications-analytics.js' <<<"$applications"
          grep -Fq 'admin-applications-analytics.css' <<<"$applications"
          grep -Fq 'People 360' <<<"$people"
          grep -Fq 'Trust is part of the workflow' <<<"$trust"
          grep -Fq 'Search the Help Center' <<<"$help"
          grep -Fq 'transcription-lab-ui.css' <<<"$tx"
          grep -Fq 'transcription-lab-dashboard.js' <<<"$tx"
          curl --fail --silent --show-error --location "${base}/status" | grep -Fq 'Adatacore Status'

      - name: Check critical deployed assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.adatacore.com'
          assets=(
            '/homepage-v2.css' '/homepage-v2.js' '/script.js' '/public-info.css'
            '/application-onboarding.css' '/application-onboarding.js'
            '/workspace-application-banner.js'
            '/admin-theme.css' '/admin-theme.js' '/admin-global-search.js'
            '/admin-people360.js' '/admin-trust-safety-link.js'
            '/admin-applications.js' '/admin-applications-link.js'
            '/admin-applications-analytics.js' '/admin-applications-analytics.css'
            '/project-lab-advanced-controls.js' '/project-lab-operations-suite.js'
            '/transcription-lab.js' '/transcription-lab-ui.css' '/transcription-lab-dashboard.js'
            '/transcription-long-audio.js' '/transcription-queue-priority.js' '/transcription-admin-flow.js'
            '/client-portal.js' '/client-delivery-center.js'
          )
          for asset in "${assets[@]}"; do
            echo "Checking ${base}${asset}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 \
              "${base}${asset}" >/dev/null
          done
