name: Platform smoke checks

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './vendor/*' -not -path './node_modules/*' -print0)

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json is valid JSON')"
          grep -Fq '"/admin/people"' vercel.json
          grep -Fq '"/admin/coreforge"' vercel.json
          grep -Fq 'Content-Security-Policy' vercel.json

      - name: Verify critical platform files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html homepage-v2.css homepage-enterprise.css homepage-v2.js adatacore-mark.svg assets/adatacore-logo.jpg
            public-company.css public-company.js teams.html contributors.html about.html contact.html
            privacy.html terms.html contributor-terms.html cookies.html subprocessors.html robots.txt sitemap.xml .well-known/security.txt
            trust.html help.html public-info.css status.html
            auth.html dashboard.html apply.html application-onboarding.js application-onboarding.css
            workspace.html workspace-entry.html workspace-application-banner.js
            admin-entry.html admin-theme.css admin-theme.js admin-global-search.js
            admin-people360.html admin-people360.js admin-trust-safety-link.js
            admin-applications.html admin-applications.js admin-applications-link.js
            admin-applications-analytics.js admin-applications-analytics.css
            coreforge.html coreforge.css coreforge.js admin-coreforge-link.js
            assignment-center-entry.html assignment-center.js
            project-lab-entry.html project-lab-advanced-controls.js project-lab-operations-suite.js
            transcription-lab.html transcription-lab.js transcription-lab-ui.css
            transcription-lab-dashboard.js transcription-long-audio.js transcription-queue-priority.js transcription-admin-flow.js
            client-portal.html client-portal.js client-delivery-center.js
            supabase/functions/public-site-gateway/index.ts
            supabase/migrations/20260903135908_public_site_gateway_rate_limits_and_events.sql
          )
          failed=0
          for file in "${files[@]}"; do if [[ ! -f "$file" ]]; then echo "::error file=$file::Critical platform file is missing"; failed=1; fi; done
          exit "$failed"

      - name: Verify durable platform contracts
        shell: bash
        run: |
          set -euo pipefail
          check(){ local pattern="$1" file="$2"; grep -Fq "$pattern" "$file" || { echo "::error file=$file::Missing required platform contract: $pattern"; return 1; }; }
          check 'Operate the human layer' index.html
          check 'homepage-enterprise.css' index.html
          check "url('/assets/adatacore-logo.jpg')" homepage-enterprise.css
          check 'adatacore-mark-float' homepage-enterprise.css
          check 'Precision in Every Byte.' homepage-v2.js
          check 'initPrecisionTagline' homepage-v2.js
          check 'a.home-btn-primary{color:#fff!important}' homepage-enterprise.css
          check "url('/adatacore-mark.svg')" public-company.css
          check 'a.cp-btn.primary' public-company.css
          check 'Precision in Every Byte.' public-info.css
          check 'public-site-gateway' homepage-v2.js
          check 'project_inquiry_submit_success' homepage-v2.js
          check 'Voice and transcription first' teams.html
          check 'does not charge contributors a fee' contributors.html
          check 'Privacy Policy' privacy.html
          check 'Contributor Terms' contributor-terms.html
          check 'Supabase' subprocessors.html
          check 'Sitemap: https://www.adatacore.com/sitemap.xml' robots.txt
          check 'get_my_application_onboarding' dashboard.html
          check "location.replace('/apply')" dashboard.html
          check 'application_choose_tracks' application-onboarding.js
          check 'admin_application_queue_v2' admin-applications.js
          check 'admin_application_analytics' admin-applications-analytics.js
          check 'admin_people_360' admin-people360.js
          check 'CoreForge' coreforge.html
          check 'coreforge_snapshot' coreforge.js
          check '/admin/coreforge' admin-coreforge-link.js
          check 'admin-coreforge-link.js' admin-entry.html
          check 'MAX_SOURCE_BYTES=262144000' transcription-long-audio.js

  production-routes:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-safety
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production alias
        run: sleep 35

      - name: Check critical production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.adatacore.com'
          paths=(
            '/' '/teams' '/contributors' '/about' '/contact' '/privacy' '/terms' '/contributor-terms' '/cookies' '/subprocessors'
            '/trust' '/help' '/status' '/robots.txt' '/sitemap.xml' '/.well-known/security.txt'
            '/auth' '/apply' '/workspace' '/client-portal' '/admin' '/admin/people' '/admin/applications' '/admin/assignments' '/admin/trust-safety' '/admin/coreforge'
            '/admin/project-lab?project=81' '/admin/transcription?project=81' '/admin/done-tasks' '/client-batch-review.html' '/client-transcript-review.html'
          )
          for path in "${paths[@]}"; do curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 "${base}${path}" >/dev/null; done

      - name: Verify live shells contain critical modules
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.adatacore.com'
          home="$(curl --fail --silent --show-error --location "${base}/")"
          teams="$(curl --fail --silent --show-error --location "${base}/teams")"
          contributors="$(curl --fail --silent --show-error --location "${base}/contributors")"
          privacy="$(curl --fail --silent --show-error --location "${base}/privacy")"
          workspace="$(curl --fail --silent --show-error --location "${base}/workspace")"
          admin="$(curl --fail --silent --show-error --location "${base}/admin")"
          applications="$(curl --fail --silent --show-error --location "${base}/admin/applications")"
          coreforge="$(curl --fail --silent --show-error --location "${base}/admin/coreforge")"
          home_css="$(curl --fail --silent --show-error --location "${base}/homepage-enterprise.css")"
          home_js="$(curl --fail --silent --show-error --location "${base}/homepage-v2.js")"
          public_css="$(curl --fail --silent --show-error --location "${base}/public-company.css")"
          grep -Fq 'homepage-enterprise.css' <<<"$home"
          grep -Fq 'Operate the human layer' <<<"$home"
          grep -Fq "url('/assets/adatacore-logo.jpg')" <<<"$home_css"
          grep -Fq 'adatacore-mark-float' <<<"$home_css"
          grep -Fq 'Precision in Every Byte.' <<<"$home_js"
          grep -Fq 'initPrecisionTagline' <<<"$home_js"
          grep -Fq 'a.home-btn-primary{color:#fff!important}' <<<"$home_css"
          grep -Fq "url('/adatacore-mark.svg')" <<<"$public_css"
          grep -Fq 'Voice and transcription first' <<<"$teams"
          grep -Fq 'does not charge contributors a fee' <<<"$contributors"
          grep -Fq 'Privacy Policy' <<<"$privacy"
          grep -Fq 'workspace-experience.js' <<<"$workspace"
          grep -Fq 'admin-theme.css' <<<"$admin"
          grep -Fq 'Application Review' <<<"$applications"
          grep -Fq 'Adatacore Model & Data Lab' <<<"$coreforge"
          grep -Fq 'coreforge.js' <<<"$coreforge"
          curl --fail --silent --show-error --location "${base}/assets/adatacore-logo.jpg" >/dev/null
          curl --fail --silent --show-error --head "${base}/" | grep -Fiq 'content-security-policy:'

      - name: Check critical deployed assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.adatacore.com'
          assets=(
            '/assets/adatacore-logo.jpg' '/adatacore-mark.svg' '/homepage-v2.css' '/homepage-enterprise.css' '/homepage-v2.js' '/public-company.css' '/public-company.js' '/public-info.css'
            '/application-onboarding.css' '/application-onboarding.js' '/workspace-application-banner.js'
            '/admin-theme.css' '/admin-theme.js' '/admin-global-search.js' '/admin-people360.js' '/admin-trust-safety-link.js'
            '/admin-applications.js' '/admin-applications-link.js' '/admin-applications-analytics.js' '/admin-applications-analytics.css'
            '/coreforge.css' '/coreforge.js' '/admin-coreforge-link.js'
            '/project-lab-advanced-controls.js' '/project-lab-operations-suite.js'
            '/transcription-lab.js' '/transcription-lab-ui.css' '/transcription-lab-dashboard.js' '/transcription-long-audio.js' '/transcription-queue-priority.js' '/transcription-admin-flow.js'
            '/client-portal.js' '/client-delivery-center.js'
          )
          for asset in "${assets[@]}"; do curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 "${base}${asset}" >/dev/null; done
