name: CoreForge Hindi chatbot dataset refresh
on:
  workflow_dispatch:
  push:
    paths:
      - 'workers/coreforge_hindi_data.py'
      - '.github/workflows/coreforge-hindi-data.yml'
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
concurrency:
  group: coreforge-hindi-data-refresh
  cancel-in-progress: true
jobs:
  prepare-hindi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hugging Face datasets
        run: python -m pip install 'datasets>=3,<5' 'huggingface-hub>=0.28,<2'
      - name: Check importer syntax
        run: python -m py_compile workers/coreforge_hindi_data.py workers/coreforge_chat_data.py
      - name: Import licensed public Hindi and Hinglish research samples
        run: python workers/coreforge_hindi_data.py --sources aya_hindi,hinglish --limit 1500 --accept-license --out coreforge-hindi-data
      - name: Confirm manifest and splits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('coreforge-hindi-data')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['prepared_count']>=40
          assert not manifest['production_approval']
          assert set(manifest['splits']) == {'train','validation','test'}
          assert all((root/(s+'.jsonl')).exists() and manifest['splits'][s]>0 for s in manifest['splits'])
          print('Prepared:',manifest['prepared_count'],'by source:',manifest['counts'],'splits:',manifest['splits'])
          PY
      - name: Save dataset for research training
        uses: actions/upload-artifact@v4
        with:
          name: coreforge-hindi-chatbot-research-data
          path: coreforge-hindi-data/
          retention-days: 14
          if-no-files-found: error
