name: CoreForge chatbot static checks
on:
  push:
    paths:
      - 'coreforge-chatbot.*'
      - 'coreforge.html'
      - 'vercel.json'
      - 'workers/coreforge_chat_*.py'
      - 'workers/CoreForge_Chatbot_Colab.ipynb'
      - 'workers/CoreForge_Hindi_v02_Colab.ipynb'
      - 'workers/CoreForge_Hindi_v03_Colab.ipynb'
      - 'workers/CoreForge_Hindi_v03_Lite_Colab.ipynb'
      - 'workers/CoreForge_Hindi_Baseline_Quality_Lab.ipynb'
      - 'workers/coreforge_hindi_v03_filter.py'
      - 'workers/CoreForge_Compare_Hindi_v02.ipynb'
      - '.github/workflows/coreforge-chatbot-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate chatbot scripts
        run: |
          node --check coreforge-chatbot.js
          python -m py_compile workers/coreforge_chat_data.py workers/coreforge_chat_train.py
      - name: Verify notebook, site links and routes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          nb=json.loads(Path('workers/CoreForge_Chatbot_Colab.ipynb').read_text())
          assert nb['nbformat']==4 and len(nb['cells'])>=5
          v02=json.loads(Path('workers/CoreForge_Hindi_v02_Colab.ipynb').read_text())
          assert v02['nbformat']==4 and len(v02['cells'])>=10
          for cell in v02['cells']:
            if cell['cell_type']=='code':
              source=''.join(cell['source'])
              if source.lstrip().startswith('!') or source.lstrip().startswith('%'): continue
              import ast
              ast.parse(source)
          assert any('BASELINE_READABLE = False' in ''.join(c['source']) for c in v02['cells'])
          assert any('Qwen/Qwen3-1.7B' in ''.join(c['source']) for c in v02['cells'])
          v03=json.loads(Path('workers/CoreForge_Hindi_v03_Colab.ipynb').read_text())
          assert v03['nbformat']==4 and len(v03['cells'])>=12
          for cell in v03['cells']:
            if cell['cell_type']=='code':
              source=''.join(cell['source'])
              if source.lstrip().startswith('!') or source.lstrip().startswith('%'): continue
              ast.parse(source)
          assert any('BASELINE_PASSED=False' in ''.join(c['source']) for c in v03['cells'])
          assert any('DATA_REVIEWED=False' in ''.join(c['source']) for c in v03['cells'])
          assert any('Qwen/Qwen3-4B-Instruct-2507' in ''.join(c['source']) for c in v03['cells'])
          lite=json.loads(Path('workers/CoreForge_Hindi_v03_Lite_Colab.ipynb').read_text())
          assert lite['nbformat']==4 and len(lite['cells'])>=10
          for cell in lite['cells']:
            if cell['cell_type']=='code':
              source=''.join(cell['source'])
              ast.parse(source)
          assert any('Qwen/Qwen3-1.7B' in ''.join(c['source']) for c in lite['cells'])
          baseline=json.loads(Path('workers/CoreForge_Hindi_Baseline_Quality_Lab.ipynb').read_text())
          assert baseline['nbformat']==4 and len(baseline['cells'])>=10
          for cell in baseline['cells']:
            if cell['cell_type']=='code':
              ast.parse(''.join(cell['source']))
          assert any('Qwen/Qwen3-4B-Instruct-2507' in ''.join(c['source']) for c in baseline['cells'])
          assert any('human-review.csv' in ''.join(c['source']) for c in baseline['cells'])


          ast.parse(Path('workers/coreforge_hindi_v03_filter.py').read_text())
          trainer_source=Path('workers/coreforge_chat_train.py').read_text()
          assert 'build_training_row(row, tokenizer, args.max_tokens))' not in trainer_source
          assert trainer_source.count('build_training_row(row, tokenizer, args.max_tokens, args.model)') == 3


          compare=json.loads(Path('workers/CoreForge_Compare_Hindi_v02.ipynb').read_text())
          assert compare['nbformat']==4 and len(compare['cells'])>=10
          for cell in compare['cells']:
            if cell['cell_type']=='code':
              source=''.join(cell['source'])
              if source.lstrip().startswith('!') or source.lstrip().startswith('%'): continue
              ast.parse(source)
          assert any('Qwen/Qwen3-1.7B' in ''.join(c['source']) for c in compare['cells'])

          site=Path('coreforge.html').read_text()
          assert '/admin/coreforge-chatbot' in site
          page=Path('coreforge-chatbot.html').read_text()
          assert 'coreforge-chatbot.js?v=1' in page and 'coreforge-chatbot.css?v=1' in page
          assert Path('coreforge-chatbot.css').stat().st_size>200
          vercel=json.loads(Path('vercel.json').read_text())
          assert any(row.get('source')=='/admin/coreforge-chatbot' and row.get('destination')=='/coreforge-chatbot' for row in vercel['rewrites'])
          assert not any('GROQ_API_KEY' in Path(p).read_text() for p in ['coreforge-chatbot.js','coreforge-chatbot.html'])
          print('CoreForge chatbot static checks passed.')
          PY
