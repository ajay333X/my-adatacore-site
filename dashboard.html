<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Workstation — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --accent: #A78BFA; --bg-dark: #050510; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; min-height: 100vh; overflow-x: hidden; }
        
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.1); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .glass-card:hover { border-color: rgba(167, 139, 250, 0.4); transform: scale(1.02) translateY(-2px); background: rgba(167, 139, 250, 0.04); }
        
        .btn-haptic { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .btn-haptic:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn-haptic:active { transform: scale(0.95); }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .reveal-item { opacity: 0; animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        #sidebar { transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); width: 260px; }
        #sidebar.collapsed { width: 80px; }
        .collapsed .nav-text { display: none; }
        .text-gradient { background: linear-gradient(135deg, #fff 40%, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .custom-scroll::-webkit-scrollbar { height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <aside id="sidebar" class="h-screen glass fixed left-0 top-0 flex flex-col border-r border-white/5 z-30">
        <div class="p-6 mb-8 flex items-center justify-between">
            <div class="flex items-center gap-3 font-bold text-white tracking-tight">
                <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">A</div>
                <span class="nav-text">Adatacore</span>
            </div>
            <button onclick="toggleSidebar()" class="p-2 hover:bg-white/10 rounded-lg transition-colors text-white">✨</button>
        </div>

        <nav class="flex-1 px-4 space-y-2">
            <a href="profile.html" class="flex items-center gap-4 px-4 py-3 bg-white/5 rounded-xl border border-white/5 mb-6 group transition-all hover:border-purple-500/30">
                <div id="user-initials" class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center text-xs font-bold text-white">U</div>
                <span class="nav-text text-xs font-semibold truncate text-white" id="user-display-name">Loading...</span>
            </a>
            <div class="flex items-center gap-4 px-4 py-3 bg-purple-600/10 text-purple-400 rounded-xl">
                <span>📊</span> <span class="nav-text text-sm font-medium">Dashboard</span>
            </div>
            <div id="admin-nav-container"></div>
        </nav>

        <button id="btn-logout" class="m-4 flex items-center gap-4 px-4 py-3 text-sm font-medium text-red-400 hover:bg-red-500/10 rounded-xl transition-all">
            <span>🚪</span> <span class="nav-text text-white">Logout</span>
        </button>
    </aside>

    <main id="main-content" class="ml-[260px] p-10 w-full transition-all duration-500">
        <header class="flex justify-between items-end mb-12 reveal-item" style="animation-delay: 0.1s">
            <div>
                <h1 id="greeting" class="text-4xl font-bold text-gradient">Hello</h1>
                <p id="display-uid" class="text-[10px] font-mono text-gray-500 mt-2 tracking-[0.2em] uppercase">UID: AD-LOADING...</p>
            </div>
            <div class="glass px-4 py-2 rounded-full border-white/5 flex items-center gap-2">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Core Synchronized</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-12">
            <div class="lg:col-span-1 glass-card p-6 rounded-[32px] reveal-item" style="animation-delay: 0.2s">
                <p class="text-gray-500 text-[10px] uppercase font-bold tracking-widest mb-4">Total Balance</p>
                <h3 class="text-4xl font-bold text-white">$<span id="stat-balance">0.00</span></h3>
                <p class="text-[10px] text-green-400 mt-2 font-semibold">↑ Verified in Real-time</p>
            </div>

            <div class="lg:col-span-2 glass-card p-6 rounded-[32px] reveal-item" style="animation-delay: 0.3s">
                <div class="flex justify-between items-center mb-4">
                    <p class="text-gray-500 text-[10px] uppercase font-bold tracking-widest">Performance Stream</p>
                    <div class="flex gap-2"><span class="w-2 h-2 bg-purple-500 rounded-full"></span><span class="w-2 h-2 bg-gray-700 rounded-full"></span></div>
                </div>
                <canvas id="earningChart" height="85"></canvas>
            </div>

            <div class="lg:col-span-1 glass-card p-6 rounded-[32px] border-purple-500/20 reveal-item" style="animation-delay: 0.4s">
                <p class="text-gray-500 text-[10px] uppercase font-bold tracking-widest mb-4">Quality Score</p>
                <div class="flex items-center justify-between">
                    <h3 class="text-4xl font-bold text-purple-400">98%</h3>
                    <div class="text-right">
                        <div class="text-[10px] text-white font-bold uppercase">Excellent</div>
                        <div class="text-[8px] text-gray-500 uppercase tracking-tighter font-bold">Tier 1 Elite</div>
                    </div>
                </div>
                <div class="w-full bg-white/5 h-1.5 mt-6 rounded-full overflow-hidden">
                    <div class="bg-gradient-to-r from-purple-600 to-indigo-400 h-full w-[98%] shadow-[0_0_10px_rgba(167,139,250,0.4)]"></div>
                </div>
            </div>
        </div>

        <h2 class="text-xl font-bold mb-8 flex items-center gap-3 reveal-item" style="animation-delay: 0.5s">
            <span class="w-8 h-[1px] bg-purple-500/50"></span>
            Assigned Projects
        </h2>
        <div id="task-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8"></div>

        <h2 class="text-xl font-bold mt-16 mb-8 flex items-center gap-3 reveal-item" style="animation-delay: 0.7s">
            <span class="w-8 h-[1px] bg-purple-500/50"></span>
            Recent Submissions
        </h2>
        <div class="glass-card rounded-[32px] overflow-hidden reveal-item custom-scroll" style="animation-delay: 0.8s">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-white/5 border-b border-white/5">
                            <th class="p-6 text-[10px] uppercase font-bold tracking-widest text-gray-500">Project Name</th>
                            <th class="p-6 text-[10px] uppercase font-bold tracking-widest text-gray-500">Payout</th>
                            <th class="p-6 text-[10px] uppercase font-bold tracking-widest text-gray-500">Timestamp</th>
                            <th class="p-6 text-[10px] uppercase font-bold tracking-widest text-gray-500 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="history-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPBpzQfnilr2vm7kdRiNqOH89u7uxCjrk",
            authDomain: "adatacore-f.firebaseapp.com",
            projectId: "adatacore-f",
            storageBucket: "adatacore-f.firebasestorage.app",
            messagingSenderId: "806498602099",
            appId: "1:806498602099:web:426b145c9c0a0bd9c7ae06",
            measurementId: "G-740M8K5M0J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            const main = document.getElementById('main-content');
            sb.classList.toggle('collapsed');
            main.style.marginLeft = sb.classList.contains('collapsed') ? '80px' : '260px';
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        const name = data.fullName || "User";
                        document.getElementById('user-display-name').innerText = name;
                        document.getElementById('user-initials').innerText = name.charAt(0).toUpperCase();
                        document.getElementById('display-uid').innerText = "UID: " + (data.uniqueID || "N/A");
                        document.getElementById('stat-balance').innerText = (data.balance || 0).toFixed(2);
                        
                        const hrs = new Date().getHours();
                        let msg = hrs < 12 ? "Good Morning" : hrs < 17 ? "Good Afternoon" : "Good Evening";
                        document.getElementById('greeting').innerText = `${msg}, ${name.split(' ')[0]}`;

                        if (data.role === 'admin' || user.email === "as4556676@gmail.com") {
                            document.getElementById('admin-nav-container').innerHTML = `
                                <a href="admin.html" class="flex items-center gap-4 px-4 py-3 text-sm font-bold text-yellow-500 hover:bg-yellow-500/10 rounded-xl mt-4">
                                    <span>🛡️</span> <span class="nav-text">Admin Space</span>
                                </a>`;
                        }
                        loadMyTasks(data.uniqueID);
                        loadHistory(data.uniqueID);
                        renderChart();
                    }
                });
            } else { window.location.replace("auth.html"); }
        });

        function loadMyTasks(uid) {
            if(!uid) return;
            const qTasks = query(collection(db, "tasks"), where("assignedTo", "==", uid));
            onSnapshot(qTasks, (snap) => {
                const container = document.getElementById('task-container');
                if (snap.empty) {
                    container.innerHTML = `<div class="col-span-full py-16 text-center glass-card rounded-[40px] border-dashed border-white/10 text-gray-500">No active assignments for ID: ${uid}</div>`;
                    return;
                }
                container.innerHTML = "";
                let delay = 0.6;
                snap.forEach((d) => {
                    const t = d.data();
                    container.innerHTML += `
                        <div class="glass-card p-8 rounded-[36px] reveal-item" style="animation-delay: ${delay}s">
                            <div class="flex justify-between items-start mb-8">
                                <div class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center text-2xl">🧩</div>
                                <div class="text-right">
                                    <p class="text-[9px] text-gray-500 font-bold uppercase tracking-tighter">Rate</p>
                                    <p class="text-green-400 font-bold text-lg">$${(t.price || 0).toFixed(2)}</p>
                                </div>
                            </div>
                            <h4 class="font-bold text-xl mb-3">${t.title}</h4>
                            <p class="text-gray-500 text-xs mb-8 line-clamp-2 leading-relaxed">${t.description || 'System contribution task.'}</p>
                            <a href="${t.targetPage || 'task_player.html'}" class="btn-haptic block w-full text-center py-4 bg-white text-black rounded-2xl text-xs font-bold tracking-widest shadow-xl">START ➔</a>
                        </div>`;
                    delay += 0.1;
                });
            });
        }

        function loadHistory(uniqueID) {
            const qSub = query(collection(db, "submissions"), where("workerID", "==", uniqueID));
            onSnapshot(qSub, (snap) => {
                const body = document.getElementById('history-body');
                if(snap.empty) {
                    body.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-gray-600 text-xs tracking-widest">No previous submissions found</td></tr>`;
                    return;
                }
                body.innerHTML = "";
                const sorted = snap.docs.sort((a,b) => b.data().timestamp - a.data().timestamp);
                sorted.forEach(d => {
                    const s = d.data();
                    const status = s.status || 'Pending';
                    const color = status === 'Approved' ? 'text-green-400 border-green-500/20 bg-green-500/10' : status === 'Rejected' ? 'text-red-400 border-red-500/20 bg-red-500/10' : 'text-yellow-400 border-yellow-500/20 bg-yellow-500/10';
                    body.innerHTML += `
                        <tr class="hover:bg-white/[0.02] transition-colors">
                            <td class="p-6">
                                <div class="text-sm font-bold text-white">${s.projectTitle || 'AI Task'}</div>
                                <div class="text-[9px] text-gray-600 font-mono">REF: ${d.id.slice(0,8)}</div>
                            </td>
                            <td class="p-6 text-sm font-bold text-white">$${(s.earnedAmount || 0).toFixed(4)}</td>
                            <td class="p-6 text-xs text-gray-500">${s.timestamp?.toDate().toLocaleString() || 'Recent'}</td>
                            <td class="p-6 text-center">
                                <span class="px-3 py-1 rounded-full text-[8px] font-bold uppercase tracking-widest border ${color}">${status}</span>
                            </td>
                        </tr>`;
                });
            });
        }

        function renderChart() {
            const ctx = document.getElementById('earningChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['S', 'M', 'T', 'W', 'T', 'F', 'S'],
                    datasets: [{
                        data: [5, 12, 8, 15, 10, 20, 18],
                        borderColor: '#A78BFA',
                        borderWidth: 3, pointRadius: 0, tension: 0.4, fill: true,
                        backgroundColor: 'rgba(167, 139, 250, 0.05)'
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } },
                    scales: { x: { grid: { display: false }, ticks: { color: '#444', font: { size: 9 } } }, y: { display: false } }
                }
            });
        }

        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
