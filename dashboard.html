<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Workstation — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --accent: #A78BFA; --bg-dark: #050510; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; min-height: 100vh; overflow-x: hidden; }
        
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.1); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .glass-card:hover { border-color: rgba(167, 139, 250, 0.4); transform: scale(1.02) translateY(-2px); background: rgba(167, 139, 250, 0.04); }
        
        /* 🚨 Red Alert Light */
        .red-pulse { width: 8px; height: 8px; background: #ff4444; border-radius: 50%; box-shadow: 0 0 10px #ff4444; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.2); } }

        /* Marquee */
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .marquee-content { display: inline-block; white-space: nowrap; animation: marquee 25s linear infinite; }

        /* Entrance Animation */
        @keyframes reveal { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .reveal-item { opacity: 0; animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        #sidebar { transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); width: 260px; }
        #sidebar.collapsed { width: 80px; }
        .collapsed .nav-text { display: none; }
        .text-gradient { background: linear-gradient(135deg, #fff 40%, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <aside id="sidebar" class="h-screen glass fixed left-0 top-0 flex flex-col border-r border-white/5 z-30">
        <div class="p-6 mb-8 flex items-center justify-between">
            <div class="flex items-center gap-3 font-bold text-white tracking-tight">
                <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center font-black">A</div>
                <span class="nav-text">Adatacore</span>
            </div>
            <button onclick="toggleSidebar()" class="p-2 hover:bg-white/10 rounded-lg transition-colors text-white">✨</button>
        </div>

        <nav class="flex-1 px-4 space-y-2">
            <a href="profile.html" class="flex items-center gap-4 px-4 py-3 bg-white/5 rounded-xl border border-white/5 mb-6 group transition-all">
                <div id="user-initials" class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center text-xs font-bold text-white uppercase">U</div>
                <span class="nav-text text-xs font-semibold truncate text-white" id="user-display-name">Loading...</span>
            </a>
            <div class="flex items-center gap-4 px-4 py-3 bg-purple-600/10 text-purple-400 rounded-xl">
                <span>📊</span> <span class="nav-text text-sm font-medium">Dashboard</span>
            </div>
            
            <div id="sidebar-alert" class="hidden flex items-center gap-4 px-4 py-3 text-red-400 bg-red-400/5 rounded-xl border border-red-400/10 mt-2">
                <div class="red-pulse"></div> <span class="nav-text text-[10px] font-bold uppercase tracking-widest">Active News</span>
            </div>

            <div id="admin-nav-container"></div>
        </nav>

        <button id="btn-logout" class="m-4 flex items-center gap-4 px-4 py-3 text-sm font-medium text-red-400 hover:bg-red-500/10 rounded-xl">
            <span>🚪</span> <span class="nav-text text-white">Logout</span>
        </button>
    </aside>

    <main id="main-content" class="ml-[260px] p-10 w-full transition-all duration-500">
        
        <!-- LIVE ANNOUNCEMENT BANNER -->
        <div id="announcement-banner" class="hidden mb-10 glass rounded-2xl overflow-hidden border-purple-500/20 shadow-2xl reveal-item">
            <div class="flex items-center">
                <div class="bg-purple-600 px-4 py-3 text-[9px] font-black z-10 shadow-xl tracking-tighter text-white">ANNOUNCEMENT</div>
                <div class="flex-1 overflow-hidden py-3">
                    <p id="announcement-text" class="marquee-content text-[11px] font-semibold text-purple-100 uppercase tracking-wider">Loading updates...</p>
                </div>
                <button onclick="acknowledgeMsg()" class="bg-white/10 hover:bg-white/20 px-4 py-3 text-[9px] font-bold border-l border-white/5 transition-all text-white">I UNDERSTAND ➔</button>
            </div>
        </div>

        <header class="flex justify-between items-end mb-12 reveal-item" style="animation-delay: 0.1s">
            <div>
                <h1 id="greeting" class="text-4xl font-bold text-gradient">Hello</h1>
                <p id="display-uid" class="text-[10px] font-mono text-gray-500 mt-2 tracking-[0.2em] uppercase">UID: AD-LOADING...</p>
            </div>
            <div class="glass px-4 py-2 rounded-full border-white/5 flex items-center gap-2">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Core Synchronized</span>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-12">
            <div class="lg:col-span-1 glass-card p-6 rounded-[32px] reveal-item" style="animation-delay: 0.2s">
                <p class="text-gray-500 text-[10px] uppercase font-bold tracking-widest mb-4">Total Balance</p>
                <h3 class="text-4xl font-bold text-white">$<span id="stat-balance">0.00</span></h3>
            </div>
            <div class="lg:col-span-2 glass-card p-6 rounded-[32px] reveal-item" style="animation-delay: 0.3s">
                <canvas id="earningChart" height="85"></canvas>
            </div>
            <div class="lg:col-span-1 glass-card p-6 rounded-[32px] border-purple-500/20 reveal-item" style="animation-delay: 0.4s">
                <p class="text-gray-500 text-[10px] uppercase font-bold tracking-widest mb-4">Quality Score</p>
                <h3 class="text-4xl font-bold text-purple-400">98%</h3>
            </div>
        </div>

        <h2 class="text-xl font-bold mb-8 flex items-center gap-3 reveal-item" style="animation-delay: 0.5s">
            <span class="w-8 h-[1px] bg-purple-500/50"></span> Assigned Projects
        </h2>
        <div id="task-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8"></div>

        <h2 class="text-xl font-bold mt-16 mb-8 flex items-center gap-3 reveal-item" style="animation-delay: 0.7s">
            <span class="w-8 h-[1px] bg-purple-500/50"></span> Recent Submissions
        </h2>
        <div class="glass-card rounded-[32px] overflow-hidden reveal-item custom-scroll" style="animation-delay: 0.8s">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-white/5 border-b border-white/5">
                            <th class="p-6 text-[10px] uppercase font-bold text-gray-500">Project</th>
                            <th class="p-6 text-[10px] uppercase font-bold text-gray-500">Payout</th>
                            <th class="p-6 text-[10px] uppercase font-bold text-gray-500">Date</th>
                            <th class="p-6 text-[10px] uppercase font-bold text-gray-500 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="history-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>

        <!-- 📜 BROADCAST ARCHIVE (NEWLY UPDATED) -->
        <h2 class="text-xl font-bold mt-16 mb-8 flex items-center gap-3 reveal-item" style="animation-delay: 0.9s">
            <span class="w-8 h-[1px] bg-purple-500/50"></span> System Broadcast Log
        </h2>
        <div class="glass-card p-8 rounded-[32px] reveal-item" style="animation-delay: 1s">
            <div id="broadcast-list" class="space-y-4 max-h-80 overflow-y-auto custom-scroll pr-4">
                <p class="text-gray-600 text-[10px] uppercase tracking-widest italic">Syncing News Records...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPBpzQfnilr2vm7kdRiNqOH89u7uxCjrk",
            authDomain: "adatacore-f.firebaseapp.com",
            projectId: "adatacore-f",
            storageBucket: "adatacore-f.firebasestorage.app",
            messagingSenderId: "806498602099",
            appId: "1:806498602099:web:426b145c9c0a0bd9c7ae06",
            measurementId: "G-740M8K5M0J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            const main = document.getElementById('main-content');
            sb.classList.toggle('collapsed');
            main.style.marginLeft = sb.classList.contains('collapsed') ? '80px' : '260px';
        }

        window.acknowledgeMsg = () => {
            const currentMsg = document.getElementById('announcement-text').innerText;
            localStorage.setItem('lastAckMsg', currentMsg);
            document.getElementById('announcement-banner').classList.add('hidden');
            document.getElementById('sidebar-alert').classList.remove('hidden');
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 📢 Live Announcement Listener
                onSnapshot(doc(db, "settings", "announcements"), (snap) => {
                    if (snap.exists()) {
                        const msg = snap.data().text;
                        document.getElementById('announcement-text').innerText = msg;
                        if (localStorage.getItem('lastAckMsg') === msg) {
                            document.getElementById('announcement-banner').classList.add('hidden');
                            document.getElementById('sidebar-alert').classList.remove('hidden');
                        } else {
                            document.getElementById('announcement-banner').classList.remove('hidden');
                            document.getElementById('sidebar-alert').classList.add('hidden');
                        }
                    }
                });

                // User Sync
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        const d = snap.data();
                        document.getElementById('user-display-name').innerText = d.fullName || "User";
                        document.getElementById('user-initials').innerText = (d.fullName || "U").charAt(0).toUpperCase();
                        document.getElementById('display-uid').innerText = "UID: " + (d.uniqueID || "N/A");
                        document.getElementById('stat-balance').innerText = (d.balance || 0).toFixed(2);
                        const h = new Date().getHours();
                        let g = h < 12 ? "Good Morning" : h < 17 ? "Good Afternoon" : "Good Evening";
                        document.getElementById('greeting').innerText = `${g}, ${d.fullName?.split(' ')[0]}`;

                        if (d.role === 'admin' || user.email === "as4556676@gmail.com") {
                            document.getElementById('admin-nav-container').innerHTML = `<a href="admin.html" class="flex items-center gap-4 px-4 py-3 text-sm font-bold text-yellow-500 hover:bg-yellow-500/10 rounded-xl mt-4">🛡️ <span class="nav-text text-white">Admin Space</span></a>`;
                        }
                        loadMyTasks(d.uniqueID);
                        loadHistory(user.uid); // Using user.uid to match submission structure
                        loadBroadcasts();
                        renderChart();
                    }
                });
            } else { window.location.replace("auth.html"); }
        });

        function loadMyTasks(uid) {
            const q = query(collection(db, "tasks"), where("assignedTo", "==", uid));
            onSnapshot(q, (snap) => {
                const c = document.getElementById('task-container');
                c.innerHTML = snap.empty ? `<div class="col-span-full py-10 text-center glass-card text-gray-500">No active assignments.</div>` : "";
                let delay = 0.6;
                snap.forEach(doc => {
                    const t = doc.data();
                    c.innerHTML += `<div class="glass-card p-8 rounded-[36px] reveal-item" style="animation-delay: ${delay}s"><div class="flex justify-between items-start mb-8"><div class="text-2xl">🧩</div><div class="text-right text-green-400 font-bold">$${(t.price || 0).toFixed(2)}</div></div><h4 class="font-bold text-xl mb-3">${t.title}</h4><a href="task_player.html" class="btn-haptic block w-full text-center py-4 bg-white text-black rounded-2xl text-xs font-bold uppercase tracking-widest">START PROJECT ➔</a></div>`;
                    delay += 0.1;
                });
            });
        }

        function loadHistory(uid) {
            // Updated to match 'workerUID' from submissions collection
            const q = query(collection(db, "submissions"), where("workerUID", "==", uid));
            onSnapshot(q, snap => {
                const b = document.getElementById('history-body');
                b.innerHTML = snap.empty ? `<tr><td colspan="4" class="p-10 text-center text-gray-500 uppercase text-[10px] tracking-widest">No transaction history.</td></tr>` : "";
                const sorted = snap.docs.sort((x,y) => y.data().timestamp - x.data().timestamp);
                sorted.forEach(doc => {
                    const s = doc.data();
                    const status = s.status || 'Pending';
                    const color = status === 'Approved' ? 'text-green-400 bg-green-500/10' : status === 'Rejected' ? 'text-red-400 bg-red-500/10' : 'text-yellow-400 bg-yellow-500/10';
                    b.innerHTML += `<tr class="hover:bg-white/[0.02] transition-colors"><td class="p-6 text-sm font-bold text-white">${s.projectTitle || 'Project'}</td><td class="p-6 text-sm text-white font-mono">$${(s.earnedAmount || 0).toFixed(4)}</td><td class="p-6 text-[10px] text-gray-500 uppercase">${s.timestamp?.toDate().toLocaleDateString() || 'Recent'}</td><td class="p-6 text-center"><span class="px-3 py-1 rounded-full text-[8px] font-black border border-white/5 ${color}">${status.toUpperCase()}</span></td></tr>`;
                });
            });
        }

        // --- 📜 SYNC PREVIOUS ANNOUNCEMENTS ---
        function loadBroadcasts() {
            // Assuming your admin panel saves history in 'announcements' collection
            const q = query(collection(db, "announcements"), orderBy("timestamp", "desc"));
            onSnapshot(q, snap => {
                const l = document.getElementById('broadcast-list');
                if(snap.empty) {
                    l.innerHTML = `<p class="text-gray-600 text-[10px] uppercase tracking-widest italic">Broadcast archive is empty.</p>`;
                    return;
                }
                l.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const dateStr = d.timestamp ? d.timestamp.toDate().toLocaleString() : 'Just now';
                    l.innerHTML += `
                        <div class="p-5 bg-white/5 rounded-2xl border border-white/5 hover:border-purple-500/20 transition-all group">
                            <div class="flex justify-between items-start mb-2">
                                <span class="bg-purple-600/20 text-purple-400 text-[8px] font-black px-2 py-0.5 rounded-full uppercase tracking-tighter">System Alert</span>
                                <span class="text-[9px] text-gray-600 font-mono">${dateStr}</span>
                            </div>
                            <p class="text-[13px] text-gray-200 leading-relaxed group-hover:text-white transition-colors">${d.text}</p>
                        </div>`;
                });
            });
        }

        function renderChart() {
            const ctx = document.getElementById('earningChart').getContext('2d');
            new Chart(ctx, { type: 'line', data: { labels: ['S', 'M', 'T', 'W', 'T', 'F', 'S'], datasets: [{ data: [12, 19, 15, 25, 22, 30, 28], borderColor: '#A78BFA', borderWidth: 2, pointRadius: 0, tension: 0.4, fill: true, backgroundColor: 'rgba(167, 139, 250, 0.05)' }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } } });
        }
        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
