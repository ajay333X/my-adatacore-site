<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Adatacore — Expert Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --accent: #A78BFA; --bg-dark: #0D0D1F; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; min-height: 100vh; overflow-x: hidden; }
        .grid-pattern { background-image: radial-gradient(rgba(167, 139, 250, 0.08) 1px, transparent 1px); background-size: 40px 40px; position: fixed; inset: 0; z-index: -1; }
        .glass { background: rgba(26, 26, 46, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.15); }
        .premium-input { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(167, 139, 250, 0.1); border-radius: 12px; padding: 10px 14px; color: white; outline: none; font-size: 13px; width: 100%; transition: 0.3s; }
        .premium-input:focus { border-color: #A78BFA; background: rgba(167, 139, 250, 0.05); }
        .text-gradient { background: linear-gradient(to bottom right, #FFFFFF 30%, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="grid-pattern">

    <div class="flex">
        <aside class="w-72 h-screen glass fixed left-0 top-0 p-6 flex flex-col border-r border-white/5 z-20">
            <div class="flex items-center gap-2.5 font-bold text-white text-lg mb-10">
                <svg viewBox="0 0 64 64" class="w-7 h-7"><rect x="4" y="4" width="56" height="56" rx="14" fill="#1A1A2E"></rect><path d="M32 18L42 46H38L36 40H28L26 46H22L32 18Z" fill="#A78BFA"></path></svg>
                Adatacore
            </div>

            <div class="bg-white/5 rounded-3xl p-5 border border-white/10 mb-8">
                <div class="w-12 h-12 rounded-full bg-purple-600 mb-3 flex items-center justify-center font-bold text-xl" id="avatar">U</div>
                <h4 class="font-bold text-sm" id="side-name">Loading...</h4>
                <p class="text-[10px] text-gray-500 font-mono mt-1" id="side-uid">ID: GEN-0000-0000-0000</p>
            </div>
            
            <nav class="flex-1 space-y-1">
                <div class="flex items-center gap-3 px-4 py-3 text-sm font-medium bg-purple-500/10 text-purple-300 rounded-xl">🏠 Dashboard</div>
                <div class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-400 hover:text-white transition-all cursor-pointer">📊 Active Tasks</div>
                <div class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-400 hover:text-white transition-all cursor-pointer">💰 Earnings</div>
            </nav>

            <button id="btn-logout" class="mt-auto flex items-center gap-3 px-4 py-3 text-sm font-medium text-red-400 hover:bg-red-500/10 rounded-xl transition-all">🚪 Logout</button>
        </aside>

        <main class="ml-72 p-10 w-full">
            <header class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-3xl font-bold text-gradient">Dashboard Overview</h1>
                    <p class="text-gray-500 text-sm">Welcome to your workstation.</p>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-8">
                    <div class="grid grid-cols-3 gap-4">
                        <div class="glass p-6 rounded-[2rem]">
                            <p class="text-gray-500 text-[10px] uppercase font-bold mb-1">Balance</p>
                            <h3 class="text-2xl font-bold text-purple-400">$<span id="bal">0.00</span></h3>
                        </div>
                        <div class="glass p-6 rounded-[2rem]">
                            <p class="text-gray-500 text-[10px] uppercase font-bold mb-1">Accuracy</p>
                            <h3 class="text-2xl font-bold text-green-400"><span id="acc">0</span>%</h3>
                        </div>
                        <div class="glass p-6 rounded-[2rem]">
                            <p class="text-gray-500 text-[10px] uppercase font-bold mb-1">Rank</p>
                            <h3 class="text-2xl font-bold">Expert</h3>
                        </div>
                    </div>
                    
                    <div class="glass p-8 rounded-[2.5rem] border border-white/5 h-64 flex flex-col items-center justify-center text-center">
                        <p class="text-gray-600">Tasks assigned by Adatacore will appear here.</p>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="glass p-8 rounded-[2.5rem] border border-purple-500/20">
                        <h3 class="text-lg font-bold mb-6 flex items-center gap-2">👤 Complete Profile</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block ml-1">Full Name</label>
                                <input type="text" id="p-name" class="premium-input" placeholder="Enter Full Name">
                            </div>
                            <div>
                                <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block ml-1">Phone Number</label>
                                <input type="tel" id="p-phone" class="premium-input" placeholder="+91 0000000000">
                            </div>
                            <div>
                                <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block ml-1">Qualification</label>
                                <select id="p-qual" class="premium-input bg-[#1A1A2E]">
                                    <option value="High School">High School</option>
                                    <option value="Graduate">Graduate</option>
                                    <option value="Post Graduate">Post Graduate</option>
                                    <option value="Specialist">Specialist</option>
                                </select>
                            </div>
                            <button id="btn-save-profile" class="w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-bold text-sm transition-all mt-4">Save Information</button>
                        </div>
                    </div>

                    <div class="glass p-6 rounded-[2rem] border border-white/5 text-center">
                        <p class="text-[10px] text-gray-500 uppercase font-bold mb-2">Your Unique ID</p>
                        <p class="text-sm font-mono text-purple-300" id="display-uid">---</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJqNsBMv6Z6mbPe8TeMW00lLRbFI1OGz4",
            authDomain: "adatacoresite.firebaseapp.com",
            projectId: "adatacoresite",
            storageBucket: "adatacoresite.firebasestorage.app",
            messagingSenderId: "108144458736",
            appId: "1:108144458736:web:1fd765735fe8eaebdcfb35",
            measurementId: "G-PTS16DVVYE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 16-Digit UID Generator
        function generate16DigitID() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let res = 'AD-';
            for(let i=0; i<12; i++) {
                if(i > 0 && i % 4 === 0) res += '-';
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDocRef = doc(db, "users", user.uid);
                
                onSnapshot(userDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        // Sidebar & Stats update
                        document.getElementById('side-name').innerText = data.fullName || "New Annotator";
                        document.getElementById('side-uid').innerText = "ID: " + (data.uniqueID || "Generating...");
                        document.getElementById('display-uid').innerText = data.uniqueID || "Generating...";
                        document.getElementById('avatar').innerText = (data.fullName || user.email).charAt(0).toUpperCase();
                        document.getElementById('bal').innerText = data.balance || "0.00";
                        document.getElementById('acc').innerText = data.accuracy || "0";

                        // Fill Form if data exists
                        if(!document.activeElement.classList.contains('premium-input')) {
                            document.getElementById('p-name').value = data.fullName || "";
                            document.getElementById('p-phone').value = data.phone || "";
                            document.getElementById('p-qual').value = data.qualification || "High School";
                        }
                    } else {
                        // Create initial record with 16-digit ID
                        const newID = generate16DigitID();
                        setDoc(userDocRef, { 
                            fullName: "", 
                            phone: "", 
                            qualification: "High School",
                            uniqueID: newID, 
                            balance: "0.00", 
                            accuracy: 100 
                        });
                    }
                });
            } else {
                window.location.href = "auth.html";
            }
        });

        // Save Information
        document.getElementById('btn-save-profile').onclick = async () => {
            const name = document.getElementById('p-name').value;
            const phone = document.getElementById('p-phone').value;
            const qual = document.getElementById('p-qual').value;
            
            if(name.length < 3 || phone.length < 10) return alert("Please enter valid details");

            try {
                const userDocRef = doc(db, "users", auth.currentUser.uid);
                await setDoc(userDocRef, {
                    fullName: name,
                    phone: phone,
                    qualification: qual
                }, { merge: true });
                alert("Profile Updated!");
            } catch (err) { alert(err.message); }
        };

        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
