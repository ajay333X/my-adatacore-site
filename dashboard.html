<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Signing in — Adatacore</title>
<link rel="icon" href="/favicon.png?v=20260831-3" type="image/png">
<link rel="stylesheet" href="/design-system.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,rgba(124,58,237,.12),transparent 34%),#090910}.handoff{width:min(430px,100%);text-align:center;padding:34px}.handoff .brand{justify-content:center;margin-bottom:28px}.spinner{width:34px;height:34px;border:3px solid rgba(167,139,250,.18);border-top-color:#a78bfa;border-radius:50%;margin:0 auto 20px;animation:spin .75s linear infinite}.handoff h1{font-size:23px;margin:0 0 9px}.handoff p{color:var(--muted);font-size:13px;line-height:1.65;margin:0}.handoff .error{color:#fb7185}.handoff a{display:inline-flex;margin-top:18px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<main class="card handoff" aria-live="polite">
  <a class="brand" href="/"><span class="brand-mark"></span>Adatacore</a>
  <div id="spinner" class="spinner" aria-hidden="true"></div>
  <h1 id="title">Completing secure sign-in</h1>
  <p id="message">Please wait while we connect your account to the Adatacore workspace.</p>
  <a id="retry" class="btn btn-secondary" href="/auth" hidden>Return to sign in</a>
</main>
<script>
const SB_URL='https://llmhyezgcnbognmmsnzq.supabase.co';
const SB_KEY='sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml';
const client=supabase.createClient(SB_URL,SB_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const hasOAuthCallback=/access_token=|refresh_token=|error=/.test(location.hash);
let routed=false,timer=null;
function fail(message){if(routed)return;document.getElementById('spinner').hidden=true;document.getElementById('title').textContent='Sign-in could not be completed';document.getElementById('message').textContent=message||'Please return to sign in and try again.';document.getElementById('message').className='error';document.getElementById('retry').hidden=false}
function enterWorkspace(session){if(routed||!session?.user)return false;routed=true;if(timer)clearTimeout(timer);history.replaceState(null,'','/dashboard');location.replace('/workspace');return true}
client.auth.onAuthStateChange((event,session)=>{
  if(['INITIAL_SESSION','SIGNED_IN','TOKEN_REFRESHED'].includes(event)&&session)queueMicrotask(()=>enterWorkspace(session));
});
(async()=>{
  const {data:{session},error}=await client.auth.getSession();
  if(error&&!hasOAuthCallback)return fail(error.message);
  if(enterWorkspace(session))return;
  if(!hasOAuthCallback){location.replace('/auth');return}
  timer=setTimeout(async()=>{
    const {data:{session:lateSession},error:lateError}=await client.auth.getSession();
    if(enterWorkspace(lateSession))return;
    fail(lateError?.message||'Google sign-in did not finish correctly. Please try again.');
  },2500);
})();
</script>
</body>
</html>
