<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Workstation — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --accent: #A78BFA; --bg-dark: #02020a; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: white; 
            min-height: 100vh; 
            overflow-x: hidden;
            /* बैकग्राउंड में हल्का ग्लो इफेक्ट */
            background-image: radial-gradient(circle at 0% 0%, rgba(167, 139, 250, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 100% 100%, rgba(79, 70, 229, 0.05) 0%, transparent 50%);
        }

        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card { 
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 24px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-5px); border-color: var(--accent); }

        #sidebar { transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); width: 260px; z-index: 100;}
        #sidebar.collapsed { width: 80px; }
        
        .nav-item { transition: all 0.2s ease; border-radius: 12px; margin-bottom: 4px; }
        .nav-item.active { background: rgba(167, 139, 250, 0.1); color: var(--accent); border: 1px solid rgba(167, 139, 250, 0.2); }
        .nav-item:hover:not(.active) { background: rgba(255, 255, 255, 0.05); }

        /* Announcement Banner Animation */
        #announcement-banner {
            position: fixed; top: 20px; left: 280px; right: 20px; z-index: 50;
            background: rgba(10, 10, 20, 0.8); backdrop-filter: blur(25px);
            border: 1px solid rgba(167, 139, 250, 0.2); border-radius: 16px;
            height: 50px; display: flex; align-items: center; overflow: hidden;
        }
        .collapsed-banner { left: 100px !important; }
        .marquee-content { animation: marquee 20s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .stat-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(167, 139, 250, 0.1); color: var(--accent); }
    </style>
</head>
<body class="flex">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="h-screen glass fixed left-0 top-0 flex flex-col border-r border-white/5">
        <div class="p-6 mb-8 flex items-center justify-between">
            <div class="flex items-center gap-3 font-bold text-white">
                <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center font-black shadow-lg shadow-purple-500/20">A</div>
                <span class="nav-text tracking-tight">ADATACORE</span>
            </div>
            <button onclick="toggleSidebar()" class="p-2 hover:bg-white/10 rounded-lg text-white transition-colors">✨</button>
        </div>
        
        <nav class="flex-1 px-4">
            <div class="nav-item active flex items-center gap-4 px-4 py-3 cursor-pointer">
                <span class="text-lg">📊</span> <span class="nav-text text-sm font-medium">Dashboard</span>
            </div>
            <div onclick="location.href='profile.html'" class="nav-item flex items-center gap-4 px-4 py-3 cursor-pointer text-gray-400">
                <span class="text-lg">👤</span> <span class="nav-text text-sm font-medium">Account</span>
            </div>
            <div id="admin-nav-container"></div>
        </nav>

        <div class="p-4 border-t border-white/5">
            <div id="btn-logout" class="flex items-center gap-4 px-4 py-3 text-red-400 hover:bg-red-500/10 rounded-xl cursor-pointer transition-all">
                <span>🚪</span> <span class="nav-text text-sm font-medium">Sign Out</span>
            </div>
        </div>
    </aside>

    <main id="main-content" class="ml-[260px] p-8 w-full transition-all duration-500">
        <!-- Banner -->
        <div id="announcement-banner" class="hidden">
            <div class="bg-purple-600 h-full flex items-center px-4 text-[10px] font-bold text-white mr-4">NEWS</div>
            <div class="flex-1 overflow-hidden relative"><p id="announcement-text" class="marquee-content whitespace-nowrap text-xs text-gray-300 uppercase tracking-widest">...</p></div>
            <button onclick="acknowledgeMsg()" class="px-4 text-[10px] font-bold text-purple-400 hover:text-white">✕</button>
        </div>

        <header class="flex justify-between items-center mb-10 mt-12">
            <div>
                <h1 id="greeting" class="text-3xl font-bold text-white">Welcome Back</h1>
                <p id="display-uid" class="text-[10px] font-mono text-gray-500 mt-1 tracking-widest">UID: ---</p>
            </div>
            <div class="flex items-center gap-3 glass px-4 py-2 rounded-2xl border-white/5">
                <div id="user-initials" class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center text-xs font-bold">U</div>
                <div class="text-left">
                    <p id="user-display-name" class="text-xs font-bold leading-none">User</p>
                    <p class="text-[9px] text-green-500 font-bold uppercase mt-1">Verified</p>
                </div>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <div class="glass-card p-6">
                <div class="flex justify-between items-start mb-4">
                    <div class="stat-icon">💰</div>
                    <span class="text-[10px] font-bold text-green-500">+12.5%</span>
                </div>
                <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider">Total Balance</p>
                <h3 class="text-3xl font-bold text-white mt-1">$<span id="stat-balance">0.00</span></h3>
            </div>
            <div class="lg:col-span-2 glass-card p-6 relative overflow-hidden">
                <p class="text-gray-500 text-[10px] uppercase font-bold mb-4">Earnings Overview</p>
                <div class="h-[100px]"><canvas id="earningChart"></canvas></div>
            </div>
            <div class="glass-card p-6">
                <div class="flex justify-between items-start mb-4">
                    <div class="stat-icon">🎯</div>
                    <span class="text-[10px] font-bold text-purple-400">Top Tier</span>
                </div>
                <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider">Quality Score</p>
                <h3 class="text-3xl font-bold text-purple-400 mt-1">98%</h3>
            </div>
        </div>

        <!-- Task Section -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold flex items-center gap-3">🧩 Assigned Projects</h2>
            <span class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Live Updates</span>
        </div>
        <div id="task-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 mb-12"></div>

        <!-- History -->
        <h2 class="text-xl font-bold mb-6 flex items-center gap-3">📜 Recent Activity</h2>
        <div class="glass-card overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-white/5"><tr class="text-[10px] text-gray-500 uppercase tracking-widest"><th class="p-5">Project</th><th class="p-5">Amount</th><th class="p-5 text-center">Status</th></tr></thead>
                <tbody id="history-body" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </main>

    <script>
        const SB_URL = "https://llmhyezgcnbognmmsnzq.supabase.co";
        const SB_KEY = "sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // Sidebar Toggle
        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            const main = document.getElementById('main-content');
            const banner = document.getElementById('announcement-banner');
            sb.classList.toggle('collapsed');
            const isCollapsed = sb.classList.contains('collapsed');
            main.style.marginLeft = isCollapsed ? '80px' : '260px';
            if(banner) banner.classList.toggle('collapsed-banner', isCollapsed);
        };

        // Init
        async function init() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) { window.location.replace("auth.html"); return; }

            const { data: d } = await _supabase.from('users').select('*').eq('id', user.id).single();
            if(d) {
                updateUI(d);
                loadMyTasks(d.uniqueID);
                loadHistory(d.uniqueID);
            }

            // Listen for balance updates
            _supabase.channel('user_updates').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'users', filter: `id=eq.${user.id}` }, (payload) => {
                updateUI(payload.new);
            }).subscribe();

            loadAnnouncement();
            renderChart();
        }

        function updateUI(d) {
            document.getElementById('user-display-name').innerText = d.fullName || "User";
            document.getElementById('user-initials').innerText = (d.fullName || "U").charAt(0).toUpperCase();
            document.getElementById('display-uid').innerText = "UID: " + (d.uniqueID || "N/A");
            document.getElementById('stat-balance').innerText = (d.balance || 0).toFixed(2);
            
            const h = new Date().getHours();
            let g = h < 12 ? "Good Morning" : h < 17 ? "Good Afternoon" : "Good Evening";
            document.getElementById('greeting').innerText = `${g}, ${d.fullName?.split(' ')[0] || ''}`;

            if (d.role === 'admin' || d.email === "as4556676@gmail.com") {
                const adminContainer = document.getElementById('admin-nav-container');
                adminContainer.innerHTML = `<div onclick="location.href='admin.html'" class="nav-item flex items-center gap-4 px-4 py-3 mt-4 text-yellow-500 font-bold cursor-pointer"><span>🛡️</span> <span class="nav-text text-sm">Master Control</span></div>`;
            }
        }

        async function loadMyTasks(uid) {
            const { data: tasks } = await _supabase.from('tasks').select('*').eq('assignedTo', uid);
            const c = document.getElementById('task-container');
            c.innerHTML = (!tasks || tasks.length === 0) ? `<div class="col-span-full py-20 text-center glass-card opacity-40 italic">Waiting for new assignments...</div>` : "";
            
            tasks?.forEach(t => {
                c.innerHTML += `
                    <div class="glass-card p-6 border-l-4 border-purple-600">
                        <div class="flex justify-between items-start mb-6">
                            <div class="bg-purple-600/20 p-3 rounded-2xl text-xl">📦</div>
                            <span class="text-green-400 font-bold tracking-tighter text-lg">$${(t.price || 0).toFixed(2)}</span>
                        </div>
                        <h4 class="font-bold text-lg mb-4 line-clamp-1">${t.title}</h4>
                        <button onclick="location.href='task_player.html'" class="w-full py-3 bg-white text-black rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-purple-600 hover:text-white transition-all">Start Project ➔</button>
                    </div>`;
            });
        }

        async function loadHistory(uid) {
            const { data: subs } = await _supabase.from('submissions').select('*').eq('workerUID', uid).order('id', { ascending: false }).limit(5);
            const b = document.getElementById('history-body');
            b.innerHTML = (!subs || subs.length === 0) ? `<tr><td colspan="3" class="p-10 text-center text-gray-500 italic">No recent transactions.</td></tr>` : "";
            
            subs?.forEach(s => {
                const status = s.status || 'Pending';
                const color = status === 'Approved' ? 'bg-green-500' : status === 'Rejected' ? 'bg-red-500' : 'bg-yellow-500';
                b.innerHTML += `
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="p-5 text-sm font-semibold">${s.projectTitle}</td>
                        <td class="p-5 text-sm font-mono text-gray-400">$${(s.earnedAmount || 0).toFixed(3)}</td>
                        <td class="p-5 text-center">
                            <span class="px-3 py-1 rounded-full text-[8px] font-black uppercase text-white ${color}">${status}</span>
                        </td>
                    </tr>`;
            });
        }

        async function loadAnnouncement() {
            const { data } = await _supabase.from('settings').select('announcement').eq('id', 1).single();
            if (data && data.announcement && data.announcement !== localStorage.getItem('lastAckMsg')) {
                document.getElementById('announcement-text').innerText = data.announcement;
                document.getElementById('announcement-banner').style.display = 'flex';
            }
        }

        window.acknowledgeMsg = () => {
            localStorage.setItem('lastAckMsg', document.getElementById('announcement-text').innerText);
            document.getElementById('announcement-banner').style.display = 'none';
        };

        function renderChart() {
            const ctx = document.getElementById('earningChart').getContext('2d');
            new Chart(ctx, { 
                type: 'line', 
                data: { labels: ['S', 'M', 'T', 'W', 'T', 'F', 'S'], datasets: [{ data: [5, 12, 8, 15, 10, 18, 14], borderColor: '#A78BFA', borderWidth: 3, pointRadius: 0, tension: 0.4, fill: true, backgroundColor: 'rgba(167, 139, 250, 0.05)' }] }, 
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } } 
            });
        }

        document.getElementById('btn-logout').onclick = async () => {
            await _supabase.auth.signOut();
            window.location.replace("auth.html");
        };

        init();
    </script>
</body>
</html>
