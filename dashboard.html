<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Adatacore Workspace</title>
<script>
(()=>{
  const callback=location.search||location.hash;
  if(callback){
    location.replace('/auth'+location.search+location.hash);
    return;
  }
  location.replace('/workspace');
})();
</script>
</head>
<body>
<noscript><a href="/workspace">Open Adatacore workspace</a></noscript>
</body>
</html>
