<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Workstation — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --accent: #A78BFA; --bg-dark: #0D0D1F; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; min-height: 100vh; overflow-x: hidden; }
        .grid-pattern { background-image: radial-gradient(rgba(167, 139, 250, 0.08) 1px, transparent 1px); background-size: 40px 40px; position: fixed; inset: 0; z-index: -1; }
        .glass { background: rgba(26, 26, 46, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.15); }
        .text-gradient { background: linear-gradient(to bottom right, #FFFFFF 30%, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .task-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(167, 139, 250, 0.1); border-radius: 24px; transition: all 0.3s ease; }
        .task-card:hover { transform: translateY(-5px); border-color: var(--accent); background: rgba(167, 139, 250, 0.05); }
    </style>
</head>
<body class="grid-pattern">

    <div class="flex">
        <aside class="w-72 h-screen glass fixed left-0 top-0 p-6 flex flex-col border-r border-white/5 z-20">
            <div class="flex items-center gap-2.5 font-bold text-white text-lg mb-10">
                <svg viewBox="0 0 64 64" class="w-7 h-7"><rect x="4" y="4" width="56" height="56" rx="14" fill="#1A1A2E"></rect><path d="M32 18L42 46H38L36 40H28L26 46H22L32 18Z" fill="#A78BFA"></path></svg>
                Adatacore
            </div>

            <div class="mb-8">
                <a href="profile.html" class="flex items-center gap-3 p-4 glass rounded-[24px] border border-white/5 hover:border-purple-500 transition-all group">
                    <div id="user-initials" class="w-10 h-10 bg-purple-600 rounded-full flex items-center justify-center font-bold text-white uppercase">U</div>
                    <div>
                        <p id="user-display-name" class="text-sm font-bold truncate">Loading...</p>
                        <p class="text-[9px] text-purple-400 font-bold uppercase tracking-widest">Manage Profile ➔</p>
                    </div>
                </a>
            </div>
            
            <nav class="flex-1 space-y-1">
                <div class="nav-item flex items-center gap-3 px-4 py-3 text-sm font-medium bg-white/5 text-white rounded-xl cursor-default">🏠 Dashboard</div>
            </nav>

            <button id="btn-logout" class="mt-auto flex items-center gap-3 px-4 py-3 text-sm font-medium text-red-400 hover:bg-red-500/10 rounded-xl transition-all">🚪 Logout</button>
        </aside>

        <main class="ml-72 p-10 w-full">
            <header class="flex justify-between items-start mb-10">
                <div>
                    <h1 class="text-3xl font-bold text-gradient">Workstation</h1>
                    <p id="display-uid" class="text-[11px] font-mono text-purple-400 mt-1 uppercase tracking-widest font-bold text-gradient">ID: AD-0000-0000-0000</p>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                <div class="glass p-7 rounded-[32px] border border-white/5">
                    <p class="text-gray-500 text-[10px] uppercase font-bold tracking-widest mb-1">Total Balance</p>
                    <h3 class="text-2xl font-bold text-purple-400">$<span id="stat-balance">0.00</span></h3>
                </div>
                <div class="glass p-7 rounded-[32px] border border-white/5">
                    <p class="text-gray-500 text-[10px] uppercase font-bold tracking-widest mb-1">Active Tasks</p>
                    <h3 class="text-2xl font-bold" id="active-count">0</h3>
                </div>

                <div class="glass p-7 rounded-[32px] border border-indigo-500/20 hover:border-indigo-500/50 transition-all cursor-pointer group" onclick="window.open('https://slack.com', '_blank')">
                    <div class="flex justify-between items-center mb-1">
                        <p class="text-indigo-400 text-[10px] uppercase font-bold tracking-widest">Slack Community</p>
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    </div>
                    <h3 class="text-xl font-bold">Join Now ➔</h3>
                    <p class="text-[9px] text-gray-500 mt-1 uppercase tracking-tighter">Support & Real-time Updates</p>
                </div>
            </div>

            <h2 class="text-xl font-bold mb-6">Assigned Projects</h2>
            <div id="task-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-full py-20 text-center glass rounded-[40px] border-dashed border-white/10">
                    <p class="text-gray-600">No projects assigned to your ID yet.</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPBpzQfnilr2vm7kdRiNqOH89u7uxCjrk",
            authDomain: "adatacore-f.firebaseapp.com",
            projectId: "adatacore-f",
            storageBucket: "adatacore-f.firebasestorage.app",
            messagingSenderId: "806498602099",
            appId: "1:806498602099:web:426b145c9c0a0bd9c7ae06",
            measurementId: "G-740M8K5M0J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();

                        // SECURITY CHECK: अगर एडमिन ने ब्लॉक किया है
                        if(data.accountStatus === 'blocked') {
                            alert("⚠️ Your account has been deactivated. Please contact Slack Support.");
                            signOut(auth);
                            window.location.href = "auth.html";
                            return;
                        }

                        const myID = data.uniqueID;
                        const fullName = data.fullName || "User";
                        document.getElementById('user-display-name').innerText = fullName;
                        document.getElementById('user-initials').innerText = fullName.charAt(0);
                        document.getElementById('display-uid').innerText = "ID: " + myID;
                        document.getElementById('stat-balance').innerText = (data.balance || 0).toFixed(2);

                        loadMyTasks(myID);
                    }
                });
            } else {
                window.location.href = "auth.html";
            }
        });

        function loadMyTasks(userUniqueID) {
            const taskQuery = query(collection(db, "tasks"), where("assignedTo", "==", userUniqueID));
            onSnapshot(taskQuery, (querySnapshot) => {
                const container = document.getElementById('task-container');
                document.getElementById('active-count').innerText = querySnapshot.size;
                
                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="col-span-full py-20 text-center glass rounded-[40px] border-dashed border-white/10"><p class="text-gray-600">No special projects assigned to ID: ${userUniqueID}</p></div>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const task = doc.data();
                    container.innerHTML += `
                        <div class="task-card p-8 animate-in fade-in slide-in-from-bottom-2 duration-500">
                            <div class="flex justify-between items-start mb-6">
                                <span class="bg-purple-500/20 text-purple-300 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest">${task.type || 'Project'}</span>
                                <p class="text-green-400 font-bold">$${(task.price || 0).toFixed(2)}</p>
                            </div>
                            <h4 class="text-lg font-bold mb-2">${task.title}</h4>
                            <p class="text-gray-500 text-xs mb-6 leading-relaxed">${task.description || 'No description provided.'}</p>
                            <a href="${task.targetPage || '#'}" class="w-full inline-block text-center py-3 bg-white/5 border border-white/10 rounded-xl text-xs font-bold hover:bg-purple-600 hover:border-purple-600 transition-all">START TASK ➔</a>
                        </div>
                    `;
                });
            });
        }

        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
