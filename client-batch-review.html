<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Review Collection — Adatacore</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/design-system.css">
<script defer src="/client-batch-review.js?v=3"></script>
<style>
.batch-page{max-width:1180px;margin:0 auto;padding:28px 22px 64px}.batch-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.batch-head h1{margin:4px 0 7px;font-size:28px}.brandline{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.brandline span{color:var(--brand)}.sub{font-size:12px;color:var(--muted);line-height:1.6;max-width:760px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.stat{padding:15px}.stat span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:6px}.task-list{display:grid;gap:12px}.task-card{padding:17px}.task-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.task-title{font-size:14px;font-weight:850;word-break:break-word}.task-meta{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}.task-stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.player-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:14px}.player-row audio{width:100%;min-width:0}.notice{font-size:11px;color:var(--muted);margin:12px 0}.notice.error{color:#c33}.empty{padding:44px;text-align:center;color:var(--muted)}@media(max-width:720px){.batch-page{padding:18px 12px 52px}.batch-head{flex-direction:column}.stats{grid-template-columns:1fr}.player-row{grid-template-columns:1fr}.player-row .btn{width:100%}}
</style>
</head>
<body>
<main class="batch-page">
  <header class="batch-head"><div><div class="brandline">ADATA<span>CORE</span> · Client Review Collection</div><h1 id="pageTitle">Loading review collection…</h1><div id="pageSub" class="sub">Multiple submitted transcription tasks in one secure link.</div></div><span class="pill pill-brand">Client review</span></header>
  <div id="notice" class="notice" role="status">Opening secure collection…</div>
  <section class="stats"><div class="card stat"><span>Tasks</span><strong id="taskCount">0</strong></div><div class="card stat"><span>Total audio</span><strong id="totalDuration">0:00</strong></div><div class="card stat"><span>Total words</span><strong id="totalWords">0</strong></div></section>
  <section id="taskList" class="task-list"><div class="card empty">Loading submitted tasks…</div></section>
</main>
</body>
</html>
