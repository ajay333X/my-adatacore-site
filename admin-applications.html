<head>

<style>
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.apps-shell{max-width:1440px;margin:auto;padding:26px 22px 72px}.apps-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.apps-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:900}.apps-mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,#8b5cf6,#c4b5fd 55%,#7dd3fc)}.apps-head{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin:26px 0 20px}.apps-head h1{font-size:34px;letter-spacing:-.05em;margin:5px 0}.apps-head p{margin:0;color:var(--muted);font-size:13px}.filters{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(3,minmax(140px,.7fr)) auto;gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);margin-bottom:16px}.filters input,.filters select{width:100%;min-height:40px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:10px;padding:0 11px;font:inherit;font-size:12px}.summary-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.summary-chip{padding:9px 12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;font-size:10px;color:var(--muted)}.summary-chip strong{color:var(--text);font-size:13px;margin-right:4px}.apps-layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(390px,.92fr);gap:16px;align-items:start}.queue{border:1px solid var(--line);background:var(--panel);border-radius:20px;overflow:hidden}.queue-head{display:grid;grid-template-columns:minmax(170px,1.4fr) minmax(130px,.8fr) minmax(120px,.7fr) 110px 110px;gap:12px;padding:11px 15px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:850}.app-row{display:grid;grid-template-columns:minmax(170px,1.4fr) minmax(130px,.8fr) minmax(120px,.7fr) 110px 110px;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;transition:.15s ease}.app-row:last-child{border-bottom:0}.app-row:hover,.app-row.active{background:var(--panel2)}.person strong{display:block;font-size:12px}.person span,.cell-meta{display:block;margin-top:4px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-label{font-size:11px;font-weight:750}.status-pill{display:inline-flex;width:max-content;padding:5px 8px;border-radius:999px;border:1px solid var(--line);font-size:8px;text-transform:uppercase;letter-spacing:.07em;font-weight:900}.status-pill.pending{color:#b7791f;background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.2)}.status-pill.under_review{color:#7551c6;background:rgba(124,58,237,.08);border-color:rgba(124,58,237,.18)}.status-pill.approved{color:#047857;background:rgba(5,150,105,.07);border-color:rgba(5,150,105,.15)}.status-pill.rejected,.status-pill.changes_requested{color:#be123c;background:rgba(225,29,72,.06);border-color:rgba(225,29,72,.14)}.detail{border:1px solid var(--line);background:var(--panel);border-radius:20px;position:sticky;top:18px;overflow:hidden}.detail-empty{padding:44px 28px;text-align:center;color:var(--muted);font-size:12px}.detail-body{display:none}.detail-body.show{display:block}.detail-top{padding:20px;border-bottom:1px solid var(--line)}.detail-top h2{margin:4px 0 5px;font-size:22px;letter-spacing:-.04em}.detail-top p{margin:0;color:var(--muted);font-size:11px}.detail-section{padding:17px 20px;border-bottom:1px solid var(--line)}.detail-section:last-child{border-bottom:0}.detail-section h3{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{padding:10px;border:1px solid var(--line);background:var(--panel2);border-radius:11px}.fact span{display:block;font-size:8px;text-transform:uppercase;color:var(--muted);letter-spacing:.07em;font-weight:800}.fact strong{display:block;margin-top:5px;font-size:11px;word-break:break-word}.sample{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:12px;line-height:1.65;white-space:pre-wrap}.detail audio{width:100%}.review-note{width:100%;min-height:86px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px;font:inherit;font-size:12px;resize:vertical}.decision-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn-mini{min-height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-size:10px;font-weight:850;cursor:pointer}.btn-mini.approve{background:rgba(5,150,105,.08);color:#047857;border-color:rgba(5,150,105,.18)}.btn-mini.reject{background:rgba(225,29,72,.06);color:#be123c;border-color:rgba(225,29,72,.15)}.btn-mini.changes{background:rgba(245,158,11,.08);color:#b7791f;border-color:rgba(245,158,11,.2)}.empty-row{padding:36px;text-align:center;color:var(--muted);font-size:12px}.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:#8b5cf6;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1050px){.apps-layout{grid-template-columns:1fr}.detail{position:static}.filters{grid-template-columns:1fr 1fr}.filters>*:first-child{grid-column:1/-1}.queue-head,.app-row{grid-template-columns:minmax(160px,1.2fr) 120px 110px}.queue-head>*:nth-child(4),.queue-head>*:nth-child(5),.app-row>*:nth-child(4),.app-row>*:nth-child(5){display:none}}@media(max-width:650px){.apps-shell{padding:18px 12px 55px}.apps-head{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}.filters>*:first-child{grid-column:auto}.queue-head,.app-row{grid-template-columns:1fr 105px}.queue-head>*:nth-child(3),.app-row>*:nth-child(3){display:none}.facts{grid-template-columns:1fr}.decision-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="apps-shell">
  <div class="apps-top"><a class="apps-brand" href="/admin"><span class="apps-mark"></span><span>Adatacore Admin</span></a><a class="btn btn-secondary" href="/admin" style="text-decoration:none">Back to Admin</a></div>
  <div class="apps-head"><div><div class="eyebrow">People · Applications</div><h1>Application Review</h1><p>Review language-specific Voice Acting and Transcription assessments before granting project access.</p></div><button class="btn btn-secondary" id="refreshApps" type="button">Refresh</button></div>
  <section class="filters">
    <input id="searchApps" placeholder="Search name, email or UID…">
    <select id="statusFilter"><option value="">All statuses</option><option value="pending">Pending</option><option value="under_review">Under review</option><option value="changes_requested">Changes requested</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="draft">Draft</option></select>
    <select id="trackFilter"><option value="">All tracks</option><option value="voice_acting">Voice Acting</option><option value="transcription">Transcription</option></select>
    <select id="languageFilter"><option value="">All languages</option></select>
    <button class="btn btn-primary" id="applyFilters" type="button">Apply</button>
  </section>
  <div class="summary-row" id="summaryRow"></div>
  <div class="apps-layout">
    <section class="queue">
      <div class="queue-head"><div>Applicant</div><div>Track</div><div>Language</div><div>Status</div><div>Submitted</div></div>
      <div id="applicationRows"><div class="empty-row"><span class="spinner"></span> Loading applications…</div></div>
    </section>
    <aside class="detail" id="detailPanel"><div class="detail-empty" id="detailEmpty">Select an application to review the profile and assessment.</div><div class="detail-body" id="detailBody"></div></aside>
  </div>
</main>
</body>
</html>
