<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace — Adatacore</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<style>html,body{margin:0;min-height:100%;background:#f6f7fa;color:#666;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;font-size:12px}</style>
</head>
<body><div class="boot">Loading secure workspace…</div>
<script>
(async()=>{
  try{
    const params=new URLSearchParams(location.search),impersonation=params.get('impersonation')||'';
    const validImpersonation=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(impersonation);
    if(impersonation&&!validImpersonation)throw new Error('Invalid contributor-view session');
    if(!validImpersonation){
      const guardDb=supabase.createClient('https://llmhyezgcnbognmmsnzq.supabase.co','sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml',{auth:{persistSession:true,autoRefreshToken:true}});
      const {data:{session}}=await guardDb.auth.getSession();
      if(!session)return location.replace('/auth');
      const {data:onboarding,error:onboardingError}=await guardDb.rpc('get_my_application_onboarding');
      if(!onboardingError&&onboarding?.must_onboard&&!onboarding?.onboarding_complete)return location.replace('/apply');
    }
    const response=await fetch('/workspace-core',{cache:'no-store'});
    if(!response.ok)throw new Error('Workspace returned '+response.status);
    let html=await response.text();
    if(validImpersonation){
      const original="db.rpc('get_contributor_workspace')";
      const replacement=`db.rpc('admin_get_impersonated_contributor_workspace',{p_session_id:'${impersonation}'})`;
      if(!html.includes(original))throw new Error('Contributor workspace compatibility check failed');
      html=html.replace(original,replacement);
    }
    const normalAddon='<scr'+'ipt src="/vendor/libphonenumber-max-1.13.12.js"></scr'+'ipt><scr'+'ipt src="/phone-fields.js?v=2"></scr'+'ipt><scr'+'ipt src="/workspace-account-controls.js?v=3"></scr'+'ipt><scr'+'ipt src="/workspace-profile-menu.js?v=3"></scr'+'ipt><scr'+'ipt src="/workspace-project-groups.js?v=2"></scr'+'ipt><scr'+'ipt src="/workspace-experience.js?v=3"></scr'+'ipt><scr'+'ipt src="/workspace-support-skills.js?v=3"></scr'+'ipt><scr'+'ipt src="/workspace-balance-ledger.js?v=2"></scr'+'ipt><scr'+'ipt src="/workspace-platform-highlights.js?v=3"></scr'+'ipt><scr'+'ipt src="/workspace-qualifications-guidelines.js?v=2"></scr'+'ipt><scr'+'ipt src="/workspace-operations-context.js?v=1"></scr'+'ipt><scr'+'ipt src="/workspace-security-activity.js?v=3"></scr'+'ipt><scr'+'ipt src="/workspace-application-banner.js?v=20260902-1"></scr'+'ipt><scr'+'ipt src="/workspace-overview-order.js?v=20260904-1"></scr'+'ipt><scr'+'ipt src="/workspace-greeting.js?v=20260904-1"></scr'+'ipt><scr'+'ipt src="/slack-events.js?v=20260904-1"></scr'+'ipt><scr'+'ipt src="/workspace-contributor-home.js?v=1"></scr'+'ipt><scr'+'ipt src="/client-error-monitor.js?v=1"></scr'+'ipt>';
    const impersonationAddon='<scr'+'ipt src="/workspace-impersonation.js?v=20260902-1"></scr'+'ipt><scr'+'ipt src="/client-error-monitor.js?v=1"></scr'+'ipt>';
    html=html.replace('</body>',(validImpersonation?impersonationAddon:normalAddon)+'</body>');
    document.open();document.write(html);document.close();
  }catch(error){document.body.innerHTML='<div class="boot">Unable to load workspace. '+String(error.message||error)+'</div>'}
})();
</script>
</body>
</html>
