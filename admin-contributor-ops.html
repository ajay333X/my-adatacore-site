<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Contributor Ops — Adatacore</title><link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/admin-theme.css?v=1"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script defer src="/admin-contributor-ops.js?v=1"></script><style>body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.ops{max-width:1280px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:5px 0;font-size:34px}.grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px;margin-top:22px}.cardx{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.kpi{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.kpi span{font-size:9px;color:var(--muted);text-transform:uppercase}.kpi strong{display:block;font-size:23px;margin-top:5px}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;box-sizing:border-box;border:1px solid var(--line2);border-radius:10px;padding:10px;background:var(--panel2);color:var(--text);font:inherit}.form textarea{min-height:120px;resize:vertical}.ticket{padding:13px 0;border-bottom:1px solid var(--line)}.ticket:last-child{border:0}.ticket-head{display:flex;justify-content:space-between;gap:12px}.ticket p{font-size:11px;color:var(--muted);line-height:1.6}.ticket-actions{display:grid;grid-template-columns:130px 130px 1fr auto;gap:8px}.ticket-actions input,.ticket-actions select{border:1px solid var(--line2);border-radius:9px;padding:8px;background:var(--panel2);color:var(--text)}@media(max-width:900px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.ticket-actions{grid-template-columns:1fr}}</style></head><body><main class="ops"><div class="top"><div><div class="eyebrow">Admin · Contributor operations</div><h1>Contributor Ops</h1><div class="page-sub">Announcements and contributor support without cluttering the main admin pages.</div></div><div><a class="btn btn-secondary" href="/admin/applications">Applications</a> <a class="btn btn-secondary" href="/admin">Admin home</a></div></div><div id="opsKpis" class="kpis"><div class="kpi"><span>Loading</span><strong>—</strong></div></div><div class="grid"><section class="cardx"><div class="eyebrow">Project communication</div><h2>Publish announcement</h2><form id="announcementForm" class="form"><select id="announcementProject" required><option value="">Select project…</option></select><input id="announcementTitle" maxlength="180" placeholder="Announcement title" required><textarea id="announcementBody" maxlength="5000" placeholder="Write the update contributors should see." required></textarea><select id="announcementSeverity"><option value="info">Info</option><option value="warning">Important</option><option value="critical">Critical</option></select><label style="font-size:11px"><input id="announcementAck" type="checkbox" style="width:auto"> Require acknowledgement</label><button class="btn btn-primary" type="submit">Publish announcement</button><div id="announcementStatus" class="page-sub"></div></form></section><section class="cardx"><div class="top" style="align-items:end"><div><div class="eyebrow">Contributor help</div><h2 style="margin:6px 0">Support queue</h2></div><select id="supportFilter"><option value="">All</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="waiting_user">Waiting on contributor</option><option value="resolved">Resolved</option></select></div><div id="supportQueue"><div class="page-sub">Loading tickets…</div></div></section></div></main></body></html>
