<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Profile Settings — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0D0D1F; color: white; }
        .glass { background: rgba(26, 26, 46, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.2); }
        .premium-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 12px; color: white; width: 100%; outline: none; transition: 0.3s; }
        .premium-input:focus { border-color: #A78BFA; background: rgba(167, 139, 250, 0.1); }
        /* SweetAlert Custom Style */
        .swal2-popup { background: #1A1A2E !important; border: 1px solid #A78BFA !important; border-radius: 24px !important; color: white !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="glass w-full max-w-2xl p-10 rounded-[2.5rem] relative overflow-hidden">
        <div class="absolute top-0 right-0 p-8">
            <a href="dashboard.html" class="text-gray-500 hover:text-white transition-all text-sm">✕ Close</a>
        </div>
        
        <h2 class="text-3xl font-bold mb-2">Complete Your Identity</h2>
        <p class="text-gray-500 text-sm mb-10">This information helps us assign relevant high-paying tasks to you.</p>

        <form id="profileForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] uppercase font-bold text-purple-400 mb-1 block">Full Name</label>
                    <input type="text" id="fullName" class="premium-input" placeholder="e.g. Rahul Sharma" required>
                </div>
                <div>
                    <label class="text-[10px] uppercase font-bold text-purple-400 mb-1 block">Phone Number</label>
                    <input type="tel" id="phone" class="premium-input" placeholder="+91 00000-00000" required>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-[10px] uppercase font-bold text-purple-400 mb-1 block">Base Qualification</label>
                    <select id="baseQual" class="premium-input bg-[#0D0D1F]" onchange="updateSpecialization()">
                        <option value="High School">High School</option>
                        <option value="Graduate">Graduate</option>
                        <option value="Post Graduate">Post Graduate</option>
                        <option value="Specialist">Specialist / Doctorate</option>
                    </select>
                </div>
                <div id="specSection" class="hidden">
                    <label class="text-[10px] uppercase font-bold text-purple-400 mb-1 block">Field of Study / Specialization</label>
                    <select id="specialization" class="premium-input bg-[#0D0D1F]">
                        </select>
                </div>
            </div>

            <div class="md:col-span-2 pt-6">
                <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 py-4 rounded-2xl font-bold hover:shadow-[0_0_30px_rgba(167,139,250,0.3)] transition-all">
                    Verify & Save Profile
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJqNsBMv6Z6mbPe8TeMW00lLRbFI1OGz4",
            authDomain: "adatacoresite.firebaseapp.com",
            projectId: "adatacoresite",
            storageBucket: "adatacoresite.firebasestorage.app",
            messagingSenderId: "108144458736",
            appId: "1:108144458736:web:1fd765735fe8eaebdcfb35"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Qualification List (Duniya bhar ki list)
        const fields = [
            "Computer Science", "Artificial Intelligence", "Medical Science", "Law", "Chartered Accountant", 
            "Linguistics", "Data Science", "Psychology", "Mathematics", "Mechanical Engineering", 
            "Biology", "Literature", "History", "Economics", "Graphic Design"
        ];

        window.updateSpecialization = () => {
            const base = document.getElementById('baseQual').value;
            const specSection = document.getElementById('specSection');
            const specSelect = document.getElementById('specialization');
            
            if(base !== "High School") {
                specSection.classList.remove('hidden');
                specSelect.innerHTML = fields.map(f => `<option value="${f}">${f}</option>`).join('');
            } else {
                specSection.classList.add('hidden');
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) window.location.href = "auth.html";
            else {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if(docSnap.exists()){
                    const data = docSnap.data();
                    document.getElementById('fullName').value = data.fullName || "";
                    document.getElementById('phone').value = data.phone || "";
                }
            }
        });

        document.getElementById('profileForm').onsubmit = async (e) => {
            e.preventDefault();
            
            try {
                await setDoc(doc(db, "users", auth.currentUser.uid), {
                    fullName: document.getElementById('fullName').value,
                    phone: document.getElementById('phone').value,
                    qualification: document.getElementById('baseQual').value,
                    specialization: document.getElementById('specialization').value || "N/A",
                }, { merge: true });

                Swal.fire({
                    icon: 'success',
                    title: 'Profile Verified',
                    text: 'Your details have been securely saved to Adatacore Cloud.',
                    confirmButtonText: 'Back to Dashboard',
                    confirmButtonColor: '#7C3AED'
                }).then(() => {
                    window.location.href = "dashboard.html";
                });

            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Oops...', text: err.message });
            }
        };
    </script>
</body>
</html>
