<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Account Settings — Adatacore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --accent: #A78BFA; --bg-dark: #0D0D1F; }
        
        html, body {
            height: auto;
            min-height: 100%;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .grid-pattern { 
            background-image: radial-gradient(rgba(167, 139, 250, 0.08) 1px, transparent 1px); 
            background-size: 40px 40px; 
            position: fixed; 
            inset: 0; 
            z-index: -1; 
            pointer-events: none;
        }

        .glass-card { 
            background: rgba(26, 26, 46, 0.6); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(167, 139, 250, 0.1); 
            border-radius: 24px; 
        }

        .input-field { 
            background: rgba(255, 255, 255, 0.03) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            border-radius: 12px; 
            padding: 12px; 
            color: white !important; 
            width: 100%; 
            outline: none; 
            transition: 0.3s; 
        }

        .input-field:focus { 
            border-color: var(--accent) !important; 
            background: rgba(167, 139, 250, 0.05) !important; 
        }

        .section-label { 
            font-size: 11px; font-weight: 700; color: #6B7280; 
            text-transform: uppercase; letter-spacing: 0.05em; 
            margin-bottom: 8px; display: block; 
        }

        .sticky-footer {
            position: sticky;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(13, 13, 31, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            z-index: 100;
        }

        .swal2-popup {
            background: #1A1A2E !important;
            border: 1px solid var(--accent) !important;
            border-radius: 24px !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="grid-pattern"></div>

    <div class="relative min-h-screen flex flex-col">
        <nav class="p-6 max-w-5xl w-full mx-auto flex justify-between items-center text-white">
            <a href="dashboard.html" class="flex items-center gap-2 font-bold text-lg">
                <svg viewBox="0 0 64 64" class="w-7 h-7"><rect x="4" y="4" width="56" height="56" rx="14" fill="#1A1A2E"></rect><path d="M32 18L42 46H38L36 40H28L26 46H22L32 18Z" fill="#A78BFA"></path></svg>
                Adatacore
            </a>
            <a href="dashboard.html" class="text-sm text-gray-400 hover:text-white transition-all">← Back to Dashboard</a>
        </nav>

        <main class="max-w-4xl w-full mx-auto p-6 flex-grow">
            <header class="mb-12">
                <h1 class="text-4xl font-bold mb-2 text-white">Account Settings</h1>
                <p id="displayUid" class="text-accent font-mono text-sm">UID: Loading...</p>
            </header>

            <div class="glass-card p-8 mb-8">
                <h3 class="text-xl font-bold mb-8 border-b border-white/5 pb-4">Personal Information</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <label class="section-label">Full Name</label>
                        <input type="text" id="fullName" class="input-field" placeholder="Full Name">
                    </div>
                    <div>
                        <label class="section-label">Email (Locked)</label>
                        <input type="email" id="email" class="input-field opacity-50 cursor-not-allowed" readonly>
                    </div>
                    <div>
                        <label class="section-label">Phone Number</label>
                        <input type="tel" id="phone" class="input-field" placeholder="+91 XXXXX-XXXXX">
                    </div>
                    <div>
                        <label class="section-label">Date of Birth</label>
                        <input type="date" id="dob" class="input-field">
                    </div>
                </div>
            </div>

            <div class="glass-card p-8 mb-8">
                <h3 class="text-xl font-bold mb-8 border-b border-white/5 pb-4">Work & Education</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <label class="section-label">Occupation</label>
                        <input type="text" id="occupation" class="input-field" placeholder="e.g. Student">
                    </div>
                    <div>
                        <label class="section-label">Education</label>
                        <select id="education" class="input-field bg-[#1A1A2E]">
                            <option value="High School">High School</option>
                            <option value="Bachelors">Bachelors Degree</option>
                            <option value="Masters">Masters Degree</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="glass-card p-8 border-red-500/20 mb-20">
                <h3 class="text-xl font-bold mb-8 text-red-500 border-b border-white/5 pb-4">Security</h3>
                <div class="flex justify-between items-center">
                    <p class="text-sm font-medium">Reset Password via Email</p>
                    <button id="resetBtn" class="px-5 py-2 bg-white/5 border border-white/10 rounded-xl text-xs font-bold hover:bg-white/10 transition-all text-white">Send Link</button>
                </div>
            </div>
        </main>

        <footer class="sticky-footer">
            <div class="max-w-4xl mx-auto flex justify-end gap-6 items-center">
                <button onclick="window.location.href='dashboard.html'" class="text-sm font-bold text-gray-500 hover:text-white transition-all">Cancel</button>
                <button id="saveBtn" class="bg-gradient-to-r from-purple-600 to-indigo-600 px-10 py-3 rounded-xl font-bold text-sm shadow-xl hover:scale-105 transition-all text-white">Save Changes</button>
            </div>
        </footer>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://llmhyezgcnbognmmsnzq.supabase.co'; 
        const supabaseKey = 'sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml';
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();

            if (!user) {
                window.location.replace("auth.html");
                return;
            }

            document.getElementById('email').value = user.email;

            // ✅ डेटाबेस से डेटा खींचना
            let { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('id', user.id)
                .single();

            if (data) {
                document.getElementById('fullName').value = data.fullName || "";
                document.getElementById('phone').value = data.phone || "";
                document.getElementById('dob').value = data["Date of Birth"] || ""; 
                document.getElementById('occupation').value = data.occupation || "";
                document.getElementById('education').value = data.education || "Bachelors";

                // ✅ Auto UID Generation Logic
                if (!data.uniqueID || data.uniqueID === "NULL") {
                    const newUID = "AD-" + Math.floor(1000 + Math.random() * 9000);
                    // डेटाबेस में अपडेट करें
                    await supabase.from('users').update({ uniqueID: newUID }).eq('id', user.id);
                    document.getElementById('displayUid').innerText = "UID: " + newUID;
                } else {
                    document.getElementById('displayUid').innerText = "UID: " + data.uniqueID;
                }
            }
        }

        // ✅ डेटा अपडेट करना
        document.getElementById('saveBtn').onclick = async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;

            const updateData = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                "Date of Birth": document.getElementById('dob').value,
                occupation: document.getElementById('occupation').value,
                education: document.getElementById('education').value
            };

            const { error } = await supabase
                .from('users')
                .update(updateData)
                .eq('id', user.id);

            if (!error) {
                Swal.fire({ 
                    icon: 'success', title: 'Saved!', text: 'Profile updated.', 
                    background: '#1A1A2E', color: '#fff', confirmButtonColor: '#A78BFA' 
                });
            } else {
                Swal.fire({ icon: 'error', title: 'Error', text: error.message });
            }
        };

        // ✅ पासवर्ड रिसेट
        document.getElementById('resetBtn').onclick = async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                const { error } = await supabase.auth.resetPasswordForEmail(user.email, {
                    redirectTo: window.location.origin + '/auth.html',
                });
                
                if (!error) {
                    Swal.fire({ icon: 'success', title: 'Email Sent!', text: 'Check your inbox.', background: '#1A1A2E', color: '#fff' });
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: error.message });
                }
            }
        };

        init();
    </script>
</body>
</html>
