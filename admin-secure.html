<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Adatacore</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>:root{--bg:#05050b;--p:#11111c;--l:#25253a;--t:#f7f7fb;--m:#9090a7;--a:#a78bfa;--g:#34d399;--r:#fb7185}*{box-sizing:border-box}body{margin:0;background:#05050b;color:var(--t);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.tabs button,.btn{border:1px solid var(--l);background:#151523;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.tabs button.active,.btn.primary{background:#6d5ce7;border-color:#6d5ce7}.btn.danger{background:#37131c;color:#ff9aaa}.panel{display:none}.panel.active{display:block}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--l);background:#0b0b13;color:#fff;margin:6px 0 12px}label{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.1em}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}.muted{color:var(--m)}.badge{font-size:10px;color:var(--a);text-transform:uppercase}.list{max-height:520px;overflow:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>Adatacore Admin</h1><div class="muted">Protected by database role checks and RLS</div></div><div><a class="btn" href="/dashboard">Dashboard</a> <button class="btn danger" id="logout">Logout</button></div></div><div class="tabs" id="tabs"><button data-tab="projects" class="active">Projects</button><button data-tab="tasks">Assign Tasks</button><button data-tab="submissions">Final Audit & Payout</button><button data-tab="voice">Voice Vault</button><button data-tab="leads">Leads</button><button data-tab="social">Social Queue</button></div><section id="projects" class="panel active"><div class="grid"><div class="card"><h3>Create project</h3><label>Name</label><input id="pn"><div class="grid"><div><label>L1 rate</label><input type="number" step="0.01" id="p1"></div><div><label>L2 rate</label><input type="number" step="0.01" id="p2"></div></div><label>Accent</label><input type="color" id="pc" value="#A78BFA"><label>Configuration notes</label><textarea id="pl"></textarea><button class="btn primary" onclick="createProject()">Create</button></div><div class="card"><h3>Project registry</h3><div id="projectList" class="list"></div></div></div></section><section id="tasks" class="panel"><div class="card"><h3>Assign task</h3><div class="grid"><div><label>User email or UID</label><input id="target"></div><div><label>Project</label><select id="projectSelect"></select></div><div><label>Layer</label><select id="layer"><option>L1</option><option>L2</option></select></div></div><button class="btn primary" onclick="assignTask()">Assign</button></div></section><section id="submissions" class="panel"><div class="card"><h3>Submissions awaiting final decision</h3><div id="submissionList"></div></div></section><section id="voice" class="panel"><div class="grid"><div class="card"><h3>Waiting queue</h3><div id="queueList"></div></div><div class="card"><h3>Completed sessions</h3><div id="sessionList"></div></div></div></section><section id="leads" class="panel"><div class="grid"><div class="card"><h3>Company inquiries</h3><div id="inquiryList"></div></div><div class="card"><h3>Annotator applications</h3><div id="applicationList"></div></div></div></section><section id="social" class="panel"><div class="grid"><div class="card"><h3>Add social item</h3><label>URL</label><input id="su"><label>Caption</label><textarea id="sc"></textarea><label>Platform</label><select id="sp"><option>Instagram</option><option>YouTube</option><option>Both</option></select><button class="btn primary" onclick="addSocial()">Queue</button></div><div class="card"><h3>Queue</h3><div id="socialList"></div></div></div></section></div><script>const U='https://llmhyezgcnbognmmsnzq.supabase.co',K='sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml',db=supabase.createClient(U,K);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let projects=[];document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');refresh()});async function guard(){const {data:{user}}=await db.auth.getUser();if(!user)return location.replace('/auth');const {data:p}=await db.from('users').select('role').eq('id',user.id).single();if(p?.role!=='admin'){alert('Admin access required');return location.replace('/dashboard')}await refresh()}async function refresh(){await Promise.all([loadProjects(),loadSubs(),loadVoice(),loadLeads(),loadSocial()])}async function loadProjects(){const {data}=await db.from('project_lab').select('*').order('created_at',{ascending:false});projects=data||[];projectList.innerHTML=projects.length?projects.map(p=>`<div class=row><div><b>${esc(p.project_name)}</b><div class=muted>L1 $${Number(p.l1_rate||0).toFixed(2)} · L2 $${Number(p.l2_rate||0).toFixed(2)}</div></div><button class='btn danger' onclick='deleteProject(${p.id},${JSON.stringify(p.project_name)})'>Delete</button></div>`).join(''):'<div class=muted>No projects</div>';projectSelect.innerHTML=projects.map(p=>`<option value="${esc(p.project_name)}">${esc(p.project_name)}</option>`).join('')}async function createProject(){const name=pn.value.trim();if(!name)return;const {error}=await db.from('project_lab').insert({project_name:name,config:{accent:pc.value,logic:pl.value},l1_rate:Number(p1.value||0),l2_rate:Number(p2.value||0),is_published:true});if(error)alert(error.message);else{pn.value='';pl.value='';loadProjects()}}async function deleteProject(id,name){if(!confirm('Delete '+name+' and its tasks?'))return;await db.from('tasks').delete().eq('title',name);const {error}=await db.from('project_lab').delete().eq('id',id);if(error)alert(error.message);else loadProjects()}async function assignTask(){const p=projects.find(x=>x.project_name===projectSelect.value);if(!p||!target.value.trim())return;const price=layer.value==='L1'?p.l1_rate:p.l2_rate;const {error}=await db.from('tasks').insert({assignedTo:target.value.trim(),title:p.project_name,price,layer:layer.value,status:'pending'});if(error)alert(error.message);else{target.value='';alert('Assigned')}}async function loadSubs(){const {data}=await db.from('submissions').select('*').order('timestamp',{ascending:false});const rows=(data||[]).filter(x=>['Pending','Reviewed'].includes(x.status||'Pending'));submissionList.innerHTML=rows.length?rows.map(s=>`<div class=row><div><b>${esc(s.projectTitle)}</b><div class=muted>${esc(s.workerUID)} · $${Number(s.earnedAmount||0).toFixed(2)} · ${esc(s.status||'Pending')}</div></div><div><button class='btn primary' onclick='decide(${s.id},"Approved")'>Approve & Pay</button> <button class='btn danger' onclick='decide(${s.id},"Rejected")'>Reject</button></div></div>`).join(''):'<div class=muted>No submissions awaiting final audit</div>'}async function decide(id,status){const {error}=await db.rpc('admin_set_submission_status',{p_submission_id:id,p_status:status});if(error)alert(error.message);else loadSubs()}async function loadVoice(){const [{data:q},{data:s}]=await Promise.all([db.from('voice_queue').select('*').eq('status','waiting').order('created_at',{ascending:false}),db.from('voice_sessions').select('*').eq('status','completed').order('created_at',{ascending:false})]);queueList.innerHTML=(q||[]).map(x=>`<div class=row><div>${esc(x.user_email)}<div class=muted>${esc(x.project_title)}</div></div></div>`).join('')||'<div class=muted>Queue empty</div>';sessionList.innerHTML=(s||[]).map(x=>`<div class=row><div><b>${esc(x.project_title)}</b><div class=muted>${esc(x.host_email)} + ${esc(x.guest_email)} · ${Number(x.duration_seconds||0)}s</div></div><button class=btn onclick='playRecording(${JSON.stringify(x.recording_url||'')})'>Open</button></div>`).join('')||'<div class=muted>No completed sessions</div>'}async function playRecording(path){if(!path)return alert('No recording');if(path.startsWith('http'))return open(path,'_blank');const {data,error}=await db.storage.from('conversation_records').createSignedUrl(path,900);if(error)alert(error.message);else open(data.signedUrl,'_blank')}async function loadLeads(){const [{data:i},{data:a}]=await Promise.all([db.from('company_inquiries').select('*').order('created_at',{ascending:false}),db.from('annotator_applications').select('*').order('created_at',{ascending:false})]);inquiryList.innerHTML=(i||[]).map(x=>`<div class=row><div><b>${esc(x.full_name)}</b> — ${esc(x.company_name)}<div class=muted>${esc(x.email)} · ${esc(x.budget_range)}<br>${esc(x.project_details)}</div></div></div>`).join('')||'<div class=muted>No inquiries</div>';applicationList.innerHTML=(a||[]).map(x=>`<div class=row><div><b>${esc(x.full_name)}</b><div class=muted>${esc(x.email)} · ${esc(x.birth_place)} · ${esc(x.education_level)}</div></div></div>`).join('')||'<div class=muted>No applications</div>'}async function addSocial(){const {error}=await db.from('social_sync').insert({url:su.value.trim(),caption:sc.value.trim(),platform:sp.value,status:'queued'});if(error)alert(error.message);else{su.value='';sc.value='';loadSocial()}}async function loadSocial(){const {data}=await db.from('social_sync').select('*').order('created_at',{ascending:false});socialList.innerHTML=(data||[]).map(x=>`<div class=row><div><b>${esc(x.platform)}</b><div class=muted>${esc(x.url)}</div></div><button class='btn danger' onclick='removeSocial(${x.id})'>Remove</button></div>`).join('')||'<div class=muted>No queued items</div>'}async function removeSocial(id){await db.from('social_sync').delete().eq('id',id);loadSocial()}logout.onclick=async()=>{await db.auth.signOut();location.replace('/auth')};guard();</script></body></html>
