<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Client Portal — Adatacore</title>
<link rel="icon" href="/favicon.png?v=20260831-3" type="image/png"><link rel="stylesheet" href="/design-system.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.portal-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px max(18px,4vw);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(16px)}.portal-actions{margin-left:auto;display:flex;gap:8px}.portal-main{max-width:1180px;margin:auto;padding:38px 22px 70px}.portal-hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:26px}.portal-hero h1{font-size:34px;margin:7px 0 8px;letter-spacing:-.04em}.org-list,.project-list,.delivery-list{display:grid;gap:12px}.org-card{padding:20px}.org-head,.project-head,.delivery-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.project-list{margin-top:16px}.project-card{padding:17px;background:var(--panel2);border:1px solid var(--line);border-radius:13px}.project-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.metric{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.metric span{display:block;font-size:8px;text-transform:uppercase;color:var(--muted)}.metric strong{display:block;font-size:18px;margin-top:5px}.delivery-list{margin-top:12px}.delivery-card{padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.delivery-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.portal-note{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--brand-soft);font-size:10px;line-height:1.6}.empty-state{padding:48px 24px;text-align:center}.empty-state h2{margin:0 0 8px}.loading{min-height:55vh;display:grid;place-items:center;color:var(--muted)}@media(max-width:850px){.project-grid{grid-template-columns:1fr 1fr}.portal-hero{display:block}.portal-actions{flex-wrap:wrap}}@media(max-width:520px){.project-grid{grid-template-columns:1fr}.portal-main{padding:25px 14px}.portal-top{padding:12px}.portal-actions .hide-small{display:none}}
</style></head>
<body><header class="portal-top"><a class="brand" href="/"><span class="brand-mark"></span><span>Adatacore</span></a><span class="pill pill-brand">Client Portal</span><div class="portal-actions"><a class="btn btn-secondary hide-small" href="/workspace">Workspace</a><button id="signOut" class="btn btn-secondary">Sign out</button></div></header><main class="portal-main"><div class="portal-hero"><div><div class="eyebrow">Secure client workspace</div><h1>Projects & review deliveries</h1><p class="page-sub">See linked projects, delivery progress and client-review decisions without entering the Admin console.</p></div><button id="refreshPortal" class="btn btn-primary">Refresh</button></div><div id="portalBody" class="loading">Loading client access…</div></main><script src="/client-portal.js?v=1"></script></body></html>
