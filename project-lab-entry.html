<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Project Lab — Adatacore</title>
<style>html,body{margin:0;min-height:100%;background:#f6f7fa;color:#666;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;font-size:12px}</style>
</head>
<body><div class="boot">Loading Project Lab…</div>
<script>
(async()=>{
  try{
    const response=await fetch('/project-lab',{cache:'no-store'});
    if(!response.ok)throw new Error('Project Lab returned '+response.status);
    let html=await response.text();
    html=html.replace('</head>','<link rel="stylesheet" href="/platform-theme.css?v=1"></head>');
    const addon='<scr'+'ipt src="/project-lab-addon-loader.js?v=20260904-1"></scr'+'ipt><scr'+'ipt src="/platform-theme.js?v=1"></scr'+'ipt>';
    html=html.replace('</body>',addon+'</body>');
    document.open();document.write(html);document.close();
  }catch(error){document.body.innerHTML='<div class="boot">Unable to load Project Lab. '+String(error.message||error)+'</div>'}
})();
</script>
</body>
</html>
