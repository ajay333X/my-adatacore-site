<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Adatacore — AI Data Annotation & Labeling Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --accent: #A78BFA;
            --bg-dark: #0D0D1F;
            --card-bg: rgba(26, 26, 46, 0.6);
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: var(--bg-dark); 
            color: white;
            overflow-x: hidden;
        }

        .grid-pattern {
            background-image: radial-gradient(rgba(167, 139, 250, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glass {
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(167, 139, 250, 0.15);
        }

        .text-gradient {
            background: linear-gradient(to bottom right, #FFFFFF 30%, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .accent-gradient {
            background: linear-gradient(135deg, #7C3AED, #A78BFA);
        }

        .card-glow {
            background: var(--card-bg);
            border: 1px solid rgba(167, 139, 250, 0.1);
            transition: all 0.3s ease;
        }

        .card-glow:hover {
            border-color: rgba(167, 139, 250, 0.4);
            box-shadow: 0 0 25px rgba(167, 139, 250, 0.1);
            transform: translateY(-2px);
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 40s linear infinite;
        }

        .hero-glow {
            position: absolute;
            top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; height: 800px;
            background: radial-gradient(circle at 50% 20%, rgba(167, 139, 250, 0.12), transparent 70%);
            pointer-events: none;
        }

        .btn-shine {
            position: relative;
            overflow: hidden;
        }

        .btn-shine::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .btn-shine:hover::after { left: 120%; }

        /* Custom scrollbar for the form */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.2); border-radius: 10px; }

        input, textarea, select {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(167, 139, 250, 0.1) !important;
        }
        
        select option { background: #1A1A2E; color: white; }
    </style>
</head>
<body class="grid-pattern">

    <header class="fixed top-0 inset-x-0 z-50">
        <nav class="glass max-w-5xl mx-auto mt-4 mx-4 sm:mx-auto rounded-full px-6 py-3 flex items-center justify-between">
            <a href="#" class="flex items-center gap-2.5 font-bold text-white text-lg tracking-tight">
                <svg viewBox="0 0 64 64" class="w-7 h-7"><rect x="4" y="4" width="56" height="56" rx="14" fill="#1A1A2E"></rect><path d="M32 18L42 46H38L36 40H28L26 46H22L32 18Z" fill="#A78BFA"></path></svg>
                Adatacore
            </a>
            <div class="hidden md:flex items-center gap-7 text-[13px] text-gray-400 font-medium">
                <a href="#companies" class="hover:text-white transition-colors">For Companies</a>
                <a href="#annotators" class="hover:text-white transition-colors">For Annotators</a>
                <a href="#tasks" class="hover:text-white transition-colors">Task Types</a>
            </div>
            <div class="flex items-center gap-4">
                <a href="#" class="hidden md:block text-[13px] text-gray-400">Sign in</a>
                <button onclick="openModal()" class="accent-gradient btn-shine text-white text-[13px] font-medium px-5 py-2 rounded-full">Get Started</button>
            </div>
        </nav>
    </header>

    <section class="relative pt-44 pb-20 px-6 overflow-hidden">
        <div class="hero-glow"></div>
        <div class="max-w-4xl mx-auto text-center relative z-10">
            <h1 class="text-5xl sm:text-7xl lg:text-[82px] font-bold tracking-tight leading-[0.95] text-gradient">
                Fuel Your AI With<br/>Perfect Training Data
            </h1>
            <p class="mt-8 text-lg text-gray-400 max-w-xl mx-auto">Enterprise-grade annotation powered by expert human annotators.</p>
            <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
                <button onclick="openModal()" class="accent-gradient btn-shine text-white font-medium px-8 py-3.5 rounded-full text-sm w-full sm:w-auto">Get Data Labeled →</button>
                <a href="#annotators" class="group text-gray-400 hover:text-white text-sm px-8 py-3.5 rounded-full border border-gray-800 transition-all flex items-center gap-2">Earn as Annotator</a>
            </div>
        </div>
    </section>

    <div id="contactModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="glass max-w-2xl w-full max-h-[90vh] rounded-[40px] p-8 sm:p-12 relative overflow-y-auto custom-scroll border border-purple-500/30">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-gray-500 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="mb-10">
                <h2 class="text-3xl font-bold text-gradient mb-3">Project Inquiry Form</h2>
                <p class="text-gray-400 text-sm">Please provide your details and we'll connect with you shortly.</p>
            </div>

            <form id="fullInquiryForm" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2 ml-1 font-bold">Your Name</label>
                        <input type="text" required class="w-full rounded-2xl px-5 py-4 text-sm focus:border-purple-500 outline-none transition-all text-white" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2 ml-1 font-bold">Company Name</label>
                        <input type="text" required class="w-full rounded-2xl px-5 py-4 text-sm focus:border-purple-500 outline-none transition-all text-white" placeholder="AI Global Corp">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2 ml-1 font-bold">Email Address</label>
                        <input type="email" required class="w-full rounded-2xl px-5 py-4 text-sm focus:border-purple-500 outline-none transition-all text-white" placeholder="john@company.com">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2 ml-1 font-bold">Estimated Budget</label>
                        <select required class="w-full rounded-2xl px-5 py-4 text-sm focus:border-purple-500 outline-none transition-all text-white appearance-none">
                            <option value="" disabled selected>Select Budget Range</option>
                            <option value="under-1k">Under $1,000</option>
                            <option value="1k-5k">$1,000 - $5,000</option>
                            <option value="5k-20k">$5,000 - $20,000</option>
                            <option value="20k-plus">$20,000+</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2 ml-1 font-bold">Any special things you want from us?</label>
                    <textarea rows="3" class="w-full rounded-2xl px-5 py-4 text-sm focus:border-purple-500 outline-none transition-all resize-none text-white" placeholder="E.g. Specific domain expertise, fast turnaround, NDA required..."></textarea>
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2 ml-1 font-bold">Tell us about your project idea</label>
                    <textarea required rows="4" class="w-full rounded-2xl px-5 py-4 text-sm focus:border-purple-500 outline-none transition-all resize-none text-white" placeholder="Describe the labeling tasks, data volume, and timeline..."></textarea>
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2 ml-1 font-bold">Your Preferred Way to Connect</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <select id="connectMethod" class="w-full rounded-2xl px-5 py-4 text-sm focus:border-purple-500 outline-none transition-all text-white appearance-none">
                            <option value="email">Email</option>
                            <option value="whatsapp">WhatsApp</option>
                            <option value="telegram">Telegram</option>
                            <option value="linkedin">LinkedIn</option>
                            <option value="facebook">Facebook Messenger</option>
                            <option value="zoom">Zoom / Google Meet</option>
                        </select>
                        <input type="text" id="methodDetail" class="w-full rounded-2xl px-5 py-4 text-sm focus:border-purple-500 outline-none transition-all text-white" placeholder="Username / Phone Number">
                    </div>
                </div>

                <button type="submit" class="accent-gradient w-full py-5 rounded-2xl font-bold text-sm btn-shine mt-4 shadow-xl shadow-purple-500/20">
                    Send Comprehensive Request
                </button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('contactModal');
        function openModal() { modal.style.display = 'flex'; document.body.style.overflow = 'hidden'; }
        function closeModal() { modal.style.display = 'none'; document.body.style.overflow = 'auto'; }
        
        window.onclick = function(event) { if (event.target == modal) closeModal(); }
        
        document.getElementById('fullInquiryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Your detailed inquiry has been received. Our team will reach out via your preferred method!');
            closeModal();
        });
    </script>

</body>
</html>
