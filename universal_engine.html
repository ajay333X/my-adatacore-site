<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Adatacore — Universal Engine v3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style id="dynamic-styles">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050510; color: white; min-height: 100vh; transition: 0.5s; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .engine-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    </style>
</head>
<body>

    <!-- Main Engine UI -->
    <div id="main-engine-ui" class="engine-container">
        <header class="flex justify-between items-center mb-10">
            <button onclick="location.href='dashboard.html'" class="text-[10px] font-black text-gray-500 uppercase tracking-widest hover:text-white transition-all">← Abort Task</button>
            <div class="text-right">
                <h2 id="engine-project-name" class="text-2xl font-black uppercase tracking-tighter text-white">Project Engine</h2>
                <p id="engine-status" class="text-[9px] font-bold uppercase tracking-[0.3em] flex items-center justify-end">
                    <span class="status-dot bg-yellow-500 animate-pulse"></span> Syncing Instance...
                </p>
            </div>
        </header>

        <div id="engine-workspace" class="glass p-10 rounded-[48px] border border-white/5 relative overflow-hidden">
            <div id="boot-loader" class="py-20 text-center italic opacity-30 animate-pulse text-sm uppercase font-bold">Initializing Components...</div>
        </div>

        <div id="custom-html-point" class="mt-6"></div>

        <div id="engine-submit-control" class="hidden mt-12">
            <button id="final-submit-btn" class="w-full py-6 rounded-3xl font-black text-xs uppercase tracking-[0.4em] transition-all transform active:scale-95 shadow-2xl">Push Final Submission</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://llmhyezgcnbognmmsnzq.supabase.co";
        const SB_KEY = "sb_publishable_QfaSTpmmj6reyY-kCsmhng_7PKvCGml";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        window._supabase = _supabase;
        window.Swal = Swal;

        const urlParams = new URLSearchParams(window.location.search);
        const projectKey = urlParams.get('project');
        window.currentUserData = null; 

        async function bootEngine() {
            try {
                const { data: { user } } = await _supabase.auth.getUser();
                if (!user) throw new Error("Auth failed");

                const { data: profile } = await _supabase.from('users').select('*').eq('id', user.id).single();
                window.currentUserData = profile;

                if (!projectKey) {
                    Swal.fire('Error', 'Invalid Engine Route', 'error').then(() => location.href='dashboard.html');
                    return;
                }

                const { data: blueprint, error } = await _supabase
                    .from('project_lab')
                    .select('*')
                    .eq('project_name', projectKey)
                    .single();

                if (error || !blueprint) {
                    Swal.fire('Offline', 'Instance no longer available.', 'warning');
                    return;
                }

                assembleProject(blueprint);
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Could not initialize session.', 'error');
            }
        }

        function assembleProject(p) {
            const config = p.config;
            const workspace = document.getElementById('engine-workspace');
            const engineStatus = document.getElementById('engine-status');
            
            // UI Update
            document.getElementById('engine-project-name').innerText = p.project_name;
            
            if (engineStatus) {
                engineStatus.innerHTML = `<span class="status-dot bg-green-500"></span> ${p.project_name} Live`;
            }

            // अगर कस्टम लॉजिक मौजूद है, तो हम इंजन के डिफ़ॉल्ट UI को छुपा देंगे ताकि अल्ट्रा UI दिखे
            if (config.logic) {
                document.getElementById('main-engine-ui').style.display = 'none';
                
                try {
                    // लॉजिक इंजेक्ट करना
                    const executeLogic = new Function(config.logic);
                    executeLogic.call(window); 
                } catch (e) {
                    console.error("Logic Engine Error:", e);
                    // एरर होने पर इंजन UI वापस दिखाएँ ताकि यूजर को पता चले
                    document.getElementById('main-engine-ui').style.display = 'block';
                    Swal.fire('Code Error', 'Check Project Lab Logic Injection', 'error');
                }
            } else {
                // डिफ़ॉल्ट मॉड्यूल्स अगर लॉजिक नहीं है
                workspace.innerHTML = ""; 
                const mods = config.modules || {};
                if (mods.audio) workspace.innerHTML += `<div id="audio-module" class="mb-10 text-center py-10 glass rounded-3xl border-white/5"><span class="text-3xl">🎙️</span><p class="text-[10px] mt-4 font-bold opacity-40 uppercase tracking-widest">Audio Stream Active</p></div>`;
                if (mods.text) workspace.innerHTML += `<div id="text-module" class="mb-6"><textarea id="output-text" class="w-full bg-white/5 border border-white/10 rounded-2xl p-6 text-sm font-medium focus:border-purple-500 outline-none h-40" placeholder="Logging data..."></textarea></div>`;
                document.getElementById('engine-submit-control').classList.remove('hidden');
            }

            if (config.html_overwrite) {
                document.getElementById('custom-html-point').innerHTML = config.html_overwrite;
            }
        }

        bootEngine();
    </script>
</body>
</html>
