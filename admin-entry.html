<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Console — Adatacore</title>
<meta name="robots" content="noindex,nofollow">
<style>html,body{margin:0;min-height:100%;background:#0c0b12;color:#c9c7d2;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;font-size:12px}</style>
</head>
<body><div class="boot">Loading protected Admin console…</div>
<script>
(async()=>{
  try{
    const response=await fetch('/admin-secure?finder=public-task-v3',{cache:'no-store'});
    if(!response.ok)throw new Error('Admin console returned '+response.status);
    let html=await response.text();
    const addons='<scr'+'ipt src="/admin-task-finder.js?v=20260831-2"></scr'+'ipt><scr'+'ipt src="/admin-project-inventory.js?v=20260901-1"></scr'+'ipt><scr'+'ipt src="/admin-project-lab-link.js?v=3"></scr'+'ipt><scr'+'ipt src="/admin-daily-task-limit.js?v=2"></scr'+'ipt>';
    html=html.replace('</body>',addons+'</body>');
    document.open();document.write(html);document.close();
  }catch(error){
    document.body.innerHTML='<div class="boot">Unable to load Admin console. '+String(error.message||error)+'</div>';
  }
})();
</script>
</body>
</html>
