<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Console — Adatacore</title>
<meta name="robots" content="noindex,nofollow">
<!-- recovery: stable admin shell -->
<script>try{const t=localStorage.getItem('adatacore-admin-theme');document.documentElement.dataset.adminTheme=t==='dark'?'dark':'light'}catch(_){document.documentElement.dataset.adminTheme='light'}</script>
<style>html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}html[data-admin-theme="light"],html[data-admin-theme="light"] body{background:#f4f6fb;color:#666}html[data-admin-theme="dark"],html[data-admin-theme="dark"] body{background:#0c0b12;color:#c9c7d2}.boot{min-height:100vh;display:grid;place-items:center;font-size:12px}</style>
</head>
<body><div class="boot">Loading protected Admin console…</div>
<script>
(async()=>{
  try{
    const response=await fetch('/admin-secure?finder=global-v6',{cache:'no-store'});
    if(!response.ok)throw new Error('Admin console returned '+response.status);
    let html=await response.text();
    let theme='light';try{theme=localStorage.getItem('adatacore-admin-theme')==='dark'?'dark':'light'}catch(_){ }
    html=html.replace('<html lang="en">',`<html lang="en" data-admin-theme="${theme}">`);
    html=html.replace('</head>','<link rel="stylesheet" href="/admin-theme.css?v=1"><link rel="stylesheet" href="/admin-clean-v2.css?v=20260904-1"></head>');
    html=html.replace('<a class="nav-link" href="/dashboard">Contributor view</a>','<a class="nav-link" href="/workspace">Contributor view</a>');
    const oldGuard=`async function guard(){const {data:{user}}=await db.auth.getUser();if(!user)return location.replace('/auth');currentAdminId=user.id;const {data:p}=await db.from('users').select('role,accountStatus').eq('id',user.id).single();if(p?.role!=='admin'||p?.accountStatus!=='active'){alert('Active admin access required');return location.replace('/dashboard')}await refresh()}`;
    const newGuard=`async function guard(){const {data:{user}}=await db.auth.getUser();if(!user)return location.replace('/auth');currentAdminId=user.id;const {data:access,error}=await db.rpc('get_my_admin_access');if(error||!access?.allowed)return location.replace('/workspace');window.__adatacoreAdminAccess=access;if(access.is_super_admin)await refresh()}`;
    if(!html.includes(oldGuard))throw new Error('Admin access guard signature changed; protected shell was not modified.');
    html=html.replace(oldGuard,newGuard);
    const addons='<scr'+'ipt src="/admin-theme.js?v=1"></scr'+'ipt><scr'+'ipt src="/admin-role-scope.js?v=20260902-1"></scr'+'ipt><scr'+'ipt src="/admin-contributor-switch.js?v=20260902-1"></scr'+'ipt><scr'+'ipt src="/admin-access-watch.js?v=20260902-1"></scr'+'ipt><scr'+'ipt src="/admin-trust-safety-link.js?v=2"></scr'+'ipt><scr'+'ipt src="/admin-task-finder.js?v=20260831-2"></scr'+'ipt><scr'+'ipt src="/admin-global-search.js?v=20260904-1"></scr'+'ipt><scr'+'ipt src="/admin-done-tasks-link.js?v=1"></scr'+'ipt><scr'+'ipt src="/admin-project-inventory.js?v=20260902-1"></scr'+'ipt><scr'+'ipt src="/admin-project-lab-link.js?v=3"></scr'+'ipt><scr'+'ipt src="/admin-daily-task-limit.js?v=2"></scr'+'ipt><scr'+'ipt src="/admin-ui-cleanup.js?v=1"></scr'+'ipt><scr'+'ipt src="/admin-nav-fix.js?v=4"></scr'+'ipt><scr'+'ipt src="/admin-assignment-center-link.js?v=2"></scr'+'ipt><scr'+'ipt src="/admin-operations-health.js?v=1"></scr'+'ipt><scr'+'ipt src="/admin-operations-suite.js?v=1"></scr'+'ipt><scr'+'ipt src="/admin-staff-roles.js?v=5"></scr'+'ipt><scr'+'ipt src="/admin-staff-revoke-all.js?v=1"></scr'+'ipt><scr'+'ipt src="/admin-finance-ledger.js?v=20260904-4"></scr'+'ipt><scr'+'ipt src="/admin-support-center.js?v=2"></scr'+'ipt><scr'+'ipt src="/admin-platform-navigation.js?v=1"></scr'+'ipt><scr'+'ipt src="/admin-applications-link.js?v=20260902-1"></scr'+'ipt><scr'+'ipt src="/admin-integrations-link.js?v=20260904-1"></scr'+'ipt><scr'+'ipt src="/admin-coreforge-link.js?v=20260903-1"></scr'+'ipt><scr'+'ipt src="/admin-clean-v2.js?v=20260904-1"></scr'+'ipt><scr'+'ipt src="/client-error-monitor.js?v=1"></scr'+'ipt>';
    html=html.replace('</body>',addons+'</body>');
    document.open();document.write(html);document.close();
  }catch(error){
    document.body.innerHTML='<div class="boot">Unable to load Admin console. '+String(error.message||error)+'</div>';
  }
})();
</script>
</body>
</html>
