<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>L2 Audio Audit — Adatacore</title>
<style>html,body{margin:0;min-height:100%;background:#f7f8fb;color:#171a22;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;font-size:12px}</style>
</head>
<body><div class="boot">Loading secure L2 review…</div>
<script>
(async()=>{
  try{
    const response=await fetch('/review-secure?ui=task-id-v1',{cache:'no-store'});
    if(!response.ok)throw new Error('Review workspace returned '+response.status);
    let html=await response.text();
    html=html.replace('</body>','<scr'+'ipt src="/task-id-copy.js?v=20260901-1"></scr'+'ipt></body>');
    document.open();document.write(html);document.close();
  }catch(error){document.body.innerHTML='<div class="boot">Unable to load L2 review. '+String(error.message||error)+'</div>'}
})();
</script>
</body>
</html>
